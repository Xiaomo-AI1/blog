<!DOCTYPE html>
<!-- 拾光实验室 v1.0.1 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光实验室 - 自己动手做的工具</title>
<style>
:root{
  --bg:#f2f5f7; --card:#ffffff; --ink:#22303e; --muted:#6d7f91;
  --brand:#0f5e8f; --brand-dk:#0b4568; --accent:#f5a623; --line:#e2e9ef;
  --ok:#1e8e5a; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
/* 顶栏 */
.topbar{position:sticky;top:0;z-index:50;background:var(--brand-dk);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand h1{margin:0;font-size:20px;letter-spacing:1px}
.brand small{display:block;font-size:12px;color:#cfe3f2;font-weight:400;margin-top:2px}
.search{margin-left:auto;display:flex;gap:8px}
.search input{padding:9px 12px;border:0;border-radius:8px;width:230px;font-size:14px}
.search button{padding:9px 14px;border:0;border-radius:8px;background:var(--accent);color:#3a2b00;font-weight:700;cursor:pointer}
/* 主体 */
.layout{display:flex;max-width:1200px;margin:0 auto;padding:18px;gap:18px;align-items:flex-start}
/* 侧边栏 */
.sidebar{width:210px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;position:sticky;top:76px}
.sidebar h2{font-size:14px;color:var(--muted);margin:6px 8px 10px;font-weight:600}
.cat{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:11px 10px;border-radius:9px;font-size:15px;cursor:pointer;color:var(--ink);text-align:left}
.cat .n{margin-left:auto;background:#eef2f6;color:var(--muted);font-size:12px;border-radius:20px;padding:2px 9px}
.cat.active{background:var(--brand);color:#fff}
.cat.active .n{background:rgba(255,255,255,.22);color:#fff}
/* 内容区 */
.main{flex:1;min-width:0}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.tool-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.tool-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(15,94,143,.12)}
.tool-card .ic{width:44px;height:44px;border-radius:10px;background:#e8f1f8;color:var(--brand);font-size:22px;display:flex;align-items:center;justify-content:center;font-weight:700}
.tool-card h3{margin:10px 0 6px;font-size:16px}
.tool-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.empty{color:var(--muted);padding:30px;text-align:center}
/* 工具详情 */
.toolview{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;max-width:640px}
.toolview h2{margin:0 0 4px}
.toolview .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.back{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;margin-bottom:16px;font-size:14px}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:14px;margin-bottom:6px;font-weight:600}
.frow input,.frow select,.frow textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.frow textarea{resize:vertical;min-height:76px;font-family:inherit}
.frow .hint{font-size:12px;color:var(--muted);margin-top:4px}
.frow2{display:flex;gap:10px}
.frow2>div{flex:1}
.calcbtn{width:100%;padding:12px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.calcbtn:hover{background:var(--brand-dk)}
.result{margin-top:16px;background:#eef7f0;border:1px solid #cde8d6;border-radius:9px;padding:14px;display:none}
.result.show{display:block}
.result .big{font-size:22px;font-weight:800;color:var(--ok)}
.result .row{font-size:14px;margin-top:6px}
.formula{margin-top:14px;background:#f7fafc;border:1px dashed var(--line);border-radius:9px;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.7}
.formula b{color:var(--ink)}
.warn{margin-top:12px;font-size:12px;color:#a07400;background:#fff8e6;border:1px solid #f0dfae;border-radius:8px;padding:9px 12px}
table.ref{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
table.ref th,table.ref td{border:1px solid var(--line);padding:8px;text-align:center}
table.ref th{background:#eef2f6}
/* 页脚 */
footer{max-width:1200px;margin:26px auto 40px;padding:0 18px;color:var(--muted);font-size:13px;line-height:1.8}
footer .disc{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:14px 16px}
/* 手机 */
@media(max-width:820px){
  .layout{flex-direction:column;padding:12px}
  .sidebar{width:100%;position:static;display:flex;gap:8px;overflow-x:auto;padding:10px}
  .sidebar h2{display:none}
  .cat{white-space:nowrap;width:auto}
  .cat .n{display:none}
  .search{width:100%;margin-left:0}
  .search input{flex:1;width:auto}
}
/* 手机 ≤640px：只做移动端优化，桌面端不受影响 */
@media(max-width:640px){
  body{overflow-x:clip}
  /* 顶栏 */
  .topbar{padding:10px 14px;gap:10px}
  .brand h1{font-size:18px}
  .search input{font-size:16px;padding:11px 12px} /* iOS: <16px 聚焦会缩放 */
  .search button{min-height:44px;padding:11px 16px}
  /* 主体 */
  .layout{padding:10px;gap:12px}
  .sidebar{padding:8px;-webkit-overflow-scrolling:touch}
  /* 工具网格：手机 2 列小卡 */
  .tool-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .tool-card{padding:12px;-webkit-tap-highlight-color:transparent}
  .tool-card .ic{width:38px;height:38px;font-size:19px;border-radius:9px}
  .tool-card h3{font-size:15px;margin:8px 0 4px}
  .tool-card p{font-size:12px}
  /* 工具详情 */
  .toolview{padding:16px}
  .toolview h2{font-size:19px}
  .back{min-height:44px;font-size:15px;padding:10px 16px}
  .frow input,.frow select,.frow textarea{font-size:16px;padding:11px 12px} /* iOS 防缩放 */
  .frow2{gap:8px}
  .frow2>div{min-width:0}
  .calcbtn{min-height:48px}
  .result{overflow-x:auto;overflow-wrap:anywhere}
  .formula{overflow-wrap:anywhere;word-break:break-word}
  .toolview table{max-width:100%}
  .toolview th,.toolview td{word-break:break-word}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
}
.cat-tag{display:inline-block;margin-top:8px;font-size:12px;color:#41617a;background:#eaf1f6;border-radius:20px;padding:2px 10px;line-height:1.6}.catchip{grid-column:1/-1;background:#eef4fa;border:1px solid #cfe0ee;border-radius:10px;padding:10px 14px;font-size:14px;color:#33506b}.catchip button{margin-left:8px;background:#1a3f5c;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><h1>拾光实验室</h1></div>
  <div class="search"><input id="q" type="search" placeholder="搜索工具，如：功率、色环"><button id="qbtn" type="button">搜索</button></div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar"><h2>工具分类</h2></aside>
  <main class="main">
    <div id="home">
      <div class="tool-grid" id="grid"></div>
      <div class="empty" id="empty" hidden>没有找到相关工具，换个关键词试试。</div>
    </div>
    <div class="toolview" id="toolview" hidden></div>
  </main>
</div>
<footer>
  <div class="disc">免责声明：本站工具仅供学习交流，结果仅供参考。本站所有工具均为自主开发的纯前端小工具，不收集任何个人数据。</div>
  <p style="text-align:center">拾光实验室 · lab.shmily.work</p>
</footer>
<script>
"use strict";
/* ============ 纯计算函数（无 DOM 依赖，可单独测试） ============ */
/* CALC-BEGIN */
function num(x){ const v=parseFloat(x); return isFinite(v)?v:NaN; }
function trim(x, d){ if(!isFinite(x)) return "—"; const p=Math.pow(10, d==null?4:d); return String(Math.round(x*p)/p); }

/* 1. 欧姆定律：V=I*R，任意给两个求第三个 */
function calcOhm(p){
  const vals={};
  ["V","I","R"].forEach(k=>{ const v=num(p[k]); if(isFinite(v)) vals[k]=v; });
  const keys=Object.keys(vals);
  if(keys.length!==2) return {ok:false, msg:"请恰好输入其中两个量（电压、电流、电阻）"};
  let V=vals.V, I=vals.I, R=vals.R;
  if(V===undefined){ if(R===0) return {ok:false,msg:"电阻不能为 0"}; V=I*R; }
  else if(I===undefined){ if(R===0) return {ok:false,msg:"电阻不能为 0"}; I=V/R; }
  else { if(I===0) return {ok:false,msg:"电流不能为 0"}; R=V/I; }
  return {ok:true, V:V, I:I, R:R};
}

/* 2. 功率：单相 P=U*I*cosφ；三相 P=√3*U*I*cosφ；可反求电流 */
function calcPower(p){
  const U=num(p.U), cos=num(p.cos);
  const three = p.phase==="3";
  const k = three ? Math.sqrt(3) : 1;
  if(!(U>0)) return {ok:false, msg:"电压必须大于 0"};
  if(!(cos>0 && cos<=1)) return {ok:false, msg:"功率因数应在 (0,1] 之间"};
  if(p.mode==="I"){
    const P=num(p.P);
    if(!(P>=0)) return {ok:false, msg:"功率无效"};
    return {ok:true, mode:"I", I:P/(k*U*cos)};
  }
  const I=num(p.I);
  if(!(I>=0)) return {ok:false, msg:"电流无效"};
  const P=k*U*I*cos;
  return {ok:true, mode:"P", P:P};
}

/* 3. 电压降：铜ρ=0.0172 / 铝ρ=0.0283；单相 ΔU=2ρLI/S；三相 ΔU=√3ρLI/S */
function calcVDrop(p){
  const rho = p.mat==="al" ? 0.0283 : 0.0172;
  const L=num(p.L), I=num(p.I), S=num(p.S), Un=num(p.Un);
  const three = p.phase==="3";
  if(!(L>0&&I>0&&S>0&&Un>0)) return {ok:false, msg:"线路长度、电流、截面、额定电压都必须大于 0"};
  const dU=(three?Math.sqrt(3):2)*rho*L*I/S;
  return {ok:true, dU:dU, pct:dU/Un*100, rho:rho};
}

/* 4. 导线载流量参考表（BV 铜芯，单位 A） */
var WIRE_TABLE=[
  {s:1.5,a:18},{s:2.5,a:26},{s:4,a:34},{s:6,a:44},{s:10,a:61},
  {s:16,a:80},{s:25,a:105},{s:35,a:130},{s:50,a:160}
];
function wireAmpacity(s){
  const v=num(s);
  const r=WIRE_TABLE.find(function(x){return x.s===v;});
  return r?r.a:null;
}

/* 5. 空开选型：In ≥ 1.25×Iz，向上取标准规格 */
var BREAKER_SIZES=[6,10,16,20,25,32,40,50,63,80,100];
function breakerSize(Iz){
  const iz=num(Iz);
  if(!(iz>0)) return {ok:false, msg:"负载电流必须大于 0"};
  const need=1.25*iz;
  const rec=BREAKER_SIZES.find(function(x){return x>=need;});
  if(rec===undefined) return {ok:true, need:need, rec:null};
  return {ok:true, need:need, rec:rec};
}

/* 6. 电费：kWh=kW×h；费用=kWh×单价 */
function calcBill(p){
  const P=num(p.P), hh=num(p.h), price=num(p.price);
  if(!(P>=0&&hh>=0&&price>=0)) return {ok:false, msg:"请输入有效的非负数"};
  const kwh=P*hh;
  return {ok:true, kwh:kwh, cost:kwh*price};
}

/* 7. 电阻色环：四环/五环 */
var COLOR_DIGIT={黑:0,棕:1,红:2,橙:3,黄:4,绿:5,蓝:6,紫:7,灰:8,白:9};
var COLOR_MULT={黑:1,棕:10,红:100,橙:1e3,黄:1e4,绿:1e5,蓝:1e6,紫:1e7,灰:1e8,白:1e9,金:0.1,银:0.01};
var COLOR_TOL={棕:1,红:2,绿:0.5,蓝:0.25,紫:0.1,金:5,银:10};
function fmtR(ohms){
  if(ohms>=1e6) return trim(ohms/1e6)+"MΩ";
  if(ohms>=1e3) return trim(ohms/1e3)+"kΩ";
  return trim(ohms)+"Ω";
}
function calcResistor(p){
  const cs=p.colors||[];
  function dig(c){ return COLOR_DIGIT[c]; }
  var base, mult, tol;
  if(p.bands===5){
    if(cs.length!==5) return {ok:false,msg:"五环需选择 5 种颜色"};
    if(dig(cs[0])==null||dig(cs[1])==null||dig(cs[2])==null) return {ok:false,msg:"前三环须为数字环颜色（黑～白）"};
    if(COLOR_MULT[cs[3]]==null) return {ok:false,msg:"第四环须为倍率环颜色"};
    base=dig(cs[0])*100+dig(cs[1])*10+dig(cs[2]); mult=COLOR_MULT[cs[3]];
    tol = cs[4]==="无" ? 20 : COLOR_TOL[cs[4]];
    if(tol==null) return {ok:false,msg:"第五环须为误差环颜色"};
  }else{
    if(cs.length!==4) return {ok:false,msg:"四环需选择 4 种颜色"};
    if(dig(cs[0])==null||dig(cs[1])==null) return {ok:false,msg:"前两环须为数字环颜色（黑～白）"};
    if(COLOR_MULT[cs[2]]==null) return {ok:false,msg:"第三环须为倍率环颜色"};
    base=dig(cs[0])*10+dig(cs[1]); mult=COLOR_MULT[cs[2]];
    tol = cs[3]==="无" ? 20 : COLOR_TOL[cs[3]];
    if(tol==null) return {ok:false,msg:"第四环须为误差环颜色"};
  }
  const ohms=base*mult;
  return {ok:true, ohms:ohms, tol:tol, text:fmtR(ohms)};
}

/* 8. 功率因数补偿：Qc=P(tanφ1−tanφ2)；C=Qc/(2πfU²)，f=50Hz */
function calcPFC(p){
  const P=num(p.P), cos1=num(p.cos1), cos2=num(p.cos2), U=num(p.U);
  const f=num(p.f)||50;
  if(!(P>0&&U>0)) return {ok:false, msg:"有功功率和电压必须大于 0"};
  if(!(cos1>0&&cos1<1)) return {ok:false, msg:"当前功率因数应在 (0,1) 之间"};
  if(!(cos2>0&&cos2<=1)) return {ok:false, msg:"目标功率因数应在 (0,1] 之间"};
  if(cos2<=cos1) return {ok:false, msg:"目标功率因数应大于当前功率因数"};
  const t1=Math.tan(Math.acos(cos1)), t2=Math.tan(Math.acos(cos2));
  const Qc=P*(t1-t2); /* kvar */
  const C=Qc*1000/(2*Math.PI*f*U*U); /* F */
  return {ok:true, Qc:Qc, uF:C*1e6};
}

/* 9. 电工单位换算 */
var UNIT_CATS={
  volt:  {name:"电压", units:{"mV":0.001,"V":1,"kV":1000}},
  amp:   {name:"电流", units:{"mA":0.001,"A":1,"kA":1000}},
  watt:  {name:"功率", units:{"W":1,"kW":1000,"MW":1e6}},
  ohm:   {name:"电阻", units:{"Ω":1,"kΩ":1000,"MΩ":1e6}},
  energy:{name:"电能", units:{"J":1,"kWh":3.6e6}}
};
function convertUnit(cat, val, from, to){
  const u=UNIT_CATS[cat];
  if(!u) return {ok:false, msg:"未知类别"};
  const v=num(val), f1=u.units[from], f2=u.units[to];
  if(!isFinite(v)||f1==null||f2==null) return {ok:false, msg:"输入无效"};
  return {ok:true, result:v*f1/f2};
}

/* 10. 星三角启动估算：星形启动电流≈1/3 直接启动电流，转矩≈1/3 */
function calcStarDelta(p){
  const Id=num(p.Id);
  if(!(Id>0)) return {ok:false, msg:"三角形直接启动电流必须大于 0"};
  const r={ok:true, Id:Id, Is:Id/3};
  const Td=num(p.Td);
  if(p.Td!=null && p.Td!==""){
    if(!(Td>0)) return {ok:false, msg:"直接启动转矩必须大于 0"};
    r.Td=Td; r.Ts=Td/3;
  }
  return r;
}
/* CALC-END */

/* ============ 界面层 ============ */
var CATS=[
  {id:"dgjs", name:"电工计算"},
  {id:"yqj",  name:"元器件"},
  {id:"dwhs", name:"单位换算"}
];
function catName(id){ const c=CATS.find(function(x){return x.id===id;}); return c?c.name:id; }

var TOOLS=[
 {id:"ohm", cat:"dgjs", icon:"Ω", name:"欧姆定律计算器", desc:"输入电压、电流、电阻中任意两个，求第三个",
  formula:"V = I × R；已知任意两个量即可求第三个。"},
 {id:"power", cat:"dgjs", icon:"P", name:"功率计算", desc:"单相/三相功率与电流互求",
  formula:"单相：P = U × I × cosφ；三相：P = √3 × U × I × cosφ。反求电流时 I = P ÷ (k × U × cosφ)。"},
 {id:"vdrop", cat:"dgjs", icon:"↓", name:"电压降计算", desc:"按导线材质、长度、电流、截面算压降",
  formula:"单相 ΔU = 2ρLI ÷ S；三相 ΔU = √3·ρLI ÷ S；压降百分比 = ΔU ÷ 额定电压 × 100%。铜 ρ=0.0172，铝 ρ=0.0283（Ω·mm²/m）。"},
 {id:"breaker", cat:"dgjs", icon:"⎋", name:"空开选型", desc:"按负载电流推荐断路器规格",
  formula:"脱扣器额定电流 In ≥ 1.25 × 负载电流 Iz，向上取最接近的标准规格。"},
 {id:"bill", cat:"dgjs", icon:"¥", name:"电费计算器", desc:"按功率、用电时长和单价算电费",
  formula:"用电量(kWh) = 功率(kW) × 小时数；电费 = 用电量 × 单价。"},
 {id:"pfc", cat:"dgjs", icon:"φ", name:"功率因数补偿", desc:"算需要补偿的无功和电容容量",
  formula:"Qc = P × (tanφ₁ − tanφ₂)；C = Qc ÷ (2πfU²)，f 取 50Hz。φ = arccos(cosφ)。"},
 {id:"stardelta", cat:"dgjs", icon:"Y", name:"星三角启动估算", desc:"估算星形启动的电流与转矩",
  formula:"星形启动电流 ≈ 三角形直接启动电流 × 1/3；星形启动转矩 ≈ 直接启动转矩 × 1/3。"},
 {id:"wire", cat:"yqj", icon:"≈", name:"导线载流量查询", desc:"常用 BV 铜芯导线载流量参考表",
  formula:"表中为 BV 铜芯导线明敷、环境温度 25℃ 左右的参考载流量，实际选型请以电气规范为准。"},
 {id:"resistor", cat:"yqj", icon:"▬", name:"电阻色环识别", desc:"四环/五环色环换算阻值",
  formula:"数字环：黑0棕1红2橙3黄4绿5蓝6紫7灰8白9；倍率环：黑×1…白×10⁹，金×0.1，银×0.01；误差环：棕±1%、红±2%、金±5%、银±10%、无色±20%。"},
 {id:"units", cat:"dwhs", icon:"⇄", name:"电工单位换算", desc:"电压/电流/功率/电阻/电能单位互转",
  formula:"1kV=1000V，1kA=1000A，1MW=1000kW=10⁶W，1MΩ=1000kΩ=10⁶Ω，1kWh=3.6×10⁶J。"}
];

function $(sel, root){ return (root||document).querySelector(sel); }
function field(label, inner, hint, fid, when){
  return '<div class="frow"'+(fid?' id="fw_'+fid+'"':"")+(when?" data-when='"+when+"'":"")+'><label>'+label+'</label>'+inner+
    (hint?'<div class="hint">'+hint+'</div>':"")+'</div>';
}
function showRes(html){
  const r=$("#result"); r.innerHTML=html; r.classList.add("show");
}
function showErr(msg){ showRes('<div style="color:#b3261e">⚠ '+msg+'</div>'); }

function shell(tool){
  const v=$("#toolview");
  v.innerHTML='<button class="back" id="backBtn" type="button">← 返回全部工具</button>'+
    "<h2>"+tool.name+"</h2><div class='sub'>"+tool.desc+"</div>"+
    '<div id="tform"></div>'+
    '<button class="calcbtn" id="calcBtn" type="button">计算</button>'+
    '<div class="result" id="result"></div>'+
    '<div class="formula"><b>所用公式</b><br>'+tool.formula+"</div>"+
    '<div class="warn">⚠ 本工具结果仅供学习参考，实际工程应用请以相关规范、手册和实测为准。</div>';
  $("#backBtn").onclick=showHome;
  return $("#tform");
}

resistor:function(tool){
  const f=shell(tool);
  const digits=["黑","棕","红","橙","黄","绿","蓝","紫","灰","白"];
  const mults=digits.concat(["金","银"]);
  const tols=["棕","红","绿","蓝","紫","金","银","无"];
  function opts(arr, def){ return arr.map(function(c){return '<option'+(c===def?' selected':"")+'>'+c+'</option>';}).join(""); }
  f.innerHTML=
    field("色环数", '<select id="rBands"><option value="4">四环</option><option value="5">五环</option></select>')+
    '<div id="rRings"></div>';
  function drawRings(){
    const n=parseInt(val("rBands"),10);
    let h="";
    const ringNames = n===5 ? ["第一环（数字）","第二环（数字）","第三环（数字）","第四环（倍率）","第五环（误差）"]
                            : ["第一环（数字）","第二环（数字）","第三环（倍率）","第四环（误差）"];
    for(let i=0;i<n;i++){
      const isDig = n===5 ? i<3 : i<2;
      const isMult = n===5 ? i===3 : i===2;
      const arr = isDig?digits:(isMult?mults:tols);
      h+=field(ringNames[i], '<select id="rC'+i+'">'+opts(arr)+'</select>');
    }
    $("#rRings").innerHTML=h;
  }
  $("#rBands").onchange=drawRings; drawRings();
  $("#calcBtn").onclick=function(){
    const n=parseInt(val("rBands"),10);
    const cs=[]; for(let i=0;i<n;i++) cs.push(val("rC"+i));
    const r=calcResistor({bands:n, colors:cs});
    if(!r.ok) return showErr(r.msg);
    const lo=r.ohms*(1-r.tol/100), hi=r.ohms*(1+r.tol/100);
    showRes('<div class="big">'+r.text+'　±'+r.tol+'%</div>'+
      '<div class="row">阻值范围：'+fmtR(lo)+' ～ '+fmtR(hi)+'</div>');
  };
},

/* ===== 数据驱动工具引擎（批量工具用：工具只需提供 inputs + run，渲染器自动生成表单） ===== */
function renderDataTool(tool){
  const f=shell(tool);
  let html='';
  (tool.inputs||[]).forEach(function(inp){
    let inner;
    if(inp.type==='select'){
      inner='<select id="d_'+inp.id+'">'+inp.options.map(function(o){
        return '<option value="'+o.v+'"'+(String(o.v)===String(inp.def||'')?' selected':'')+'>'+o.t+'</option>';
      }).join('')+'</select>';
    }else if(inp.type==='textarea'){
      inner='<textarea id="d_'+inp.id+'" placeholder="'+(inp.ph||'')+'">'+(inp.def||'')+'</textarea>';
    }else if(inp.type==='text'){
      inner='<input id="d_'+inp.id+'" placeholder="'+(inp.ph||'')+'"'+(inp.def!==undefined?' value="'+inp.def+'"':'')+'>';
    }else{
      inner='<input id="d_'+inp.id+'" inputmode="decimal" placeholder="'+(inp.ph||'')+'"'+(inp.def!==undefined?' value="'+inp.def+'"':'')+'>';
    }
    html+=field(inp.label+(inp.unit?'（'+inp.unit+'）':''), inner, inp.hint, inp.id, inp.when);
  });
  f.innerHTML=html;
  function applyWhen(){
    (tool.inputs||[]).forEach(function(inp){
      if(!inp.when) return;
      const ps=inp.when.split('='), ctrl=document.getElementById('d_'+ps[0]);
      const show=ctrl&&ps[1].split(',').indexOf(ctrl.value)>=0;
      const w=document.getElementById('fw_'+inp.id);
      if(w) w.style.display=show?'':'none';
    });
  }
  (tool.inputs||[]).forEach(function(inp){
    if(!inp.when) return;
    const c=document.getElementById('d_'+inp.when.split('=')[0]);
    if(c&&!c._wb){c._wb=true;c.addEventListener('change',applyWhen);}
  });
  applyWhen();
  $("#calcBtn").onclick=function(){
    const vals={}, order=[];
    for(const inp of (tool.inputs||[])){
      const e=document.getElementById('d_'+inp.id);
      const raw=e?e.value.trim():'';
      const w=document.getElementById('fw_'+inp.id);
      if(w&&w.style.display==='none'){
        vals[inp.id]=(inp.type==='select'||inp.type==='text'||inp.type==='textarea')?raw:(raw===''?null:Number(raw));
        order.push(inp.id); continue;
      }
      if(inp.type==='select'){ vals[inp.id]=raw; order.push(inp.id); continue; }
      if(inp.type==='text'||inp.type==='textarea'){
        if(raw===''&&!inp.optional) return showErr('请填写「'+inp.label+'」');
        vals[inp.id]=raw; order.push(inp.id); continue;
      }
      if(raw===''&&!inp.optional) return showErr('请填写「'+inp.label+'」');
      if(raw!==''){
        const n=Number(raw);
        if(!isFinite(n)) return showErr('「'+inp.label+'」请输入有效数字');
        if(inp.min!==undefined&&n<inp.min) return showErr('「'+inp.label+'」不能小于 '+inp.min);
        if(inp.max!==undefined&&n>inp.max) return showErr('「'+inp.label+'」不能大于 '+inp.max);
        vals[inp.id]=n;
      }else vals[inp.id]=null;
      order.push(inp.id);
    }
    let out;
    try{
      const fn=new Function(order.join(','), '"use strict";'+tool.run);
      out=fn.apply(null, order.map(function(k){return vals[k];}));
    }catch(err){ return showErr('计算出错，请检查输入'); }
    if(!out||!out.ok) return showErr((out&&out.msg)||'输入有误，请检查');
    showRes(out.html);
  };
}

  inputs:[{id:"kwh", label:"月用电量", unit:"kWh", def:"700", min:0},{id:"t1", label:"一档上限", unit:"kWh", def:"260", min:1},{id:"t2", label:"二档上限", unit:"kWh", def:"600", min:1},{id:"p1", label:"一档单价", unit:"元", def:"0.6", min:0},{id:"p2", label:"二档单价", unit:"元", def:"0.65", min:0},{id:"p3", label:"三档单价", unit:"元", def:"0.9", min:0}],
  run:"var kwh=Number(kwh),t1=Number(t1),t2=Number(t2),p1=Number(p1),p2=Number(p2),p3=Number(p3); if(t2<=t1) return {ok:false,msg:'二档上限须大于一档上限'}; var a=Math.min(kwh,t1),b=Math.min(Math.max(kwh-t1,0),t2-t1),c=Math.max(kwh-t2,0); var tot=a*p1+b*p2+c*p3; return {ok:true,html:'<div class=\"big\">电费 '+tot.toFixed(2)+' 元</div><div class=\"row\">一档'+a.toFixed(0)+'度 二档'+b.toFixed(0)+'度 三档'+c.toFixed(0)+'度</div>'};",
  test:{inputs:{kwh:700,t1:260,t2:600,p1:0.6,p2:0.65,p3:0.9}, expect:"467.00"}},
 {id:"dgenergy", cat:"dgjs", icon:"🔋", name:"电能/用电量", desc:"功率乘时间得千瓦时",
  formula:"W=P·t",
  inputs:[{id:"p", label:"功率", unit:"kW", def:"2", min:0},{id:"t", label:"时间", unit:"h", def:"5", min:0}],
  run:"return {ok:true,html:'<div class=\"big\">用电量 '+(Number(p)*Number(t)).toFixed(2)+' kWh（度）</div>'};",
  test:{inputs:{p:2,t:5}, expect:"10.00"}},
 {id:"dgledres", cat:"dgjs", icon:"💡", name:"LED限流电阻", desc:"LED串联电阻阻值与功率",
  formula:"R=(Vs−Vf)/If",
  inputs:[{id:"vs", label:"电源电压", unit:"V", def:"5", min:0.1},{id:"vf", label:"LED正向压降", unit:"V", def:"2", min:0.1},{id:"ifma", label:"工作电流", unit:"mA", def:"20", min:0.1}],
  run:"var vs=Number(vs),vf=Number(vf),ifa=Number(ifma)/1000; if(!(ifa>0)) return {ok:false,msg:\'工作电流须大于0\'}; if(vs<=vf) return {ok:false,msg:'电源电压须大于LED压降'}; var R=(vs-vf)/ifa,Pw=(vs-vf)*ifa; return {ok:true,html:'<div class=\"big\">R = '+R.toFixed(0)+' Ω</div><div class=\"row\">电阻功耗 '+Pw.toFixed(3)+' W，选1/4W以上</div>'};",
  test:{inputs:{vs:5,vf:2,ifma:20}, expect:"150"}},
 {id:"dgfuse", cat:"dgjs", icon:"🧨", name:"熔断器选型", desc:"按负载类型选熔体额定电流",
  formula:"电机负载按2倍额定电流；照明/电阻负载按1.1倍",
  inputs:[{id:"i", label:"负载额定电流", unit:"A", def:"10", min:0.1},{id:"kind", label:"负载类型", type:"select", options:[{v:"motor",t:"电机负载"},{v:"light",t:"照明/电阻负载"}]}],
  run:"var i=Number(i); if(!(i>0)) return {ok:false,msg:'电流必须大于0'}; var rec=kind=='motor'?2*i:1.1*i; return {ok:true,html:'<div class=\"big\">选 '+rec.toFixed(0)+' A 熔体</div><div class=\"row\">'+(kind=='motor'?'电机启动电流大，按2倍额定电流':'按1.1倍额定电流')+'</div>'};",
  test:{inputs:{i:10,kind:"motor"}, expect:"20"}},
 {id:"dgrcd", cat:"dgjs", icon:"🛡️", name:"漏保动作电流选择", desc:"按用途选漏电保护器动作电流",
  formula:"查表：人身保护≤30mA；干线100mA；防火300mA",
  inputs:[{id:"use", label:"用途", type:"select", options:[{v:"person",t:"人身/插座保护"},{v:"main",t:"干线/分级保护"},{v:"fire",t:"防火保护"}]}],
  run:"var m={person:'30mA（0.1s内动作）',main:'100mA',fire:'300mA'}; return {ok:true,html:'<div class=\"big\">选 '+m[use]+'</div><div class=\"row\">直接接触防护须用高灵敏度30mA</div>'};",
  test:{inputs:{use:"person"}, expect:"30mA"}},
 {id:"dgcontactor", cat:"dgjs", icon:"🔘", name:"交流接触器选型", desc:"按三相电机功率选接触器电流档",
  formula:"380V电机：3kW→9A；5.5kW→12A；7.5kW→18A；11kW→25A；15kW→32A；22kW→50A",
  inputs:[{id:"p", label:"电机功率", unit:"kW", def:"7.5", min:0.1}],
  run:"var p=Number(p); if(!(p>0)) return {ok:false,msg:'功率必须大于0'}; var c=p<=3?'9A':p<=5.5?'12A':p<=7.5?'18A':p<=11?'25A':p<=15?'32A':p<=22?'50A':'65A及以上'; return {ok:true,html:'<div class=\"big\">选 '+c+' 接触器</div><div class=\"row\">AC-3使用类别，380V三相电机参考</div>'};",
  test:{inputs:{p:7.5}, expect:"18A"}},
 {id:"dgct", cat:"dgjs", icon:"🔄", name:"电流互感器换算", desc:"一次电流折算二次电流",
  formula:"I₂=I₁×二次额定/一次额定",
  inputs:[{id:"i1", label:"一次实际电流", unit:"A", def:"80", min:0},{id:"prim", label:"一次额定", unit:"A", def:"100", min:1},{id:"sec", label:"二次额定", type:"select", options:[{v:"5",t:"5A"},{v:"1",t:"1A"}]}],
  run:"var i1=Number(i1),prim=Number(prim),sec=Number(sec); if(!(prim>0)) return {ok:false,msg:'一次额定须大于0'}; var i2=i1*sec/prim; return {ok:true,html:'<div class=\"big\">二次电流 '+i2.toFixed(2)+' A</div><div class=\"row\">变比 '+prim+'/'+sec+'A</div>'};",
  test:{inputs:{i1:80,prim:100,sec:"5"}, expect:"4.00"}},
 {id:"dgdeltay", cat:"dgjs", icon:"🔺", name:"△→Y变换", desc:"对称三角形负载转星形等效",
  formula:"RY=R△/3（对称）",
  inputs:[{id:"r", label:"三角形每相电阻", unit:"Ω", def:"30", min:0.001}],
  run:"var r=Number(r); if(!(r>0)) return {ok:false,msg:'电阻必须大于0'}; return {ok:true,html:'<div class=\"big\">Y形每相 '+(r/3).toFixed(2)+' Ω</div>'};",
  test:{inputs:{r:30}, expect:"10.00"}},
 {id:"dgydelta", cat:"dgjs", icon:"⭐", name:"Y→△变换", desc:"对称星形负载转三角形等效",
  formula:"R△=3·RY（对称）",
  inputs:[{id:"r", label:"星形每相电阻", unit:"Ω", def:"10", min:0.001}],
  run:"var r=Number(r); if(!(r>0)) return {ok:false,msg:'电阻必须大于0'}; return {ok:true,html:'<div class=\"big\">△形每相 '+(r*3).toFixed(2)+' Ω</div>'};",
  test:{inputs:{r:10}, expect:"30.00"}},
 {id:"dgrespar", cat:"dgjs", icon:"➗", name:"电阻并联", desc:"两个电阻并联总阻值",
  formula:"R=R₁R₂/(R₁+R₂)",
  inputs:[{id:"r1", label:"R₁", unit:"Ω", def:"100", min:0.001},{id:"r2", label:"R₂", unit:"Ω", def:"100", min:0.001}],
  run:"var r1=Number(r1),r2=Number(r2); if(!(r1>0&&r2>0)) return {ok:false,msg:'电阻必须大于0'}; return {ok:true,html:'<div class=\"big\">R = '+(r1*r2/(r1+r2)).toFixed(2)+' Ω</div>'};",
  test:{inputs:{r1:100,r2:100}, expect:"50.00"}},
 {id:"dgresser", cat:"dgjs", icon:"➕", name:"电阻串联", desc:"两个电阻串联总阻值",
  formula:"R=R₁+R₂",
  inputs:[{id:"r1", label:"R₁", unit:"Ω", def:"100", min:0},{id:"r2", label:"R₂", unit:"Ω", def:"100", min:0}],
  run:"return {ok:true,html:'<div class=\"big\">R = '+(Number(r1)+Number(r2)).toFixed(2)+' Ω</div>'};",
  test:{inputs:{r1:100,r2:100}, expect:"200.00"}},
 {id:"dgdivv", cat:"dgjs", icon:"🔻", name:"分压计算", desc:"串联电阻分压",
  formula:"U₂=U·R₂/(R₁+R₂)",
  inputs:[{id:"u", label:"总电压", unit:"V", def:"12", min:0},{id:"r1", label:"R₁", unit:"Ω", def:"1000", min:0.001},{id:"r2", label:"R₂", unit:"Ω", def:"2000", min:0.001}],
  run:"var u=Number(u),r1=Number(r1),r2=Number(r2); return {ok:true,html:'<div class=\"big\">U₂ = '+(u*r2/(r1+r2)).toFixed(2)+' V</div><div class=\"row\">U₁ = '+(u*r1/(r1+r2)).toFixed(2)+' V</div>'};",
  test:{inputs:{u:12,r1:1000,r2:2000}, expect:"8.00"}},
 {id:"dgdivi", cat:"dgjs", icon:"🔀", name:"分流计算", desc:"并联电阻分流",
  formula:"I₂=I·R₁/(R₁+R₂)",
  inputs:[{id:"i", label:"总电流", unit:"A", def:"3", min:0},{id:"r1", label:"R₁", unit:"Ω", def:"100", min:0.001},{id:"r2", label:"R₂", unit:"Ω", def:"200", min:0.001}],
  run:"var i=Number(i),r1=Number(r1),r2=Number(r2); return {ok:true,html:'<div class=\"big\">I₂ = '+(i*r1/(r1+r2)).toFixed(2)+' A</div><div class=\"row\">I₁ = '+(i*r2/(r1+r2)).toFixed(2)+' A</div>'};",
  test:{inputs:{i:3,r1:100,r2:200}, expect:"1.00"}},
 {id:"dgmaxpower", cat:"dgjs", icon:"🎯", name:"最大功率传输", desc:"负载匹配时的最大输出功率",
  formula:"RL=R₀时 Pmax=Uₛ²/(4R₀)",
  inputs:[{id:"us", label:"电源电压", unit:"V", def:"12", min:0.01},{id:"r0", label:"电源内阻", unit:"Ω", def:"6", min:0.001}],
  run:"var us=Number(us),r0=Number(r0); if(!(us>0&&r0>0)) return {ok:false,msg:'参数必须大于0'}; return {ok:true,html:'<div class=\"big\">Pmax = '+(us*us/(4*r0)).toFixed(2)+' W</div><div class=\"row\">负载取 RL='+r0+' Ω 时获得</div>'};",
  test:{inputs:{us:12,r0:6}, expect:"6.00"}},
 {id:"dgcopper", cat:"dgjs", icon:"🧮", name:"导线直流电阻", desc:"铜导线电阻计算",
  formula:"R=ρL/S；ρ铜=0.0175Ω·mm²/m(20℃)",
  inputs:[{id:"l", label:"导线长度", unit:"m", def:"100", min:0.01},{id:"s", label:"导线截面", unit:"mm²", def:"2.5", min:0.01}],
  run:"var l=Number(l),s=Number(s); if(!(l>0&&s>0)) return {ok:false,msg:'长度/截面必须大于0'}; return {ok:true,html:'<div class=\"big\">R = '+(0.0175*l/s).toFixed(2)+' Ω</div>'};",
  test:{inputs:{l:100,s:2.5}, expect:"0.70"}},
 {id:"dgwireweight", cat:"dgjs", icon:"⚖️", name:"铜线重量估算", desc:"按截面和长度算铜导体重量",
  formula:"m=0.0089·S·L kg（S:mm²，L:m；铜密度8.9g/cm³）",
  inputs:[{id:"s", label:"导线截面", unit:"mm²", def:"4", min:0.01},{id:"l", label:"导线长度", unit:"m", def:"100", min:0.01}],
  run:"var s=Number(s),l=Number(l); if(!(s>0&&l>0)) return {ok:false,msg:'截面/长度必须大于0'}; return {ok:true,html:'<div class=\"big\">约 '+(0.0089*s*l).toFixed(2)+' kg</div><div class=\"row\">仅铜导体，不含绝缘层</div>'};",
  test:{inputs:{s:4,l:100}, expect:"3.56"}},
 {id:"dgunbalance", cat:"dgjs", icon:"⚖️", name:"三相不平衡度", desc:"三相电流不平衡度计算",
  formula:"不平衡度=(Imax−Iavg)/Iavg×100%（要求≤15%）",
  inputs:[{id:"ia", label:"A相电流", unit:"A", def:"10", min:0},{id:"ib", label:"B相电流", unit:"A", def:"12", min:0},{id:"ic", label:"C相电流", unit:"A", def:"11", min:0}],
  run:"var a=Number(ia),b=Number(ib),c=Number(ic); var avg=(a+b+c)/3; if(!(avg>0)) return {ok:false,msg:'电流不能全为0'}; var ub=(Math.max(a,b,c)-avg)/avg*100; return {ok:true,html:'<div class=\"big\">不平衡度 '+ub.toFixed(2)+'%</div><div class=\"row\">'+(ub<=15?'✓ 合格（≤15%）':'✗ 超标，应调整负荷分配')+'</div>'};",
  test:{inputs:{ia:10,ib:12,ic:11}, expect:"9.09"}},
 {id:"dgdmd", cat:"dgjs", icon:"📊", name:"需用系数法算负荷", desc:"估算配电系统计算负荷",
  formula:"Pjs=Kx·ΣPe",
  inputs:[{id:"pe", label:"设备总容量", unit:"kW", def:"100", min:0.01},{id:"kx", label:"需用系数Kx", def:"0.7", min:0.01, max:1}],
  run:"var pe=Number(pe),kx=Number(kx); if(!(pe>0&&kx>0&&kx<=1)) return {ok:false,msg:'参数不合法'}; return {ok:true,html:'<div class=\"big\">Pjs = '+(pe*kx).toFixed(2)+' kW</div>'};",
  test:{inputs:{pe:100,kx:0.7}, expect:"70.00"}},
 {id:"dglightnum", cat:"dgjs", icon:"💡", name:"灯具数量计算", desc:"按照度要求算需要多少灯",
  formula:"N=E·A/(Φ·U·K)（向上取整）",
  inputs:[{id:"e", label:"要求照度", unit:"lx", def:"300", min:1},{id:"a", label:"房间面积", unit:"m²", def:"50", min:1},{id:"phi", label:"单灯光通量", unit:"lm", def:"3000", min:1},{id:"u", label:"利用系数", def:"0.6", min:0.1, max:1},{id:"k", label:"维护系数", def:"0.8", min:0.1, max:1}],
  run:"var phi=Number(phi),u=Number(u),k=Number(k); if(!(phi>0)) return {ok:false,msg:\'单灯光通量须大于0\'}; if(!(u>0)) return {ok:false,msg:\'利用系数须大于0\'}; if(!(k>0)) return {ok:false,msg:\'维护系数须大于0\'}; var n=Number(e)*Number(a)/(phi*u*k); return {ok:true,html:'<div class=\"big\">需 '+Math.ceil(n)+' 盏</div><div class=\"row\">计算值 '+n.toFixed(2)+'，向上取整</div>'};",
  test:{inputs:{e:300,a:50,phi:3000,u:0.6,k:0.8}, expect:"11"}},
 {id:"dgillum", cat:"dgjs", icon:"🔆", name:"平均照度计算", desc:"已知灯具算房间平均照度",
  formula:"E=N·Φ·U·K/A",
  inputs:[{id:"n", label:"灯具数量", unit:"盏", def:"10", min:1},{id:"phi", label:"单灯光通量", unit:"lm", def:"3000", min:1},{id:"u", label:"利用系数", def:"0.6", min:0.1, max:1},{id:"k", label:"维护系数", def:"0.8", min:0.1, max:1},{id:"a", label:"房间面积", unit:"m²", def:"50", min:1}],
  run:"var a=Number(a); if(!(a>0)) return {ok:false,msg:\'房间面积须大于0\'}; var E=Number(n)*Number(phi)*Number(u)*Number(k)/a; return {ok:true,html:'<div class=\"big\">E = '+E.toFixed(2)+' lx</div>'};",
  test:{inputs:{n:10,phi:3000,u:0.6,k:0.8,a:50}, expect:"288.00"}},
 {id:"dgshort", cat:"dgjs", icon:"💥", name:"短路电流估算", desc:"按系统阻抗估算三相短路电流",
  formula:"Ik=U/(√3·Z)（U为线电压）",
  inputs:[{id:"u", label:"线电压", unit:"V", def:"400", min:1},{id:"z", label:"短路回路总阻抗", unit:"Ω", def:"0.05", min:0.0001}],
  run:"var u=Number(u),z=Number(z); if(!(u>0&&z>0)) return {ok:false,msg:'参数必须大于0'}; var Ik=u/(1.7320508*z)/1000; return {ok:true,html:'<div class=\"big\">Ik ≈ '+Ik.toFixed(2)+' kA</div><div class=\"row\">粗略估算，精确计算需计入变压器阻抗</div>'};",
  test:{inputs:{u:400,z:0.05}, expect:"4.62"}},
 {id:"dgground", cat:"dgjs", icon:"🌍", name:"接地电阻估算", desc:"单根垂直接地极接地电阻",
  formula:"R=ρ/(2πL)·ln(4L/d)",
  inputs:[{id:"rho", label:"土壤电阻率", unit:"Ω·m", def:"100", min:1},{id:"l", label:"接地极长度", unit:"m", def:"2.5", min:0.1},{id:"d", label:"接地极等效直径", unit:"m", def:"0.05", min:0.001}],
  run:"var rho=Number(rho),l=Number(l),d=Number(d); if(!(rho>0&&l>0&&d>0)) return {ok:false,msg:'参数必须大于0'}; var R=rho/(2*Math.PI*l)*Math.log(4*l/d); return {ok:true,html:'<div class=\"big\">R ≈ '+R.toFixed(2)+' Ω</div><div class=\"row\">单根垂直接地极，ρ='+rho+'Ω·m</div>'};",
  test:{inputs:{rho:100,l:2.5,d:0.05}, expect:"33.73"}},
 {id:"dgpfangle", cat:"dgjs", icon:"📐", name:"功率因数角", desc:"由功率因数求相位角和无功",
  formula:"φ=arccos(cosφ)；Q=P·tanφ",
  inputs:[{id:"p", label:"有功功率", unit:"kW", def:"10", min:0.01},{id:"pf", label:"功率因数", def:"0.8", min:0.1, max:1}],
  run:"var p=Number(p),pf=Number(pf); if(!(p>0&&pf>0&&pf<=1)) return {ok:false,msg:'参数不合法'}; var ang=Math.acos(pf)*180/Math.PI,Q=p*Math.tan(Math.acos(pf)); return {ok:true,html:'<div class=\"big\">φ = '+ang.toFixed(2)+'°</div><div class=\"row\">无功 Q = '+Q.toFixed(2)+' kvar</div>'};",
  test:{inputs:{p:10,pf:0.8}, expect:"36.87"}},
 {id:"dgcostsave", cat:"dgjs", icon:"💰", name:"节电改造节电量", desc:"设备改造前后的节电量",
  formula:"ΔW=(P₁−P₂)·t",
  inputs:[{id:"p1", label:"改造前功率", unit:"kW", def:"100", min:0},{id:"p2", label:"改造后功率", unit:"kW", def:"80", min:0},{id:"t", label:"年运行时间", unit:"h", def:"10", min:0}],
  run:"var d=(Number(p1)-Number(p2))*Number(t); if(d<0) return {ok:false,msg:'改造后功率不应大于改造前'}; return {ok:true,html:'<div class=\"big\">节电 '+d.toFixed(2)+' kWh</div>'};",
  test:{inputs:{p1:100,p2:80,t:10}, expect:"200.00"}},
 {id:"dgloadrate", cat:"dgjs", icon:"🏭", name:"变压器负载率", desc:"变压器实际负载占容量的比例",
  formula:"β=Sjs/Se×100%（经济运行区40%~75%）",
  inputs:[{id:"sjs", label:"计算负荷", unit:"kVA", def:"80", min:0},{id:"se", label:"变压器容量", unit:"kVA", def:"100", min:1}],
  run:"var se=Number(se); if(!(se>0)) return {ok:false,msg:\'变压器容量须大于0\'}; var b=Number(sjs)/se*100; return {ok:true,html:'<div class=\"big\">负载率 '+b.toFixed(2)+'%</div><div class=\"row\">'+(b>=40&&b<=75?'✓ 经济运行区':'注意：经济运行区为40%~75%')+'</div>'};",
  test:{inputs:{sjs:80,se:100}, expect:"80.00"}},
 {id:"dglossrate", cat:"dgjs", icon:"📉", name:"线损率计算", desc:"供电损耗占供电量的比例",
  formula:"线损率=(供电量−售电量)/供电量×100%",
  inputs:[{id:"supply", label:"供电量", unit:"kWh", def:"10000", min:1},{id:"sold", label:"售电量", unit:"kWh", def:"9500", min:0}],
  run:"var s=Number(supply),e=Number(sold); if(e>s) return {ok:false,msg:'售电量不能大于供电量'}; return {ok:true,html:'<div class=\"big\">线损率 '+((s-e)/s*100).toFixed(2)+'%</div>'};",
  test:{inputs:{supply:10000,sold:9500}, expect:"5.00"}},
 {id:"dgpt", cat:"dgjs", icon:"🔄", name:"电压互感器换算", desc:"一次电压折算二次电压",
  formula:"U₂=U₁×二次额定/一次额定",
  inputs:[{id:"u1", label:"一次实际电压", unit:"V", def:"8000", min:0},{id:"prim", label:"一次额定", unit:"V", def:"10000", min:1},{id:"sec", label:"二次额定", type:"select", options:[{v:"100",t:"100V"},{v:"57.7",t:"57.7V"}]}],

  inputs:[{id:"p", label:"轴功率", unit:"kW", def:"7.5", min:0.01},{id:"h", label:"年运行", unit:"小时", def:"3000", min:1},{id:"pr", label:"电价", unit:"元/kWh", def:"0.8", min:0.01},{id:"ef", label:"效率", unit:"", def:"0.9", min:0.01, max:1}],
  run:"if(!(ef>0)) return {ok:false,msg:'效率须大于0'}; var c=p/ef*h*pr; return {ok:true,html:'<div class=\"big\">约 '+c.toFixed(0)+' 元/年</div><div class=\"row\">输入功率 = 轴功率 / 效率</div>'};",
  test:{inputs:{p:7.5,h:3000,pr:0.8,ef:0.9}, expect:"约 20000 元/年"}},
 {id:"djsoftstart", cat:"dj", icon:"🐢", name:"软启动电流估算", desc:"按限流倍数估算软启动时的启动电流",
  formula:"I启动 = 限流倍数 × In（一般取 2～4 倍）",
  inputs:[{id:"inn", label:"电机额定电流", unit:"A", def:"15", min:0.01},{id:"k", label:"限流倍数", unit:"倍", def:"3", min:1, max:6}],
  run:"return {ok:true,html:'<div class=\"big\">启动电流 ≈ '+(inn*k).toFixed(1)+' A</div><div class=\"row\">软启动限流一般整定为 2～4 倍额定电流</div>'};",
  test:{inputs:{inn:15,k:3}, expect:"启动电流 ≈ 45.0 A"}},
 {id:"djdc", cat:"dj", icon:"🔋", name:"直流电机电流", desc:"已知轴功率、电压、效率求直流电机电流",
  formula:"I = P / (U × η)",
  inputs:[{id:"p", label:"轴功率", unit:"kW", def:"2", min:0.001},{id:"u", label:"电压", unit:"V", def:"220", min:1},{id:"ef", label:"效率", unit:"", def:"0.85", min:0.01, max:1}],
  run:"if(!(u>0)) return {ok:false,msg:'电压须大于0'}; if(!(ef>0)) return {ok:false,msg:'效率须大于0'}; return {ok:true,html:'<div class=\"big\">I = '+(p*1000/(u*ef)).toFixed(2)+' A</div><div class=\"row\">I = P(W) / (U × η)</div>'};",
  test:{inputs:{p:2,u:220,ef:0.85}, expect:"I = 10.70 A"}},
 {id:"dzadc", cat:"dz", icon:"🎚️", name:"ADC分辨率", desc:"已知基准电压和位数求最小分辨电压LSB",
  formula:"LSB = Vref / 2ⁿ",
  inputs:[{id:"vref", label:"基准电压", unit:"V", def:"3.3", min:0.01},{id:"n", label:"位数", unit:"bit", def:"12", min:1}],
  run:"return {ok:true,html:'<div class=\"big\">LSB = '+(vref/Math.pow(2,n)*1000).toFixed(2)+' mV</div><div class=\"row\">LSB = Vref / 2ⁿ，量化误差 ±½LSB</div>'};",
  test:{inputs:{vref:3.3,n:12}, expect:"LSB = 0.81 mV"}},
 {id:"dzhyst", cat:"dz", icon:"📊", name:"比较器迟滞电压", desc:"同相迟滞比较器的回差电压",
  formula:"Vh = Vpp × R1 / (R1 + R2)",
  inputs:[{id:"vpp", label:"输出摆幅", unit:"V", def:"10", min:0.01},{id:"r1", label:"R1(输入侧)", unit:"kΩ", def:"10", min:0.01},{id:"r2", label:"R2(反馈)", unit:"kΩ", def:"100", min:0.01}],
  run:"return {ok:true,html:'<div class=\"big\">Vh = '+(vpp*r1/(r1+r2)).toFixed(2)+' V</div><div class=\"row\">迟滞电压 Vh = 输出摆幅 × R1/(R1+R2)，抗噪声干扰</div>'};",
  test:{inputs:{vpp:10,r1:10,r2:100}, expect:"Vh = 0.91 V"}},
 {id:"dzxtal", cat:"dz", icon:"💎", name:"晶振负载电容", desc:"已知外接电容和杂散电容求总负载电容",
  formula:"CL = C1×C2/(C1+C2) + Cstray",
  inputs:[{id:"c1", label:"C1", unit:"pF", def:"22", min:0.1},{id:"c2", label:"C2", unit:"pF", def:"22", min:0.1},{id:"cs", label:"杂散电容", unit:"pF", def:"3", min:0}],
  run:"return {ok:true,html:'<div class=\"big\">CL = '+(c1*c2/(c1+c2)+cs).toFixed(1)+' pF</div><div class=\"row\">应与晶振标称负载电容一致，杂散一般取 3～5pF</div>'};",
  test:{inputs:{c1:22,c2:22,cs:3}, expect:"CL = 14.0 pF"}},
 {id:"dzfuse", cat:"dz", icon:"🧨", name:"熔断器选型", desc:"按1.5倍额定电流选熔断器额定电流",
  formula:"I熔 = 1.5 × In（就近取标称值）",
  inputs:[{id:"inn", label:"负载额定电流", unit:"A", def:"10", min:0.01}],
  run:"var std=[1,2,3,4,5,6,8,10,16,20,25,32,40,50,63],v=inn*1.5,pick=std[std.length-1]; for(var k=0;k<std.length;k++){if(std[k]>=v){pick=std[k];break;}} return {ok:true,html:'<div class=\"big\">选用 '+pick+' A 熔断器</div><div class=\"row\">按 1.5 倍额定电流，就近取标称值取大</div>'};",
  test:{inputs:{inn:10}, expect:"选用 16 A 熔断器"}},
 {id:"dzlm317", cat:"dz", icon:"🔧", name:"LM317输出电压", desc:"已知R1、R2求LM317稳压输出",
  formula:"Vout = 1.25 × (1 + R2/R1)",
  inputs:[{id:"r1", label:"R1", unit:"Ω", def:"240", min:1},{id:"r2", label:"R2", unit:"Ω", def:"720", min:0}],
  run:"if(!(r1>0)) return {ok:false,msg:'R1须大于0'}; return {ok:true,html:'<div class=\"big\">Vout = '+(1.25*(1+r2/r1)).toFixed(2)+' V</div><div class=\"row\">Vout = 1.25 × (1 + R2/R1)，R1 常取 240Ω</div>'};",
  test:{inputs:{r1:240,r2:720}, expect:"Vout = 5.00 V"}},
 {id:"dzopamp", cat:"dz", icon:"🔺", name:"运放增益", desc:"同相/反相放大器电压增益",
  formula:"同相 Av = 1 + Rf/Rin；反相 Av = −Rf/Rin",
  inputs:[{id:"rf", label:"反馈电阻Rf", unit:"kΩ", def:"100", min:0.01},{id:"rin", label:"输入电阻Rin", unit:"kΩ", def:"10", min:0.01},{id:"tp", label:"组态", type:"select", def:"inv", options:[{v:"inv",t:"反相放大"},{v:"ninv",t:"同相放大"}]}],
  run:"if(!(rin>0)) return {ok:false,msg:'输入电阻Rin须大于0'}; var av=tp==='inv'?-rf/rin:1+rf/rin; return {ok:true,html:'<div class=\"big\">Av = '+av.toFixed(2)+'</div><div class=\"row\">'+(tp==='inv'?'反相：Av = −Rf/Rin':'同相：Av = 1 + Rf/Rin')+'</div>'};",
  test:{inputs:{rf:100,rin:10,tp:"inv"}, expect:"Av = -10.00"}},
 {id:"dzgbw", cat:"dz", icon:"📶", name:"运放闭环带宽", desc:"已知增益带宽积和闭环增益求带宽",
  formula:"BW = GBW / Av",
  inputs:[{id:"gbw", label:"增益带宽积", unit:"MHz", def:"1", min:0.001},{id:"av", label:"闭环增益", unit:"倍", def:"10", min:0.1}],
  run:"if(!(av>0)) return {ok:false,msg:'闭环增益须大于0'}; return {ok:true,html:'<div class=\"big\">BW = '+(gbw/av*1000).toFixed(1)+' kHz</div><div class=\"row\">BW = GBW / Av，增益带宽积守恒</div>'};",
  test:{inputs:{gbw:1,av:10}, expect:"BW = 100.0 kHz"}},
 {id:"dzpcb", cat:"dz", icon:"🟩", name:"PCB走线载流", desc:"IPC-2221公式估算外层走线载流能力",
  formula:"I = 0.048 × ΔT^0.44 × A^0.725（A单位mil²，外层）",
  inputs:[{id:"w", label:"线宽", unit:"mm", def:"1", min:0.05},{id:"cu", label:"铜厚", unit:"oz", def:"1", min:0.25},{id:"dt", label:"允许温升", unit:"℃", def:"10", min:1}],
  run:"if(!(w>0)||!(cu>0)||!(dt>0)) return {ok:false,msg:'线宽/铜厚/温升须大于0'}; var a=w*39.3701*cu*1.37,i=0.048*Math.pow(dt,0.44)*Math.pow(a,0.725); return {ok:true,html:'<div class=\"big\">I ≈ '+i.toFixed(2)+' A</div><div class=\"row\">IPC-2221 外层公式，保守设计请降额使用</div>'};",
  test:{inputs:{w:1,cu:1,dt:10}, expect:"I ≈ 2.38 A"}},
 {id:"dzsnubber", cat:"dz", icon:"🛡️", name:"RC吸收阻尼电阻", desc:"按临界阻尼匹配吸收电阻",
  formula:"R = 2 × √(Lσ / C)",
  inputs:[{id:"ls", label:"漏感", unit:"μH", def:"5", min:0.01},{id:"cc", label:"吸收电容", unit:"nF", def:"10", min:0.01}],
  run:"if(!(ls>0)||!(cc>0)) return {ok:false,msg:'漏感/吸收电容须大于0'}; var r=2*Math.sqrt(ls*1e-6/(cc*1e-9)); return {ok:true,html:'<div class=\"big\">R ≈ '+r.toFixed(2)+' Ω</div><div class=\"row\">临界阻尼 R = 2√(Lσ/C)，抑制开关振铃</div>'};",
  test:{inputs:{ls:5,cc:10}, expect:"R ≈ 44.72 Ω"}},
 {id:"dzrectcap", cat:"dz", icon:"🌊", name:"整流滤波电容", desc:"全波整流滤波电容估算",
  formula:"C = I / (2f × ΔV)",
  inputs:[{id:"i", label:"负载电流", unit:"A", def:"1", min:0.001},{id:"f", label:"电网频率", unit:"Hz", def:"50", min:1},{id:"dv", label:"允许纹波", unit:"V", def:"2", min:0.01}],
  run:"if(!(f>0)) return {ok:false,msg:'频率须大于0'}; if(!(dv>0)) return {ok:false,msg:'允许纹波须大于0'}; var c=i/(2*f*dv)*1e6; return {ok:true,html:'<div class=\"big\">C ≈ '+c.toFixed(0)+' μF</div><div class=\"row\">全波整流 C = I/(2fΔV)，半波整流纹波加倍</div>'};",
  test:{inputs:{i:1,f:50,dv:2}, expect:"C ≈ 5000 μF"}},
 {id:"dzrtemp", cat:"dz", icon:"🌡️", name:"电阻温度漂移", desc:"已知温度系数求温度变化后的阻值",
  formula:"R = R₀ × (1 + αΔT)，铜 α=0.00393",
  inputs:[{id:"r0", label:"标称阻值", unit:"Ω", def:"100", min:0.001},{id:"t0", label:"标称温度", unit:"℃", def:"20"},{id:"t1", label:"实际温度", unit:"℃", def:"75"},{id:"al", label:"温度系数α", unit:"/℃", def:"0.00393", min:0}],
  run:"var r=r0*(1+al*(t1-t0)); return {ok:true,html:'<div class=\"big\">R = '+r.toFixed(2)+' Ω</div><div class=\"row\">R = R₀(1 + αΔT)，铜 α=0.00393/℃</div>'};",
  test:{inputs:{r0:100,t0:20,t1:75,al:0.00393}, expect:"R = 121.62 Ω"}},
 {id:"dzrms", cat:"dz", icon:"〰️", name:"正弦峰值有效值换算", desc:"正弦交流电有效值与峰峰值互换",
  formula:"Vpp = 2√2 × Vrms",
  inputs:[{id:"vr", label:"有效值", unit:"V", def:"220", min:0.001}],
  run:"return {ok:true,html:'<div class=\"big\">Vpp = '+(vr*2*Math.sqrt(2)).toFixed(2)+' V</div><div class=\"row\">正弦波：Vpp = 2√2 × Vrms，Vpk = √2 × Vrms</div>'};",
  test:{inputs:{vr:220}, expect:"Vpp = 622.25 V"}},
 {id:"dzskin", cat:"dz", icon:"🧅", name:"趋肤深度", desc:"铜导线在指定频率下的趋肤深度",
  formula:"δ = √(2ρ / ωμ)，铜 ρ=1.68e-8",
  inputs:[{id:"f", label:"频率", unit:"kHz", def:"100", min:0.001}],
  run:"if(!(f>0)) return {ok:false,msg:'频率须大于0'}; var d=Math.sqrt(2*1.68e-8/(2*Math.PI*f*1000*4*Math.PI*1e-7))*1000; return {ok:true,html:'<div class=\"big\">δ = '+d.toFixed(2)+' mm</div><div class=\"row\">铜导线趋肤深度，高频电流集中在表面</div>'};",
  test:{inputs:{f:100}, expect:"δ = 0.21 mm"}},
 {id:"dztherm", cat:"dz", icon:"🔥", name:"芯片结温估算", desc:"已知功耗和热阻估算芯片结温",
  formula:"Tj = Ta + P × Rθja",
  inputs:[{id:"ta", label:"环境温度", unit:"℃", def:"25"},{id:"p", label:"功耗", unit:"W", def:"1", min:0},{id:"rth", label:"结到环境热阻", unit:"℃/W", def:"62", min:0.1}],
  run:"return {ok:true,html:'<div class=\"big\">Tj = '+(ta+p*rth).toFixed(1)+' ℃</div><div class=\"row\">Tj = Ta + P × Rθja，结温一般要求 < 125℃</div>'};",
  test:{inputs:{ta:25,p:1,rth:62}, expect:"Tj = 87.0 ℃"}},
 {id:"dzmosfet", cat:"dz", icon:"🔌", name:"MOSFET导通损耗", desc:"已知电流和导通电阻求导通损耗",
  formula:"P = I² × Rds(on)",
  inputs:[{id:"i", label:"漏极电流", unit:"A", def:"10", min:0},{id:"rds", label:"导通电阻", unit:"mΩ", def:"8", min:0.01}],
  run:"return {ok:true,html:'<div class=\"big\">P = '+(i*i*rds/1000).toFixed(2)+' W</div><div class=\"row\">P = I² × Rds(on)，选低内阻管降损耗</div>'};",
  test:{inputs:{i:10,rds:8}, expect:"P = 0.80 W"}},
 {id:"dzindenergy", cat:"dz", icon:"🧲", name:"电感储能", desc:"电感中储存的磁场能量",
  formula:"E = ½ × L × I²",
  inputs:[{id:"l", label:"电感", unit:"μH", def:"100", min:0.001},{id:"i", label:"电流", unit:"A", def:"2", min:0}],
  run:"return {ok:true,html:'<div class=\"big\">E = '+(0.5*l*1e-6*i*i*1e6).toFixed(0)+' μJ</div><div class=\"row\">E = ½LI²</div>'};",
  test:{inputs:{l:100,i:2}, expect:"E = 200 μJ"}},
 {id:"dzqfactor", cat:"dz", icon:"🎯", name:"电感品质因数Q", desc:"串联电感的品质因数",
  formula:"Q = 2πfL / R",
  inputs:[{id:"f", label:"频率", unit:"MHz", def:"1", min:0.0001},{id:"l", label:"电感", unit:"μH", def:"10", min:0.001},{id:"r", label:"串联电阻", unit:"Ω", def:"2", min:0.001}],
  run:"if(!(r>0)) return {ok:false,msg:'串联电阻须大于0'}; return {ok:true,html:'<div class=\"big\">Q = '+(2*Math.PI*f*1e6*l*1e-6/r).toFixed(2)+'</div><div class=\"row\">Q = ωL/R，Q 越高选频特性越好</div>'};",
  test:{inputs:{f:1,l:10,r:2}, expect:"Q = 31.42"}},
 {id:"dzrlcbw", cat:"dz", icon:"📻", name:"串联谐振带宽", desc:"串联RLC谐振电路的带宽",
  formula:"BW = R / (2πL)",
  inputs:[{id:"r", label:"电阻", unit:"Ω", def:"10", min:0.001},{id:"l", label:"电感", unit:"μH", def:"100", min:0.001}],
  run:"if(!(l>0)) return {ok:false,msg:'电感须大于0'}; return {ok:true,html:'<div class=\"big\">BW = '+(r/(2*Math.PI*l*1e-6)/1000).toFixed(2)+' kHz</div><div class=\"row\">串联谐振带宽 BW = R/(2πL)</div>'};",
  test:{inputs:{r:10,l:100}, expect:"BW = 15.92 kHz"}},
 {id:"dzimpz", cat:"dz", icon:"📐", name:"串联阻抗", desc:"R-X串联电路的阻抗模与相位角",
  formula:"|Z| = √(R²+X²)，φ = arctan(X/R)",
  inputs:[{id:"r", label:"电阻", unit:"Ω", def:"30", min:0},{id:"x", label:"电抗", unit:"Ω", def:"40"}],
  run:"var z=Math.sqrt(r*r+x*x),ph=Math.atan2(x,r)*180/Math.PI; return {ok:true,html:'<div class=\"big\">|Z| = '+z.toFixed(2)+' Ω，φ = '+ph.toFixed(2)+'°</div><div class=\"row\">X>0 感性，X<0 容性</div>'};",
  test:{inputs:{r:30,x:40}, expect:"|Z| = 50.00 Ω"}},
 {id:"dzpfc", cat:"dz", icon:"⚖️", name:"功率因数补偿电容", desc:"将功率因数补偿到目标值所需电容",
  formula:"C = P(tanφ₁−tanφ₂) / (2πfU²)",
  inputs:[{id:"p", label:"有功功率", unit:"kW", def:"10", min:0.01},{id:"c1", label:"补偿前cosφ", unit:"", def:"0.7", min:0.01, max:0.99},{id:"c2", label:"目标cosφ", unit:"", def:"0.95", min:0.01, max:1},{id:"u", label:"电压", unit:"V", def:"380", min:1},{id:"f", label:"频率", unit:"Hz", def:"50", min:1}],
  run:"if(!(c1>0&&c1<=1)) return {ok:false,msg:'补偿前cosφ须在(0,1]之间'}; if(!(c2>0&&c2<=1)) return {ok:false,msg:'目标cosφ须在(0,1]之间'}; if(!(u>0)) return {ok:false,msg:'电压须大于0'}; if(!(f>0)) return {ok:false,msg:'频率须大于0'}; if(c2<=c1) return {ok:false,msg:'目标功率因数须高于补偿前'}; var t1=Math.tan(Math.acos(c1)),t2=Math.tan(Math.acos(c2)),c=p*1000*(t1-t2)/(2*Math.PI*f*u*u)*1e6; return {ok:true,html:'<div class=\"big\">C ≈ '+c.toFixed(2)+' μF</div><div class=\"row\">三相补偿电容星形接法，耐压选 450V 以上</div>'};",
  test:{inputs:{p:10,c1:0.7,c2:0.95,u:380,f:50}, expect:"C ≈ 152.44 μF"}},
 {id:"dzbjtbase", cat:"dz", icon:"🔉", name:"三极管基极电阻", desc:"开关状态下基极限流电阻",
  formula:"Rb = (Vctl − Vbe) × β / Ic，Vbe≈0.7V",
  inputs:[{id:"v", label:"控制电压", unit:"V", def:"5", min:0.8},{id:"be", label:"放大倍数β", unit:"", def:"100", min:1},{id:"ic", label:"集电极电流", unit:"mA", def:"100", min:0.01}],
  run:"if(!(ic>0)) return {ok:false,msg:'集电极电流须大于0'}; var rb=(v-0.7)*be/(ic/1000)/1000; return {ok:true,html:'<div class=\"big\">Rb ≈ '+rb.toFixed(2)+' kΩ</div><div class=\"row\">取 β 较小值保证饱和，电阻就近取小</div>'};",
  test:{inputs:{v:5,be:100,ic:100}, expect:"Rb ≈ 4.30 kΩ"}},
 {id:"dzbuck", cat:"dz", icon:"⬇️", name:"Buck占空比", desc:"降压型DC-DC的理论占空比",
  formula:"D = Vout / Vin",
  inputs:[{id:"vin", label:"输入电压", unit:"V", def:"12", min:0.1},{id:"vout", label:"输出电压", unit:"V", def:"5", min:0.1}],
  run:"if(vout>vin) return {ok:false,msg:'Buck输出电压不能高于输入'}; return {ok:true,html:'<div class=\"big\">D = '+(vout/vin*100).toFixed(2)+' %</div><div class=\"row\">理想 Buck：D = Vout/Vin</div>'};",
  test:{inputs:{vin:12,vout:5}, expect:"D = 41.67 %"}},
 {id:"dzboost", cat:"dz", icon:"⬆️", name:"Boost占空比", desc:"升压型DC-DC的理论占空比",
  formula:"D = 1 − Vin / Vout",
  inputs:[{id:"vin", label:"输入电压", unit:"V", def:"12", min:0.1},{id:"vout", label:"输出电压", unit:"V", def:"24", min:0.1}],
  run:"if(vout<=vin) return {ok:false,msg:'Boost输出电压须高于输入'}; return {ok:true,html:'<div class=\"big\">D = '+((1-vin/vout)*100).toFixed(2)+' %</div><div class=\"row\">理想 Boost：D = 1 − Vin/Vout</div>'};",
  test:{inputs:{vin:12,vout:24}, expect:"D = 50.00 %"}},
 {id:"dzldo", cat:"dz", icon:"🌡️", name:"LDO功耗", desc:"线性稳压器自身功耗与发热",
  formula:"P = (Vin − Vout) × I",
  inputs:[{id:"vin", label:"输入电压", unit:"V", def:"12", min:0.1},{id:"vout", label:"输出电压", unit:"V", def:"5", min:0.1},{id:"i", label:"负载电流", unit:"A", def:"0.5", min:0}],
  run:"if(vin<vout) return {ok:false,msg:'输入电压须高于输出'}; return {ok:true,html:'<div class=\"big\">P = '+((vin-vout)*i).toFixed(2)+' W</div><div class=\"row\">压差大电流大时发热严重，考虑加散热片或换DCDC</div>'};",
  test:{inputs:{vin:12,vout:5,i:0.5}, expect:"P = 3.50 W"}},
 {id:"dzcharge", cat:"dz", icon:"🔋", name:"电容恒流充电时间", desc:"恒流源给电容充电到目标电压的时间",
  formula:"t = C × ΔV / I",

  run:"if(!(i>0)) return {ok:false,msg:'充电电流须大于0'}; return {ok:true,html:'<div class=\"big\">t = '+(cc*1e-6*dv/(i/1000)).toFixed(2)+' s</div><div class=\"row\">t = C × ΔV / I（恒流充电）</div>'};",

 {id:"dzcoupling", cat:"dz", icon:"🔗", name:"耦合电容截止频率", desc:"RC高通的−3dB截止频率",
  formula:"f = 1 / (2πRC)",

 {id:"dztl431", cat:"dz", icon:"🎯", name:"TL431输出电压", desc:"TL431可调基准输出电压",

 {id:"dzdiode", cat:"dz", icon:"➡️", name:"二极管功耗", desc:"二极管正向导通功耗",

 {id:"dzbridge", cat:"dz", icon:"🌉", name:"整流桥损耗", desc:"桥式整流导通损耗（两只管子）",

 {id:"dzgate", cat:"dz", icon:"🚪", name:"逻辑门运算", desc:"基本逻辑门真值计算",
  formula:"与/或/非/与非/或非/异或/同或",
  inputs:[{id:"g", label:"门类型", type:"select", def:"nand", options:[{v:"and",t:"与 AND"},{v:"or",t:"或 OR"},{v:"not",t:"非 NOT"},{v:"nand",t:"与非 NAND"},{v:"nor",t:"或非 NOR"},{v:"xor",t:"异或 XOR"},{v:"xnor",t:"同或 XNOR"}]},{id:"a", label:"输入A", type:"select", def:"1", options:[{v:"1",t:"1"},{v:"0",t:"0"}]},{id:"b", label:"输入B", type:"select", def:"1", options:[{v:"1",t:"1"},{v:"0",t:"0"}]}],
  run:"var A=a==='1',B=b==='1',y; if(g==='and')y=A&&B; else if(g==='or')y=A||B; else if(g==='not')y=!A; else if(g==='nand')y=!(A&&B); else if(g==='nor')y=!(A||B); else if(g==='xor')y=A!==B; else y=A===B; return {ok:true,html:'<div class=\"big\">Y = '+(y?1:0)+'</div><div class=\"row\">'+g.toUpperCase()+'('+a+', '+b+')</div>'};",
  test:{inputs:{g:"nand",a:"1",b:"1"}, expect:"Y = 0"}},
 {id:"sxfib", cat:"sx", icon:"🐚", name:"斐波那契数列", desc:"求斐波那契数列第n项（F1=1,F2=1）",
  formula:"F(n) = F(n−1) + F(n−2)",

  run:"n=Math.floor(n); if(n<1) return {ok:false,msg:'n须≥1'}; if(n>10000) return {ok:false,msg:'n过大，请输入≤10000的正整数'}; var a=1,b=1; if(n<=2) return {ok:true,html:'<div class=\"big\">F('+n+') = 1</div>'}; for(var k=3;k<=n;k++){var t=a+b;a=b;b=t;} if(!isFinite(b)) return {ok:false,msg:'结果超出数值范围，请减小n'}; return {ok:true,html:'<div class=\"big\">F('+n+') = '+b+'</div><div class=\"row\">1, 1, 2, 3, 5, 8, 13, …</div>'};",

 {id:"sxvecdot", cat:"sx", icon:"➡️", name:"向量点积", desc:"三维向量点积",
  formula:"a·b = a₁b₁ + a₂b₂ + a₃b₃",
  inputs:[{id:"a1", label:"a₁", unit:"", def:"1"},{id:"a2", label:"a₂", unit:"", def:"2"},{id:"a3", label:"a₃", unit:"", def:"3"},{id:"b1", label:"b₁", unit:"", def:"4"},{id:"b2", label:"b₂", unit:"", def:"5"},{id:"b3", label:"b₃", unit:"", def:"6"}],
  run:"return {ok:true,html:'<div class=\"big\">a·b = '+(a1*b1+a2*b2+a3*b3).toFixed(2)+'</div><div class=\"row\">点积为0则两向量垂直</div>'};",
  test:{inputs:{a1:1,a2:2,a3:3,b1:4,b2:5,b3:6}, expect:"a·b = 32.00"}},
 {id:"sxveccross", cat:"sx", icon:"✖️", name:"向量叉积", desc:"三维向量叉积",
  formula:"a×b = (a₂b₃−a₃b₂, a₃b₁−a₁b₃, a₁b₂−a₂b₁)",
  inputs:[{id:"a1", label:"a₁", unit:"", def:"1"},{id:"a2", label:"a₂", unit:"", def:"0"},{id:"a3", label:"a₃", unit:"", def:"0"},{id:"b1", label:"b₁", unit:"", def:"0"},{id:"b2", label:"b₂", unit:"", def:"1"},{id:"b3", label:"b₃", unit:"", def:"0"}],
  run:"var c1=a2*b3-a3*b2,c2=a3*b1-a1*b3,c3=a1*b2-a2*b1; return {ok:true,html:'<div class=\"big\">a×b = ('+c1+', '+c2+', '+c3+')</div><div class=\"row\">结果垂直于a、b两向量，右手定则定方向</div>'};",
  test:{inputs:{a1:1,a2:0,a3:0,b1:0,b2:1,b3:0}, expect:"a×b = (0, 0, 1)"}},
 {id:"sxcomplex", cat:"sx", icon:"ℂ", name:"复数四则运算", desc:"两个复数的加减乘除",
  formula:"(a+bi)±(c+di)，(a+bi)(c+di)，(a+bi)/(c+di)",
  inputs:[{id:"a", label:"实部a", unit:"", def:"3"},{id:"b", label:"虚部b", unit:"", def:"2"},{id:"c", label:"实部c", unit:"", def:"1"},{id:"d", label:"虚部d", unit:"", def:"4"},{id:"op", label:"运算", type:"select", def:"mul", options:[{v:"add",t:"加 +"},{v:"sub",t:"减 −"},{v:"mul",t:"乘 ×"},{v:"div",t:"除 ÷"}]}],
  run:"var re,im; if(op==='add'){re=a+c;im=b+d;} else if(op==='sub'){re=a-c;im=b-d;} else if(op==='mul'){re=a*c-b*d;im=a*d+b*c;} else {var dd=c*c+d*d; if(dd===0) return {ok:false,msg:'除数不能为零'}; re=(a*c+b*d)/dd; im=(b*c-a*d)/dd;} var s=re.toFixed(2)+(im>=0?'+':'')+im.toFixed(2)+'i'; return {ok:true,html:'<div class=\"big\">'+s+'</div><div class=\"row\">复数四则运算</div>'};",
  test:{inputs:{a:3,b:2,c:1,d:4,op:"mul"}, expect:"-5.00+14.00i"}},
 {id:"sxcomplexmod", cat:"sx", icon:"📏", name:"复数模与辐角", desc:"求复数的模和辐角",
  formula:"|z| = √(a²+b²)，θ = atan2(b,a)",
  inputs:[{id:"a", label:"实部", unit:"", def:"3"},{id:"b", label:"虚部", unit:"", def:"4"}],
  run:"var m=Math.sqrt(a*a+b*b),th=Math.atan2(b,a)*180/Math.PI; return {ok:true,html:'<div class=\"big\">|z| = '+m.toFixed(2)+'，θ = '+th.toFixed(2)+'°</div><div class=\"row\">模长与辐角（主值 −180°～180°）</div>'};",
  test:{inputs:{a:3,b:4}, expect:"|z| = 5.00"}},
 {id:"sxpolar", cat:"sx", icon:"🧭", name:"极坐标直角坐标互化", desc:"直角坐标与极坐标相互转换",
  formula:"r = √(x²+y²)，θ = atan2(y,x)；x = r·cosθ，y = r·sinθ",
  inputs:[{id:"md", label:"转换方向", type:"select", def:"rtop", options:[{v:"rtop",t:"直角 → 极坐标"},{v:"ptor",t:"极坐标 → 直角"}]},{id:"v1", label:"x / r", unit:"", def:"1"},{id:"v2", label:"y / θ(°)", unit:"", def:"1"}],
  run:"var h; if(md==='rtop'){var r=Math.sqrt(v1*v1+v2*v2),th=Math.atan2(v2,v1)*180/Math.PI; h='<div class=\"big\">r = '+r.toFixed(2)+'，θ = '+th.toFixed(2)+'°</div>';} else {var x=v1*Math.cos(v2*Math.PI/180),y=v1*Math.sin(v2*Math.PI/180); h='<div class=\"big\">x = '+x.toFixed(2)+'，y = '+y.toFixed(2)+'</div>';} return {ok:true,html:h+'<div class=\"row\">θ 用角度制</div>'};",
  test:{inputs:{md:"rtop",v1:1,v2:1}, expect:"r = 1.41"}},
 {id:"sxrootn", cat:"sx", icon:"√", name:"n次方根", desc:"求正数的n次方根",
  formula:"ⁿ√x = x^(1/n)",
  inputs:[{id:"x", label:"被开方数", unit:"", def:"16", min:0},{id:"n", label:"根指数n", unit:"", def:"4", min:1}],

 {id:"sxhalfdecay", cat:"sx", icon:"☢️", name:"半衰期剩余量", desc:"放射性物质经指定时间后的剩余量",

 {id:"sxrule72", cat:"sx", icon:"💹", name:"72法则", desc:"复利下本金翻倍所需年数估算",

 {id:"sxdigit", cat:"sx", icon:"🔢", name:"数字各位和与数字根", desc:"求整数各位数字之和及数字根",
  formula:"反复各位求和直到剩一位即数字根",
  inputs:[{id:"n", label:"整数", unit:"", def:"9875", min:0}],
  run:"n=Math.floor(Math.abs(n)); var s=0,t=n; while(t>0){s+=t%10;t=Math.floor(t/10);} var dr=s; while(dr>=10){var u=0; while(dr>0){u+=dr%10;dr=Math.floor(dr/10);} dr=u;} return {ok:true,html:'<div class=\"big\">各位和 = '+s+'，数字根 = '+dr+'</div><div class=\"row\">数字根可用于验算乘法（弃九法）</div>'};",

 {id:"sxpalindrome", cat:"sx", icon:"🔁", name:"回文数判断", desc:"判断整数是否为回文数",

  run:"var s=String(Math.floor(Math.abs(n))),ok=s===s.split('').reverse().join(''); return {ok:true,html:'<div class=\"big\">'+(ok?'是回文数':'不是回文数')+'</div><div class=\"row\">'+s+(ok?' 正反读相同':' 正反读不同')+'</div>'};",
  test:{inputs:{n:12321}, expect:"是回文数"}},
 {id:"sxarmstrong", cat:"sx", icon:"💧", name:"水仙花数判断", desc:"判断三位数是否为水仙花数",

  test:{inputs:{n:153}, expect:"是水仙花数"}},
 {id:"sxperfect", cat:"sx", icon:"✨", name:"完全数判断", desc:"判断是否为完全数（因子和等于自身）",
  formula:"真因子之和 = n",
  inputs:[{id:"n", label:"正整数", unit:"", def:"28", min:1, max:100000}],

 {id:"sxtriangular", cat:"sx", icon:"🔺", name:"三角数", desc:"求第n个三角数",

 {id:"sxsum1n", cat:"sx", icon:"➕", name:"自然数求和", desc:"1到n的和",

 {id:"sxdayofweek", cat:"sx", icon:"📅", name:"蔡勒公式算星期", desc:"已知年月日求星期几",
  formula:"蔡勒公式（格里历）",
  inputs:[{id:"yy", label:"年", unit:"", def:"2026", min:1583},{id:"mm", label:"月", unit:"", def:"10", min:1, max:12},{id:"dd", label:"日", unit:"", def:"19", min:1, max:31}],
  run:"yy=Math.floor(yy); mm=Math.floor(mm); dd=Math.floor(dd); if(!(yy>=1583&&yy<=9999)) return {ok:false,msg:'年份须在1583~9999之间'}; if(!(mm>=1&&mm<=12)) return {ok:false,msg:'月份须在1~12之间'}; var dim=[31,(((yy%4===0&&yy%100!==0)||yy%400===0)?29:28),31,30,31,30,31,31,30,31,30,31][mm-1]; if(!(dd>=1&&dd<=dim)) return {ok:false,msg:'日期须在1~'+dim+'之间'}; var y=yy,m=mm; if(m<3){m+=12;y--;} var J=Math.floor(y/100),K=y%100,h=(dd+Math.floor(13*(m+1)/5)+K+Math.floor(K/4)+Math.floor(J/4)+5*J)%7; var w=['周六','周日','周一','周二','周三','周四','周五'][h]; return {ok:true,html:'<div class=\"big\">'+yy+'-'+mm+'-'+dd+' 是'+w+'</div><div class=\"row\">蔡勒公式，仅适用于1582年10月15日之后</div>'};",
  test:{inputs:{yy:2026,mm:10,dd:19}, expect:"是周一"}},
 {id:"sxgolden", cat:"sx", icon:"✂️", name:"黄金分割点", desc:"已知线段长度求黄金分割点",

  test:{inputs:{l:100}, expect:"长段 61.80"}},
 {id:"sxmatinv", cat:"sx", icon:"🔄", name:"2×2矩阵求逆", desc:"求2×2矩阵的逆矩阵",
  formula:"A⁻¹ = 1/(ad−bc) × [[d,−b],[−c,a]]",

 {id:"sxinterp", cat:"sx", icon:"📈", name:"线性插值", desc:"已知两点求中间x对应的y",
  formula:"y = y₀ + (y₁−y₀)(x−x₀)/(x₁−x₀)",

 {id:"sxharmonic", cat:"sx", icon:"🎵", name:"调和平均数", desc:"求一组数的调和平均数",
  formula:"H = n / Σ(1/xᵢ)",

 {id:"sxgeoavg", cat:"sx", icon:"📊", name:"几何平均数", desc:"求一组正数的几何平均数",

 {id:"sxmode", cat:"sx", icon:"👑", name:"众数", desc:"求一组数中出现次数最多的数",

 {id:"sxvariance", cat:"sx", icon:"📉", name:"总体方差", desc:"求一组数的总体方差",

 {id:"wllorentz", cat:"wl", icon:"🧲", name:"洛伦兹力", desc:"运动电荷在磁场中所受力",

 {id:"wlmc2", cat:"wl", icon:"🚀", name:"质能方程", desc:"质量对应的能量",

 {id:"wldbroglie", cat:"wl", icon:"🔬", name:"德布罗意波长", desc:"运动粒子的物质波波长",

  run:"if(!(m>0))return {ok:false,msg:'粒子质量须大于0'};if(!(v>0))return {ok:false,msg:'速度须大于0'};var lam=6.62607015e-34/(m*v);return {ok:true,html:'<div class=\"big\">λ = '+(lam*1e9).toFixed(4)+' nm</div><div class=\"row\">λ = h/(mv)，电子1e6m/s约0.73nm</div>'};",

 {id:"wlrefr", cat:"wl", icon:"💡", name:"折射定律", desc:"光从介质1进入介质2的折射角",
  formula:"n1·sinθ1 = n2·sinθ2",

  run:"var s=n1*Math.sin(theta1*Math.PI/180)/n2;if(Math.abs(s)>1)return {ok:false,msg:'发生全反射，无折射角'};var t2=Math.asin(s)*180/Math.PI;return {ok:true,html:'<div class=\"big\">θ2 = '+t2.toFixed(2)+'°</div><div class=\"row\">n1·sinθ1 = n2·sinθ2</div>'};",

 {id:"wlcrit", cat:"wl", icon:"💡", name:"全反射临界角", desc:"光密到光疏的全反射临界角",

 {id:"wllens", cat:"wl", icon:"💡", name:"透镜成像", desc:"薄透镜求像距",

 {id:"hxlimit", cat:"hx", icon:"🧪", name:"限量反应物", desc:"判断限量反应物与理论产量",
  formula:"比较 nA/aA 与 nB/aB，产量=限量物×系数×M",
  inputs:[{id:"mA", label:"反应物A质量", unit:"g", def:"10", min:0},{id:"MA", label:"A摩尔质量", unit:"g/mol", def:"2", min:0.000001},{id:"aA", label:"A系数", def:"2", min:0.000001},{id:"mB", label:"反应物B质量", unit:"g", def:"64", min:0},{id:"MB", label:"B摩尔质量", unit:"g/mol", def:"32", min:0.000001},{id:"aB", label:"B系数", def:"1", min:0.000001},{id:"aP", label:"产物系数", def:"2", min:0.000001},{id:"MP", label:"产物摩尔质量", unit:"g/mol", def:"18", min:0.000001}],
  run:"var nA=mA/MA,nB=mB/MB;var rA=nA/aA,rB=nB/aB;var lim,prod;if(rA<rB){lim='反应物A';prod=rA*aP*MP;}else{lim='反应物B';prod=rB*aP*MP;}return {ok:true,html:'<div class=\"big\">限量反应物：'+lim+'</div><div class=\"row\">理论产量 '+prod.toFixed(2)+' g</div>'};",
  test:{inputs:{mA:10,MA:2,aA:2,mB:64,MB:32,aB:1,aP:2,MP:18}, expect:"理论产量 72.00 g"}},
 {id:"hxyield", cat:"hx", icon:"🧪", name:"产率计算", desc:"实际产量占理论产量的百分率",
  formula:"产率 = 实际/理论 ×100%",

 {id:"hxhydrate", cat:"hx", icon:"🧪", name:"结晶水含量", desc:"结晶水合物中结晶水的质量分数",

 {id:"hxavgm", cat:"hx", icon:"💨", name:"混合气体平均摩尔质量", desc:"按体积分数求平均摩尔质量",

 {id:"hxgraham", cat:"hx", icon:"💨", name:"扩散速率比", desc:"格拉罕姆气体扩散定律",
  formula:"v1/v2 = √(M2/M1)",

 {id:"hxraoult", cat:"hx", icon:"🧪", name:"蒸气压降低", desc:"难挥发溶质引起蒸气压下降",

 {id:"hxboil", cat:"hx", icon:"🧪", name:"沸点升高", desc:"溶液沸点升高值",

 {id:"hxfreeze", cat:"hx", icon:"🧪", name:"凝固点降低", desc:"溶液凝固点降低值",

 {id:"hxosmo", cat:"hx", icon:"🧪", name:"渗透压", desc:"稀溶液的渗透压",

 {id:"hxksp", cat:"hx", icon:"🧪", name:"溶度积求溶解度", desc:"由 Ksp 求难溶盐溶解度",
  formula:"AB型 s=√Ksp；A2B型 s=∛(Ksp/4)",

 {id:"hxqsp", cat:"hx", icon:"🧪", name:"沉淀判断", desc:"溶度积规则判断是否沉淀",
  formula:"Q=[A]^x[B]^y，与 Ksp 比较",

  run:"if(!(x>0))return {ok:false,msg:'A系数须大于0'};if(!(y>0))return {ok:false,msg:'B系数须大于0'};var Q=Math.pow(cA,x)*Math.pow(cB,y);var r=Q>ksp?'产生沉淀':(Q<ksp?'不产生沉淀':'恰好饱和');return {ok:true,html:'<div class=\"big\">'+r+'</div><div class=\"row\">Q = '+Q.toExponential(2)+', Ksp = '+ksp.toExponential(2)+'</div>'};",

 {id:"hxweakacid", cat:"hx", icon:"🧪", name:"一元弱酸pH", desc:"已知 Ka 和浓度求 pH",
  formula:"[H⁺]=√(Ka·c)",

 {id:"hxweakbase", cat:"hx", icon:"🧪", name:"一元弱碱pH", desc:"已知 Kb 和浓度求 pH",

  run:"if(!(Kb>0))return {ok:false,msg:'电离常数Kb须大于0'};if(!(c>0))return {ok:false,msg:'碱浓度须大于0'};var oh=Math.sqrt(Kb*c);var pH=14+Math.log10(oh);return {ok:true,html:'<div class=\"big\">pH = '+pH.toFixed(2)+'</div><div class=\"row\">[OH⁻]=√(Kb·c)，pOH = '+(-Math.log10(oh)).toFixed(2)+'（氨水 Kb=1.8×10⁻⁵）</div>'};",

 {id:"hxarrh", cat:"hx", icon:"🧪", name:"阿伦尼乌斯方程", desc:"已知活化能求速率常数",

 {id:"hxactivity", cat:"hx", icon:"☢️", name:"放射性活度", desc:"已知半衰期和原子数求活度",

 {id:"hxeq", cat:"hx", icon:"🧪", name:"平衡常数Kc", desc:"由平衡浓度求 Kc",

 {id:"jrwacc", cat:"jr", icon:"🏦", name:"加权资本成本WACC", desc:"算企业综合资金成本",
  formula:"WACC = E/V×Re + D/V×Rd×(1−Tc)",
  inputs:[{id:"e", label:"股权市值", unit:"元", def:"600000", min:0},{id:"d", label:"债务", unit:"元", def:"400000", min:0},{id:"re", label:"股权成本", unit:"%", def:"10"},{id:"rd", label:"债务成本", unit:"%", def:"6"},{id:"tc", label:"所得税率", unit:"%", def:"25", min:0}],
  run:"var v=e+d; if(v<=0) return {ok:false,msg:'资本总额必须大于0'}; var w=e/v*re+d/v*rd*(1-tc/100); return {ok:true,html:'<div class=\"big\">'+w.toFixed(2)+'%</div><div class=\"row\">WACC = E/V×Re + D/V×Rd×(1−Tc)</div>'};",
  test:{inputs:{e:600000,d:400000,re:10,rd:6,tc:25}, expect:"7.80%"}},
 {id:"jrddm", cat:"jr", icon:"📉", name:"DDM股利贴现估值", desc:"固定增长模型算股票内在价值",
  formula:"P₀ = D₁ ÷ (r − g)",
  inputs:[{id:"d1", label:"下期股息", unit:"元", def:"2", min:0},{id:"r", label:"要求回报率", unit:"%", def:"8", min:0},{id:"g", label:"股利增长率", unit:"%", def:"3"}],
  run:"if(r<=g) return {ok:false,msg:'要求回报率必须大于股利增长率'}; return {ok:true,html:'<div class=\"big\">'+(d1/(r/100-g/100)).toFixed(2)+' 元</div><div class=\"row\">P₀ = D₁ ÷ (r − g)</div>'};",
  test:{inputs:{d1:2,r:8,g:3}, expect:"40.00 元"}},
 {id:"jreps", cat:"jr", icon:"🧾", name:"每股收益EPS", desc:"净利润除以总股数",
  formula:"EPS = 净利润 ÷ 总股数",
  inputs:[{id:"profit", label:"净利润", unit:"元", def:"50000000"},{id:"shares", label:"总股数", unit:"股", def:"100000000", min:1}],
  run:"if(shares<=0) return {ok:false,msg:'总股数必须大于0'}; return {ok:true,html:'<div class=\"big\">'+(profit/shares).toFixed(2)+' 元</div><div class=\"row\">EPS = 净利润 ÷ 总股数</div>'};",
  test:{inputs:{profit:50000000,shares:100000000}, expect:"0.50 元"}},
 {id:"jrroe", cat:"jr", icon:"🔬", name:"ROE杜邦分析", desc:"净资产收益率三因子拆解",
  formula:"ROE = 净利率 × 周转率 × 权益乘数",
  inputs:[{id:"profit", label:"净利润", unit:"元", def:"2000000"},{id:"sales", label:"营收", unit:"元", def:"20000000", min:1},{id:"assets", label:"总资产", unit:"元", def:"25000000", min:1},{id:"equity", label:"净资产", unit:"元", def:"10000000", min:1}],
  run:"if(!(sales>0)||!(assets>0)||!(equity>0))return {ok:false,msg:'营收、总资产、净资产须大于0'};var roe=profit/equity*100, pm=profit/sales*100, ato=sales/assets, em=assets/equity; return {ok:true,html:'<div class=\"big\">ROE '+roe.toFixed(2)+'%</div><div class=\"row\">净利率 '+pm.toFixed(2)+'% × 周转 '+ato.toFixed(2)+' × 权益乘数 '+em.toFixed(2)+'</div>'};",
  test:{inputs:{profit:2000000,sales:20000000,assets:25000000,equity:10000000}, expect:"ROE 20.00%"}},
 {id:"jrpeg", cat:"jr", icon:"⚖️", name:"PEG估值", desc:"市盈率相对盈利增长比率",
  formula:"PEG = PE ÷ 盈利增长率(%)",
  inputs:[{id:"pe", label:"市盈率PE", def:"20", min:0},{id:"g", label:"盈利增长率", unit:"%", def:"25", min:0.1}],
  run:"if(g<=0) return {ok:false,msg:'增长率必须大于0'}; return {ok:true,html:'<div class=\"big\">'+(pe/g).toFixed(2)+'</div><div class=\"row\">PEG = PE ÷ 增长率，<1可能低估</div>'};",
  test:{inputs:{pe:20,g:25}, expect:"0.80"}},
 {id:"jrebitda", cat:"jr", icon:"🏭", name:"EV/EBITDA倍数", desc:"企业价值倍数估值",
  formula:"EV/EBITDA，EV = 市值 + 净债务",
  inputs:[{id:"mktcap", label:"市值", unit:"元", def:"80000000", min:0},{id:"debt", label:"有息负债", unit:"元", def:"20000000", min:0},{id:"cash", label:"现金", unit:"元", def:"5000000", min:0},{id:"ebitda", label:"EBITDA", unit:"元", def:"10000000"}],
  run:"if(ebitda<=0) return {ok:false,msg:'EBITDA必须大于0'}; var ev=mktcap+debt-cash; return {ok:true,html:'<div class=\"big\">'+(ev/ebitda).toFixed(2)+' 倍</div><div class=\"row\">EV = 市值 + 负债 − 现金</div>'};",
  test:{inputs:{mktcap:80000000,debt:20000000,cash:5000000,ebitda:10000000}, expect:"9.50 倍"}},
 {id:"jrmktcap", cat:"jr", icon:"💹", name:"市值计算", desc:"股价乘总股本算市值",
  formula:"市值 = 股价 × 总股本",
  inputs:[{id:"price", label:"股价", unit:"元", def:"10", min:0},{id:"shares", label:"总股本", unit:"万股", def:"50000", min:0}],
  run:"return {ok:true,html:'<div class=\"big\">'+(price*shares/10000).toFixed(2)+' 亿元</div><div class=\"row\">市值 = 股价 × 总股本</div>'};",
  test:{inputs:{price:10,shares:50000}, expect:"50.00 亿元"}},
 {id:"jrdivpay", cat:"jr", icon:"💸", name:"股息支付率", desc:"分红占利润的比例",
  formula:"支付率 = 每股股息 ÷ EPS",
  inputs:[{id:"dps", label:"每股股息", unit:"元", def:"0.6", min:0},{id:"eps", label:"每股收益EPS", unit:"元", def:"2", min:0.01}],
  run:"if(eps<=0) return {ok:false,msg:'EPS必须大于0'}; return {ok:true,html:'<div class=\"big\">'+(dps/eps*100).toFixed(2)+'%</div><div class=\"row\">股息支付率 = 每股股息 ÷ EPS</div>'};",
  test:{inputs:{dps:0.6,eps:2}, expect:"30.00%"}},
 {id:"jrbondp", cat:"jr", icon:"📜", name:"债券价格", desc:"按到期收益率算附息债券价格",
  formula:"P = Σ票息/(1+y)^t + 面值/(1+y)^n",
  inputs:[{id:"c", label:"年票息", unit:"元", def:"50", min:0},{id:"m", label:"面值", unit:"元", def:"1000", min:1},{id:"n", label:"剩余年限", unit:"年", def:"3", min:1, max:30},{id:"y", label:"到期收益率", unit:"%", def:"4", min:0}],
  run:"if(n>1200)return {ok:false,msg:'剩余年限不能超过1200年'};var d=1+y/100;if(!(d>0))return {ok:false,msg:'到期收益率须大于-100%'};var p=0;for(var t=1;t<=n;t++){var cf=t<n?c:c+m;p+=cf/Math.pow(d,t);} return {ok:true,html:'<div class=\"big\">'+p.toFixed(2)+' 元</div><div class=\"row\">P = 票息折现 + 面值折现</div>'};",
  test:{inputs:{c:50,m:1000,n:3,y:4}, expect:"1027.75 元"}},
 {id:"jrmdur", cat:"jr", icon:"⏱", name:"债券久期", desc:"麦考利久期衡量利率敏感度",
  formula:"D = Σ t×PV(CF_t) ÷ P",
  inputs:[{id:"c", label:"年票息", unit:"元", def:"50", min:0},{id:"m", label:"面值", unit:"元", def:"1000", min:1},{id:"n", label:"剩余年限", unit:"年", def:"3", min:1, max:30},{id:"y", label:"到期收益率", unit:"%", def:"4", min:0}],
  run:"if(!(n>=1))return {ok:false,msg:'剩余年限须大于0'};if(n>1200)return {ok:false,msg:'剩余年限不能超过1200年'};var d=1+y/100;if(!(d>0))return {ok:false,msg:'到期收益率须大于-100%'};var p=0,w=0;for(var t=1;t<=n;t++){var cf=t<n?c:c+m,pv=cf/Math.pow(d,t);p+=pv;w+=t*pv;} return {ok:true,html:'<div class=\"big\">'+(w/p).toFixed(2)+' 年</div><div class=\"row\">麦考利久期：现金流时间的加权平均</div>'};",
  test:{inputs:{c:50,m:1000,n:3,y:4}, expect:"2.86 年"}},
 
 {id:"jrdebtinc", cat:"jr", icon:"🏠", name:"债务收入比", desc:"月负债占月收入的比例",
  formula:"DTI = 月总负债 ÷ 月总收入",
  inputs:[{id:"debt", label:"月总负债", unit:"元", def:"8000", min:0},{id:"income", label:"月总收入", unit:"元", def:"20000", min:1}],
  run:"if(income<=0) return {ok:false,msg:'月收入必须大于0'}; var r=debt/income*100; return {ok:true,html:'<div class=\"big\">'+r.toFixed(2)+'%</div><div class=\"row\">'+(r>50?'超过50%，负债偏重':r>30?'30–50%，适中':'低于30%，较健康')+'</div>'};",
  test:{inputs:{debt:8000,income:20000}, expect:"40.00%"}},
 {id:"jrcur", cat:"jr", icon:"💧", name:"流动比率", desc:"短期偿债能力指标",
  formula:"流动比率 = 流动资产 ÷ 流动负债",
  inputs:[{id:"ca", label:"流动资产", unit:"元", def:"500000", min:0},{id:"cl", label:"流动负债", unit:"元", def:"250000", min:1}],
  run:"if(cl<=0) return {ok:false,msg:'流动负债必须大于0'}; return {ok:true,html:'<div class=\"big\">'+(ca/cl).toFixed(2)+'</div><div class=\"row\">流动比率（>2较稳健）</div>'};",
  test:{inputs:{ca:500000,cl:250000}, expect:"2.00"}},
 {id:"jrquick", cat:"jr", icon:"⚡", name:"速动比率", desc:"剔除存货的偿债能力",
  formula:"速动比率 = (流动资产 − 存货) ÷ 流动负债",
  inputs:[{id:"ca", label:"流动资产", unit:"元", def:"500000", min:0},{id:"inv", label:"存货", unit:"元", def:"150000", min:0},{id:"cl", label:"流动负债", unit:"元", def:"250000", min:1}],
  run:"if(cl<=0) return {ok:false,msg:'流动负债必须大于0'}; return {ok:true,html:'<div class=\"big\">'+((ca-inv)/cl).toFixed(2)+'</div><div class=\"row\">速动比率（>1较稳健）</div>'};",
  test:{inputs:{ca:500000,inv:150000,cl:250000}, expect:"1.40"}},
 {id:"jrgross", cat:"jr", icon:"📦", name:"毛利率", desc:"销售毛利率计算",
  formula:"毛利率 = (营收 − 成本) ÷ 营收",
  inputs:[{id:"rev", label:"营收", unit:"元", def:"1000000", min:1},{id:"cost", label:"营业成本", unit:"元", def:"600000", min:0}],
  run:"if(rev<=0) return {ok:false,msg:'营收必须大于0'}; return {ok:true,html:'<div class=\"big\">'+((rev-cost)/rev*100).toFixed(2)+'%</div><div class=\"row\">毛利率 = (营收 − 成本) ÷ 营收</div>'};",
  test:{inputs:{rev:1000000,cost:600000}, expect:"40.00%"}},
 {id:"jrnetm", cat:"jr", icon:"💵", name:"销售净利率", desc:"净利润占营收的比例",
  formula:"净利率 = 净利润 ÷ 营收",
  inputs:[{id:"profit", label:"净利润", unit:"元", def:"120000"},{id:"rev", label:"营收", unit:"元", def:"1000000", min:1}],
  run:"if(rev<=0) return {ok:false,msg:'营收必须大于0'}; return {ok:true,html:'<div class=\"big\">'+(profit/rev*100).toFixed(2)+'%</div><div class=\"row\">净利率 = 净利润 ÷ 营收</div>'};",
  test:{inputs:{profit:120000,rev:1000000}, expect:"12.00%"}},
 {id:"jrear", cat:"jr", icon:"🔁", name:"实际年利率EAR", desc:"名义利率按复利次数折年化",
  formula:"EAR = (1 + 名义/m)^m − 1",
  inputs:[{id:"r", label:"名义年利率", unit:"%", def:"12", min:0},{id:"m", label:"年复利次数", def:"12", min:1, max:365}],
  run:"if(m<=0) return {ok:false,msg:'复利次数必须大于0'}; var ear=(Math.pow(1+r/100/m,m)-1)*100; return {ok:true,html:'<div class=\"big\">'+ear.toFixed(2)+'%</div><div class=\"row\">EAR = (1 + 名义/m)^m − 1</div>'};",
  test:{inputs:{r:12,m:12}, expect:"12.68%"}},
 {id:"jrcont", cat:"jr", icon:"∞", name:"连续复利终值", desc:"按连续复利算终值",
  formula:"FV = P·e^(rt)",
  inputs:[{id:"p", label:"本金", unit:"元", def:"10000", min:0},{id:"r", label:"年利率", unit:"%", def:"5", min:0},{id:"t", label:"年限", unit:"年", def:"3", min:0}],
  run:"if(r/100*t>700)return {ok:false,msg:'利率或年限过大，结果超出计算范围'};var fv=p*Math.exp(r/100*t); return {ok:true,html:'<div class=\"big\">'+fv.toFixed(2)+' 元</div><div class=\"row\">FV = P·e^(rt)，连续复利</div>'};",
  test:{inputs:{p:10000,r:5,t:3}, expect:"11618.34 元"}},
 {id:"jrperpet", cat:"jr", icon:"♾", name:"永续年金现值", desc:"永远领钱的现值",
  formula:"PV = C ÷ r",
  inputs:[{id:"c", label:"每期金额", unit:"元", def:"1000", min:0},{id:"r", label:"折现率", unit:"%", def:"5", min:0.01}],
  run:"if(r<=0) return {ok:false,msg:'折现率必须大于0'}; return {ok:true,html:'<div class=\"big\">'+(c/(r/100)).toFixed(2)+' 元</div><div class=\"row\">PV = C ÷ r</div>'};",
  test:{inputs:{c:1000,r:5}, expect:"20000.00 元"}},
 {id:"jrtax", cat:"jr", icon:"🧾", name:"个税速算", desc:"中国工资薪金个税速算",
  formula:"(月薪−5000)×税率 − 速算扣除数",
  inputs:[{id:"salary", label:"税前月薪", unit:"元", def:"20000", min:0}],
  run:"var t=salary-5000; if(t<=0) return {ok:true,html:'<div class=\"big\">0.00 元</div><div class=\"row\">未达起征点，无需缴税</div>'}; var rate,ded; if(t<=3000){rate=0.03;ded=0;}else if(t<=12000){rate=0.1;ded=210;}else if(t<=25000){rate=0.2;ded=1410;}else if(t<=35000){rate=0.25;ded=2660;}else if(t<=55000){rate=0.3;ded=4410;}else if(t<=80000){rate=0.35;ded=7160;}else{rate=0.45;ded=15160;} var tax=t*rate-ded; return {ok:true,html:'<div class=\"big\">'+tax.toFixed(2)+' 元</div><div class=\"row\">应纳税所得 '+t.toFixed(0)+' 元，税率 '+(rate*100)+'%</div>'};",
  test:{inputs:{salary:20000}, expect:"1590.00 元"}},
 {id:"jrsocial", cat:"jr", icon:"🏥", name:"五险一金", desc:"算工资里个人缴纳部分",
  formula:"养老8% + 医疗2% + 失业0.5% + 公积金",
  inputs:[{id:"salary", label:"税前月薪", unit:"元", def:"10000", min:0},{id:"gjj", label:"公积金比例", type:"select", options:[{v:"5",t:"5%"},{v:"8",t:"8%"},{v:"12",t:"12%"}], def:"12"}],
  run:"var g=Number(gjj), total=salary*(0.08+0.02+0.005+g/100); return {ok:true,html:'<div class=\"big\">'+total.toFixed(2)+' 元</div><div class=\"row\">养老8% + 医疗2% + 失业0.5% + 公积金'+g+'%</div>'};",
  test:{inputs:{salary:10000,gjj:"12"}, expect:"2250.00 元"}},
 {id:"jrot", cat:"jr", icon:"🕐", name:"加班费计算", desc:"按法定倍数算加班工资",
  formula:"时薪=月薪÷21.75÷8；1.5×/2×/3×",
  inputs:[{id:"salary", label:"月薪", unit:"元", def:"8000", min:0},{id:"h1", label:"平时加班", unit:"小时", def:"10", min:0},{id:"h2", label:"休息日加班", unit:"小时", def:"8", min:0},{id:"h3", label:"法定假日加班", unit:"小时", def:"0", min:0}],
  run:"var hr=salary/21.75/8, pay=hr*(h1*1.5+h2*2+h3*3); return {ok:true,html:'<div class=\"big\">'+pay.toFixed(2)+' 元</div><div class=\"row\">时薪 '+hr.toFixed(2)+' 元；平时1.5×/休息日2×/法定3×</div>'};",
  test:{inputs:{salary:8000,h1:10,h2:8,h3:0}, expect:"1425.29 元"}},
 {id:"jrhour", cat:"jr", icon:"⏰", name:"月薪换算时薪", desc:"按法定计薪天数折时薪",
  formula:"时薪 = 月薪 ÷ 21.75 ÷ 8",
  inputs:[{id:"salary", label:"月薪", unit:"元", def:"12000", min:0}],
  run:"var hr=salary/21.75/8; return {ok:true,html:'<div class=\"big\">'+hr.toFixed(2)+' 元/小时</div><div class=\"row\">时薪 = 月薪 ÷ 21.75 ÷ 8</div>'};",
  test:{inputs:{salary:12000}, expect:"68.97 元/小时"}},
 {id:"jraa", cat:"jr", icon:"🍽", name:"AA分账", desc:"聚餐人均分摊速算",
  formula:"人均 = 总额 ÷ 人数",
  inputs:[{id:"total", label:"消费总额", unit:"元", def:"357", min:0},{id:"n", label:"人数", def:"3", min:1}],
  run:"if(!(n>0))return {ok:false,msg:'人数须大于0'};return {ok:true,html:'<div class=\"big\">'+(total/n).toFixed(2)+' 元/人</div><div class=\"row\">AA分账 = 总额 ÷ 人数</div>'};",
  test:{inputs:{total:357,n:3}, expect:"119.00 元/人"}},
 {id:"jrcardep", cat:"jr", icon:"🚗", name:"汽车折旧", desc:"直线法算车辆年折旧",
  formula:"年折旧 = (原值 − 残值) ÷ 年限",
  inputs:[{id:"cost", label:"购车原值", unit:"元", def:"200000", min:0},{id:"sv", label:"预计残值", unit:"元", def:"20000", min:0},{id:"n", label:"使用年限", unit:"年", def:"5", min:1}],
  run:"if(!(n>0))return {ok:false,msg:'使用年限须大于0'};return {ok:true,html:'<div class=\"big\">'+((cost-sv)/n).toFixed(2)+' 元/年</div><div class=\"row\">直线法：(原值 − 残值) ÷ 年限</div>'};",
  test:{inputs:{cost:200000,sv:20000,n:5}, expect:"36000.00 元/年"}},
 {id:"jrsydep", cat:"jr", icon:"📉", name:"年数总和法折旧", desc:"加速折旧法算某年折旧额",
  formula:"第k年 = (原值−残值)×(n−k+1)÷[n(n+1)/2]",
  inputs:[{id:"cost", label:"原值", unit:"元", def:"100000", min:0},{id:"sv", label:"残值", unit:"元", def:"10000", min:0},{id:"n", label:"年限", unit:"年", def:"5", min:1},{id:"k", label:"第几年", def:"1", min:1}],
  run:"if(k>n) return {ok:false,msg:'年份不能超过总年限'}; var dep=(cost-sv)*(n-k+1)/(n*(n+1)/2); return {ok:true,html:'<div class=\"big\">'+dep.toFixed(2)+' 元</div><div class=\"row\">年数总和法：第'+k+'年折旧</div>'};",
  test:{inputs:{cost:100000,sv:10000,n:5,k:1}, expect:"30000.00 元"}},
 {id:"jrgold", cat:"jr", icon:"🪙", name:"黄金买卖盈亏", desc:"算黄金实物/积存买卖盈亏",
  formula:"盈亏 = (卖 − 买) × 克数 − 手续费",
  inputs:[{id:"buy", label:"买入价", unit:"元/克", def:"580", min:0},{id:"sell", label:"卖出价", unit:"元/克", def:"620", min:0},{id:"g", label:"克数", unit:"克", def:"50", min:0},{id:"fee", label:"手续费", unit:"元", def:"100", min:0}],
  run:"var pl=(sell-buy)*g-fee; return {ok:true,html:'<div class=\"big\">'+pl.toFixed(2)+' 元</div><div class=\"row\">盈亏 = (卖 − 买) × 克数 − 手续费</div>'};",
  test:{inputs:{buy:580,sell:620,g:50,fee:100}, expect:"1900.00 元"}},
 {id:"kfb64", cat:"kf", icon:"🔐", name:"Base64编解码", desc:"Base64编码与解码",
  formula:"RFC 4648",
  inputs:[{id:"mode", label:"模式", type:"select", options:[{v:"e",t:"编码"},{v:"d",t:"解码"}], def:"e"},{id:"text", label:"文本", type:"textarea", def:"Hello"}],
  run:"try{var out=mode==='e'?btoa(unescape(encodeURIComponent(text))):decodeURIComponent(escape(atob(text)));return {ok:true,html:'<div class=\"big\">'+out+'</div><div class=\"row\">Base64 '+(mode==='e'?'编码':'解码')+'</div>'};}catch(e){return {ok:false,msg:'解码失败：输入不是有效的Base64'};}",
  test:{inputs:{mode:"e",text:"Hello"}, expect:"SGVsbG8="}},
 {id:"kfurl", cat:"kf", icon:"🔗", name:"URL编解码", desc:"URL百分号编码与解码",
  formula:"encodeURIComponent",

  run:"var out='';if(mode==='e'){out=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');}else{out=text.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'\"').replace(/&amp;/g,'&');}return {ok:true,html:'<div class=\"big\">'+out+'</div><div class=\"row\">HTML实体'+(mode==='e'?'编码':'解码')+'</div>'};",
  test:{inputs:{mode:"e",text:"<a>"}, expect:"&lt;a&gt;"}},
 {id:"kftimediff", cat:"kf", icon:"📅", name:"日期差计算", desc:"算两个日期相差天数",
  formula:"UTC毫秒差 ÷ 86400000",
  inputs:[{id:"d1", label:"日期1", type:"text", def:"2026-01-01", hint:"格式 YYYY-MM-DD"},{id:"d2", label:"日期2", type:"text", def:"2026-01-10", hint:"格式 YYYY-MM-DD"}],
  run:"function pd(s){var m=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(s);if(!m)return null;return Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]));}var a=pd(d1),b=pd(d2);if(a===null||b===null)return {ok:false,msg:'日期格式应为 YYYY-MM-DD'};return {ok:true,html:'<div class=\"big\">'+Math.round((b-a)/86400000)+' 天</div><div class=\"row\">日期2 − 日期1</div>'};",
  test:{inputs:{d1:"2026-01-01",d2:"2026-01-10"}, expect:"9 天"}},
 {id:"kfweekday", cat:"kf", icon:"🗓", name:"星期查询", desc:"查某天是星期几",
