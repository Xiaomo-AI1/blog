 {id:"kfbit", cat:"kf", icon:"⚙", name:"位运算计算器", desc:"AND/OR/XOR/移位/取反",
  formula:"JS位运算符",
  inputs:[{id:"a", label:"数A", def:"12"},{id:"b", label:"数B", def:"10"},{id:"op", label:"运算", type:"select", options:[{v:"and",t:"A AND B"},{v:"or",t:"A OR B"},{v:"xor",t:"A XOR B"},{v:"shl",t:"A 左移 B"},{v:"shr",t:"A 右移 B"},{v:"not",t:"NOT A"}], def:"and"}],
  run:"var r=0;if(op==='and'){r=a&b;}else if(op==='or'){r=a|b;}else if(op==='xor'){r=a^b;}else if(op==='shl'){r=a<<b;}else if(op==='shr'){r=a>>b;}else{r=~a;}return {ok:true,html:'<div class=\"big\">'+r+'</div><div class=\"row\">十进制结果</div><div class=\"row\">二进制：'+(r>>>0).toString(2)+'</div>'};",
  test:{inputs:{a:12,b:10,op:"and"}, expect:">8<"}},
 {id:"kfjson2ts", cat:"kf", icon:"📐", name:"JSON转TS接口", desc:"JSON推导TypeScript接口",
  formula:"递归类型推导",
  inputs:[{id:"json", label:"JSON", type:"textarea", def:'{"name":"a","age":3}'}],
  run:"function ty(v){if(v===null)return 'any';if(Array.isArray(v)){return v.length?ty(v[0])+'[]':'any[]';}var t=typeof v;if(t==='object'){return 'object';}return t;}try{var o=JSON.parse(json);if(typeof o!=='object'||o===null||Array.isArray(o))return {ok:false,msg:'请输入JSON对象'};var rows='';for(var k in o){rows+='  '+k+': '+ty(o[k])+';\\n';}var html='';var ps=rows.split('\\n');for(var i=0;i<ps.length;i++){if(ps[i]){html+='<div class=\"row\">'+ps[i]+'</div>';}}return {ok:true,html:'<div class=\"big\">interface Root</div>'+html};}catch(e){return {ok:false,msg:'JSON解析失败'};}",
  test:{inputs:{json:'{"name":"a","age":3}'}, expect:"age: number"}},
 {id:"ydbmi", cat:"yd", icon:"⚖️", name:"BMI指数", desc:"身体质量指数计算",
  formula:"BMI = 体重kg ÷ 身高m²",
  inputs:[{id:"bw", label:"体重", unit:"kg", def:"70", min:20, max:300},{id:"h", label:"身高", unit:"cm", def:"175", min:100, max:250}],
  run:"if(!(h>0))return {ok:false,msg:'身高须大于0'};var bmi=bw/Math.pow(h/100,2),lv=bmi<18.5?'偏瘦':bmi<24?'正常':bmi<28?'超重':'肥胖';return {ok:true,html:'<div class=\"big\">'+bmi.toFixed(2)+'</div><div class=\"row\">'+lv+'（中国标准：18.5–24正常）</div>'};",
  test:{inputs:{bw:70,h:175}, expect:"22.86"}},
 {id:"ydbfp", cat:"yd", icon:"🥩", name:"体脂率估算", desc:"Deurenberg公式估算体脂率",
  formula:"男 1.2×BMI+0.23×年龄−16.2；女 −5.4",
  inputs:[{id:"bmi", label:"BMI", def:"22.86", min:10, max:60},{id:"age", label:"年龄", unit:"岁", def:"25", min:10, max:100},{id:"sex", label:"性别", type:"select", options:[{v:"m",t:"男"},{v:"f",t:"女"}], def:"m"}],
  run:"var bfp=1.2*bmi+0.23*age-(sex==='m'?16.2:5.4);var lv=sex==='m'?(bfp<10?'偏低':bfp<=20?'正常':'偏高'):(bfp<18?'偏低':bfp<=28?'正常':'偏高');return {ok:true,html:'<div class=\"big\">'+bfp.toFixed(2)+'%</div><div class=\"row\">'+lv+'（估算值，仅供参考）</div>'};",
  test:{inputs:{bmi:22.86,age:25,sex:"m"}, expect:"16.98%"}},
 {id:"ydwhr", cat:"yd", icon:"📏", name:"腰臀比WHR", desc:"腰围臀围比评估腹型肥胖",
  formula:"WHR = 腰围 ÷ 臀围",
  inputs:[{id:"waist", label:"腰围", unit:"cm", def:"80", min:40, max:200},{id:"hip", label:"臀围", unit:"cm", def:"95", min:40, max:200},{id:"sex", label:"性别", type:"select", options:[{v:"m",t:"男"},{v:"f",t:"女"}], def:"m"}],
  run:"if(!(hip>0))return {ok:false,msg:'臀围须大于0'};var r=waist/hip, bad=sex==='m'?r>=0.9:r>=0.85;return {ok:true,html:'<div class=\"big\">'+r.toFixed(2)+'</div><div class=\"row\">'+(bad?'偏高，腹型肥胖风险':'正常范围')+'</div>'};",
  test:{inputs:{waist:80,hip:95,sex:"m"}, expect:"0.84"}},
 {id:"ydwhtr", cat:"yd", icon:"📐", name:"腰高比WHtR", desc:"腰围身高比，0.5为健康线",
  formula:"WHtR = 腰围 ÷ 身高",
  inputs:[{id:"waist", label:"腰围", unit:"cm", def:"80", min:40, max:200},{id:"h", label:"身高", unit:"cm", def:"175", min:100, max:250}],
  run:"if(!(h>0))return {ok:false,msg:'身高须大于0'};var r=waist/h;return {ok:true,html:'<div class=\"big\">'+r.toFixed(2)+'</div><div class=\"row\">'+(r<0.5?'＜0.5 健康':'≥0.5 建议减腰围')+'</div>'};",
  test:{inputs:{waist:80,h:175}, expect:"0.46"}},
 {id:"ydideal", cat:"yd", icon:"🎯", name:"标准体重", desc:"改良Broca公式算标准体重",
  formula:"男 (身高−80)×0.7；女 (身高−70)×0.6",

  run:"var w=sex==='m'?(h-80)*0.7:(h-70)*0.6;return {ok:true,html:'<div class=\"big\">'+w.toFixed(2)+' kg</div><div class=\"row\">标准体重 ±10% 均属正常</div>'};",

 {id:"ydwaterday", cat:"yd", icon:"💧", name:"每日饮水量", desc:"按体重算每天该喝多少水",
  formula:"体重kg × 35ml（运动日×40）",

  run:"var ml=bw*Number(sport);return {ok:true,html:'<div class=\"big\">'+ml.toFixed(0)+' ml</div><div class=\"row\">约 '+(ml/500).toFixed(1)+' 瓶500ml矿泉水</div>'};",

 {id:"ydsleep", cat:"yd", icon:"😴", name:"睡眠周期规划", desc:"按90分钟周期推入睡时间",
  formula:"入睡 = 起床 − 周期×90分钟",
  inputs:[{id:"wake", label:"计划起床", type:"text", def:"07:00", hint:"格式 HH:MM"}],
  run:"var mt=/^(\\d{1,2}):(\\d{2})$/.exec(wake);if(!mt)return {ok:false,msg:'时间格式应为 HH:MM'};var mins=Number(mt[1])*60+Number(mt[2]);function fmt(x){x=((x%1440)+1440)%1440;var h=Math.floor(x/60),mm=x%60;return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;}return {ok:true,html:'<div class=\"big\">'+fmt(mins-540)+'</div><div class=\"row\">睡6个周期(9小时)：'+fmt(mins-540)+' 入睡</div><div class=\"row\">睡5个周期(7.5小时)：'+fmt(mins-450)+' 入睡</div>'};",
  test:{inputs:{wake:"07:00"}, expect:"22:00"}},
 {id:"ydbp", cat:"yd", icon:"❤️", name:"血压分级评估", desc:"按收缩压舒张压分级",
  formula:"中国高血压防治指南分级",
  inputs:[{id:"sbp", label:"收缩压", unit:"mmHg", def:"135", min:60, max:260},{id:"dbp", label:"舒张压", unit:"mmHg", def:"85", min:30, max:160}],
  run:"var lv='';if(sbp<90||dbp<60){lv='偏低';}else if(sbp<120&&dbp<80){lv='正常';}else if(sbp<140&&dbp<90){lv='正常高值';}else{lv='高血压（建议就医）';}return {ok:true,html:'<div class=\"big\">'+lv+'</div><div class=\"row\">'+sbp+'/'+dbp+' mmHg</div>'};",
  test:{inputs:{sbp:135,dbp:85}, expect:"正常高值"}},
 {id:"ydhr", cat:"yd", icon:"💓", name:"心率计算", desc:"最大心率(三公式)/五区间/燃脂/Karvonen目标/乳酸阈值/静息与恢复心率评估一站式",
  formula:"最大心率：Fox 220−年龄、Tanaka 208−0.7×年龄、Gellish 207−0.7×年龄；区间按 220−年龄 的 50%~100% 分五区；Karvonen 目标=（最大−静息）×强度+静息；乳酸阈值≈最大×88%",
  inputs:[
   {id:"mode", label:"功能", type:"select", def:"zone", options:[{v:"zone",t:"心率五区间/燃脂区间"},{v:"max",t:"最大心率估算（三公式）"},{v:"karvonen",t:"Karvonen 目标心率"},{v:"lactate",t:"乳酸阈值心率"},{v:"rest",t:"静息心率评估"},{v:"rec",t:"恢复心率评估"}]},
   {id:"age", label:"年龄", unit:"岁", when:"mode=zone,max,karvonen,lactate", def:"25", min:5, max:100},
   {id:"rhr", label:"静息心率", unit:"bpm", when:"mode=karvonen,rest", def:"60"},
   {id:"lv", label:"运动强度", unit:"%", when:"mode=karvonen", type:"select", def:"60", options:[{v:"40",t:"40%"},{v:"50",t:"50%"},{v:"60",t:"60%"},{v:"70",t:"70%"},{v:"80",t:"80%"},{v:"90",t:"90%"}]},
   {id:"peak", label:"运动结束时心率", unit:"bpm", when:"mode=rec", def:"170"},
   {id:"after", label:"1 分钟后心率", unit:"bpm", when:"mode=rec", def:"140"}
  ],
  run:"function row(k,v){return '<div class=\"row\">'+k+'：'+v+'</div>';}\nvar ageN=Number(age);\nif(mode==='rest'){\n  var r0=Number(rhr);\n  if(!(r0>0))return {ok:false,msg:'请输入静息心率'};\n  var lv0=r0<60?'偏低（运动员常见）':r0<=100?'正常':'偏快（建议关注）';\n  return {ok:true,html:'<div class=\"big\">'+lv0+'</div>'+row('静息心率',r0+' bpm（晨起静卧时测量最准，仅供参考）')};\n}\nif(mode==='rec'){\n  var pk=Number(peak),af=Number(after);\n  if(!(pk>0&&af>0))return {ok:false,msg:'请输入运动后心率'};\n  var drop=pk-af,lv1=drop>=30?'优秀':drop>=20?'良好':drop>=12?'一般':'偏弱';\n  return {ok:true,html:'<div class=\"big\">下降 '+drop+' bpm · '+lv1+'</div>'+row('说明','运动停止 1 分钟后的心率下降幅度，反映心肺恢复能力')};\n}\nif(!(ageN>=5&&ageN<=100))return {ok:false,msg:'年龄须在 5~100 之间'};\nvar fox=220-ageN,tanaka=208-0.7*ageN,gellish=207-0.7*ageN;\nif(mode==='max'){\n  return {ok:true,html:'<div class=\"big\">≈ '+tanaka.toFixed(0)+' bpm（Tanaka）</div>'+row('Fox 公式','220 − 年龄 = '+fox+' bpm')+row('Tanaka 公式','208 − 0.7×年龄 = '+tanaka.toFixed(0)+' bpm')+row('Gellish 公式','207 − 0.7×年龄 = '+gellish.toFixed(0)+' bpm')+row('说明','均为人群估算，个体以实测为准')};\n}\nif(mode==='zone'){\n  function z(p){return Math.round(fox*p/100);}\n  var html='<div class=\"big\">最大心率 '+fox+' bpm（220−年龄）</div>';\n  html+='<div class=\"row\">Z1 恢复 '+z(50)+'–'+z(60)+'</div>';\n  html+='<div class=\"row\">Z2 燃脂 '+z(60)+'–'+z(70)+'</div>';\n  html+='<div class=\"row\">Z3 有氧 '+z(70)+'–'+z(80)+'</div>';\n  html+='<div class=\"row\">Z4 阈值 '+z(80)+'–'+z(90)+'</div>';\n  html+='<div class=\"row\">Z5 极限 '+z(90)+'–'+z(100)+'</div>';\n  return {ok:true,html:html};\n}\nif(mode==='karvonen'){\n  var r1=Number(rhr);\n  if(!(r1>0&&r1<fox))return {ok:false,msg:'静息心率须大于 0 且小于最大心率'};\n  var target=(fox-r1)*Number(lv)/100+r1;\n  return {ok:true,html:'<div class=\"big\">'+target.toFixed(0)+' bpm</div>'+row('公式','目标心率 =（最大心率 − 静息心率）×强度 + 静息心率')+row('参数','最大心率 '+fox+'（220−年龄），强度 '+lv+'%')};\n}\nif(mode==='lactate'){\n  var lthr=Math.round(fox*0.88);\n  return {ok:true,html:'<div class=\"big\">'+lthr+' bpm</div>'+row('说明','乳酸阈值心率 ≈ 最大心率（220−年龄）×88%，仅供参考')};\n}\nreturn {ok:false,msg:'请选择功能'};",
  test:{inputs:{mode:"zone",age:25}, expect:"Z2 燃脂 117–137"}},
 {id:"ydkcal", cat:"yd", icon:"🔥", name:"热量消耗计算", desc:"23种运动+登山爬升+跑步+BMR/TDEE一站式计算，结果公示公式并附参考消耗表",
  formula:"运动 kcal = MET×体重×时长；登山爬升 ≈ 体重×爬升米数×0.01；跑步 ≈ 体重×公里数×1.036；BMR（Mifflin-St Jeor）男 = 10W+6.25H−5A+5，女 −161；TDEE = BMR×活动系数。MET 数据：2011 Compendium",

  run:"var sn=Number(sn),beta=Number(beta),p0=Number(p0),pk=Number(pk),pf=Number(pf); if(!(sn>0)) return {ok:false,msg:'额定容量须大于0'}; if(!(beta>=0&&beta<=200)) return {ok:false,msg:'负载率应在0~200%之间'}; if(!(p0>=0)) return {ok:false,msg:'铁损不能为负'}; if(!(pk>=0)) return {ok:false,msg:'铜损不能为负'}; if(!(pf>0&&pf<=1)) return {ok:false,msg:'功率因数应在(0,1]之间'}; var b=beta/100; var p2=sn*b*pf; var loss=p0+pk*b*b; var den=p2+loss; var eff=den>0?p2/den*100:0; var mb=pk>0?Math.sqrt(p0/pk)*100:-1; var html='<div class=\"big\">效率 '+eff.toFixed(2)+' %</div><div class=\"row\">输出功率 '+p2.toFixed(1)+' kW，总损耗 '+loss.toFixed(2)+' kW（铁损 '+p0+' + 铜损 '+(pk*b*b).toFixed(2)+'）</div>'; if(mb>=0){ html+='<div class=\"row\">最大效率点负载率 '+mb.toFixed(1)+'%（铁损=铜损时效率最高）</div>'; } return {ok:true,html:html};",

 {id:"dgconduit", cat:"dgjs", icon:"🧵", name:"穿线管管径估算", desc:"按填充率由导线外径和根数反推所需穿线管规格",
  formula:"导线总截面=n×π(d/2)²；所需管内截面=总截面÷填充率；内径=2√(管内截面/π)",
  inputs:[
   {id:"d", label:"导线外径（含绝缘）", unit:"mm", def:"3.2", min:0},
   {id:"n", label:"导线根数", unit:"根", def:"3", min:1},
   {id:"fill", label:"允许填充率", unit:"%", def:"40", min:1, max:100}
  ],
  run:"var d=Number(d),n=Number(n),fill=Number(fill); if(!(d>0)) return {ok:false,msg:'导线外径须大于0'}; if(!(n>=1)||Math.floor(n)!==n) return {ok:false,msg:'根数须为≥1的整数'}; if(!(fill>0&&fill<=100)) return {ok:false,msg:'填充率应在(0,100]%之间'}; var tot=n*Math.PI*d*d/4; var need=tot/(fill/100); var dia=2*Math.sqrt(need/Math.PI); var specs=[16,20,25,32,40,50,63],inner=[13,16.5,21,27,34,43,55],pick=-1; for(var i=0;i<specs.length;i++){ if(inner[i]>=dia){ pick=specs[i]; break; } } var html='<div class=\"row\">导线总截面积（含绝缘）'+tot.toFixed(1)+' mm²，按填充率 '+fill+'% 所需最小管内径 '+dia.toFixed(1)+' mm</div>'; if(pick>0){ html='<div class=\"big\">推荐 '+pick+' 管</div>'+html+'<div class=\"row\">PVC管公称 '+pick+'（估算内径约 '+inner[specs.indexOf(pick)]+' mm），实际选型以管材标注内径为准</div>'; } else { html='<div class=\"big\">超出常用规格</div>'+html+'<div class=\"row\">所需内径超过 63 管（内径约55mm），请改用更大管径、线槽或分管敷设</div>'; } return {ok:true,html:html};",
  test:{inputs:{d:3.2,n:3,fill:40}, expect:"推荐 16"}},
 {id:"dgpv", cat:"dgjs", icon:"☀️", name:"光伏发电量估算", desc:"按装机容量与等效日照小时估算日月年发电量与收益",
  formula:"日发电=装机×等效日照×系统效率；月=日×30；年=日×365；年收益=年发电×电价",
  inputs:[

  ],
  run:"var kwp=Number(kwp),sun=Number(sun),eff=Number(eff),price=Number(price); if(!(kwp>0)) return {ok:false,msg:'装机容量须大于0'}; if(!(sun>=0&&sun<=24)) return {ok:false,msg:'等效日照小时应在0~24之间'}; if(!(eff>=0&&eff<=100)) return {ok:false,msg:'系统效率应在0~100%之间'}; if(!(price>=0)) return {ok:false,msg:'电价不能为负'}; var day=kwp*sun*eff/100; var mon=day*30,yr=day*365,inc=yr*price; return {ok:true,html:'<div class=\"big\">年发电约 '+yr.toFixed(0)+' kWh</div><div class=\"row\">日均 '+day.toFixed(1)+' kWh，月均 '+mon.toFixed(0)+' kWh；按 '+price+' 元/kWh 年收益约 '+inc.toFixed(0)+' 元</div><div class=\"row\">等效日照与系统效率为估算值，实际受朝向、倾角、遮挡与季节影响</div>'};",

 {id:"djbeltlen", cat:"dj", icon:"🔗", name:"开口皮带长度计算", desc:"由主从动轮直径与中心距算开口带长与小轮包角",
  formula:"L=2C+π/2×(D+d)+(D−d)²÷(4C)；小轮包角=180°−(D−d)÷C×57.2958°",
  inputs:[
   {id:"D", label:"大轮直径", unit:"mm", def:"200", min:1},
   {id:"d", label:"小轮直径", unit:"mm", def:"100", min:1},
   {id:"C", label:"中心距", unit:"mm", def:"500", min:1}
  ],
  run:"var D=Number(D),d=Number(d),C=Number(C); if(!(D>0)||!(d>0)) return {ok:false,msg:'带轮直径须大于0'}; if(D<d) return {ok:false,msg:'大轮直径不能小于小轮直径'}; if(!(C>0)) return {ok:false,msg:'中心距须大于0'}; var L=2*C+Math.PI/2*(D+d)+(D-d)*(D-d)/(4*C); var ang=180-(D-d)/C*57.2958; var html='<div class=\"big\">皮带长度 L = '+L.toFixed(1)+' mm</div><div class=\"row\">小轮包角 '+ang.toFixed(1)+'°'; if(ang<120){ html+='，包角偏小（建议≥120°），易打滑，可加大中心距或加张紧轮'; } html+='</div><div class=\"row\">开口传动近似公式，订购时按带型节线长度为准</div>'; return {ok:true,html:html};",
  test:{inputs:{D:200,d:100,C:500}, expect:"1476.2"}},
 {id:"djgeargeo", cat:"dj", icon:"⚙️", name:"齿轮几何尺寸", desc:"标准直齿轮分度圆、齿顶圆、齿根圆与齿轮副中心距",
  formula:"d=mz；da=m(z+2)；df=m(z−2.5)；h=2.25m；p=πm；a=m(z1+z2)/2；i=z2/z1",
  inputs:[
   {id:"mode", label:"计算模式", type:"select", def:"single", options:[{v:"single",t:"单齿轮"},{v:"pair",t:"齿轮副"}]},
   {id:"m", label:"模数", unit:"mm", def:"2", min:0},
   {id:"z1", label:"齿数 z1", unit:"齿", def:"20", min:6},

  ],
  run:"var m=Number(m),z1=Number(z1),z2=Number(z2); function F(x){ return String(parseFloat(x.toFixed(2))); } if(!(m>0)) return {ok:false,msg:'模数须大于0'}; if(!(z1>=6)||Math.floor(z1)!==z1) return {ok:false,msg:'齿数须为≥6的整数（过小会根切）'}; var html='<div class=\"big\">齿顶圆 da = '+F(m*(z1+2))+' mm</div><div class=\"row\">分度圆 d='+F(m*z1)+' mm，齿根圆 df='+F(m*(z1-2.5))+' mm，齿高 h='+F(2.25*m)+' mm，齿距 p='+F(Math.PI*m)+' mm</div>'; if(String(mode)==='pair'){ if(!(z2>=6)||Math.floor(z2)!==z2) return {ok:false,msg:'z2须为≥6的整数'}; html+='<div class=\"row\">齿轮副：中心距 a='+F(m*(z1+z2)/2)+' mm，传动比 i='+F(z2/z1)+'，从动轮齿顶圆 da2='+F(m*(z2+2))+' mm</div>'; } html+='<div class=\"row\">标准直齿圆柱齿轮（压力角20°、正常齿制）</div>'; return {ok:true,html:html};",

 {id:"djscrew", cat:"dj", icon:"🔩", name:"丝杠扭矩与推力", desc:"由轴向推力与导程算丝杠驱动扭矩和功率",
  formula:"T=F×导程÷(2π×效率)；P=T×2πn÷60",
  inputs:[
   {id:"F", label:"轴向推力", unit:"N", def:"1000", min:0},
   {id:"lead", label:"导程", unit:"mm", def:"5", min:0},
   {id:"eta", label:"传动效率", unit:"%", def:"90", min:0, max:100},
   {id:"n", label:"转速", unit:"r/min", def:"600", min:0}
  ],
  run:"var F=Number(F),lead=Number(lead),eta=Number(eta),n=Number(n); if(!(F>0)) return {ok:false,msg:'轴向推力须大于0'}; if(!(lead>0)) return {ok:false,msg:'导程须大于0'}; if(!(eta>0&&eta<=100)) return {ok:false,msg:'效率应在(0,100]%之间'}; if(!(n>=0)) return {ok:false,msg:'转速不能为负'}; var T=F*lead/1000/(2*Math.PI*eta/100); var P=T*2*Math.PI*n/60/1000; return {ok:true,html:'<div class=\"big\">驱动扭矩 T = '+T.toFixed(2)+' N·m</div><div class=\"row\">按 '+n+' r/min 所需功率约 '+P.toFixed(3)+' kW（未含加速与摩擦余量，选电机请留裕量）</div><div class=\"row\">滚珠丝杠效率常取85~95%，滑动丝杠约30~50%</div>'};",

 {id:"dzcapdrop", cat:"dz", icon:"💡", name:"阻容降压电流估算", desc:"按降压电容算阻容降压电源的近似输出电流",
  formula:"Xc=1÷(2πfC)；I≈U÷Xc（负载电压远小于电网电压时近似）",

  ],
  run:"var c=Number(c),f=Number(f),u=Number(u); if(!(c>0)) return {ok:false,msg:'电容须大于0'}; if(!(f>0)) return {ok:false,msg:'频率须大于0'}; if(!(u>0)) return {ok:false,msg:'电压须大于0'}; var xc=1/(2*Math.PI*f*c*1e-6); var i=u/xc; return {ok:true,html:'<div class=\"big\">输出电流约 '+(i*1000).toFixed(1)+' mA</div><div class=\"row\">容抗 Xc = '+xc.toFixed(0)+' Ω，I ≈ '+u+' ÷ '+xc.toFixed(0)+'（负载电压远低于电网电压的近似，实际略小）</div><div class=\"row\">⚠️ 阻容降压与市电不隔离，整机带电，调试使用务必注意安全</div>'};",

 {id:"dzantenna", cat:"dz", icon:"📡", name:"天线长度计算", desc:"按频率算四分之一波长等常用振子长度（含速度因子）",

  inputs:[
   {id:"f", label:"工作频率", unit:"MHz", def:"100", min:0},
   {id:"vf", label:"速度因子", unit:"", def:"0.95", min:0, max:1}
  ],
  run:"var f=Number(f),vf=Number(vf); if(!(f>0)) return {ok:false,msg:'频率须大于0'}; if(!(vf>0&&vf<=1)) return {ok:false,msg:'速度因子应在(0,1]之间'}; function F(x){ return String(parseFloat(x.toFixed(3))); } var lam=300/f; var q=lam/4,h=lam/2,e=lam*5/8; return {ok:true,html:'<div class=\"big\">1/4λ 实际长 '+F(q*vf)+' m</div><div class=\"row\">波长 λ='+F(lam)+' m；1/4λ 自由空间 '+F(q)+' m、1/2λ '+F(h)+' m（实际 '+F(h*vf)+' m）、5/8λ '+F(e)+' m（实际 '+F(e*vf)+' m）</div><div class=\"row\">速度因子按导体与结构取 0.93~0.98，制作时留长再修剪至谐振</div>'};",

 {id:"yqsmd", cat:"yqj", icon:"🔍", name:"贴片电阻代码读数", desc:"解析三位/四位数字、R记号与EIA-96贴片电阻代码",
  formula:"三位 AB×10^C；四位 ABC×10^D；R为小数点；EIA-96 查E96数列×字母乘数",
  inputs:[

  ],
  run:"var s=String(code).trim().toUpperCase(); if(!s) return {ok:false,msg:'请输入贴片电阻代码'}; var E96=[100,102,105,107,110,113,115,118,121,124,127,130,133,137,140,143,147,150,154,158,162,165,169,174,178,182,187,191,196,200,205,210,215,221,226,232,237,243,249,255,261,267,274,280,287,294,301,309,316,324,332,340,348,357,365,374,383,392,402,412,422,432,442,453,464,475,487,499,511,523,536,549,562,576,590,604,619,634,649,665,681,698,715,732,750,768,787,806,825,845,866,887,909,931,953,976]; var MULT={Z:0.001,Y:0.01,X:0.1,A:1,B:10,C:100,D:1000,E:10000,F:100000}; var v=null,kind=''; var mR=s.match(/^(\\d*)R(\\d*)$/); if(mR&&(mR[1]!==''||mR[2]!=='')){ v=parseFloat((mR[1]||'0')+'.'+(mR[2]||'0')); kind='R记号（R为小数点）'; } else if(/^\\d{3}$/.test(s)){ v=parseInt(s.slice(0,2),10)*Math.pow(10,parseInt(s.charAt(2),10)); kind='三位代码'; } else if(/^\\d{4}$/.test(s)){ v=parseInt(s.slice(0,3),10)*Math.pow(10,parseInt(s.charAt(3),10)); kind='四位代码'; } else if(/^\\d{1,2}$/.test(s)){ v=parseInt(s,10); kind='直标阻值'; } else { var mE=s.match(/^(\\d{2})([ZYXABCDEF])$/); if(mE){ var idx=parseInt(mE[1],10); if(idx>=1&&idx<=96){ v=E96[idx-1]/100*MULT[mE[2]]; kind='EIA-96代码'; } } } if(v===null||!isFinite(v)) return {ok:false,msg:'无法识别该代码，支持三位/四位数字、R记号与EIA-96'}; function F(x){ return String(parseFloat(x.toFixed(3))); } var disp=v>=1e6?F(v/1e6)+' MΩ':(v>=1000?F(v/1000)+' kΩ':F(v)+' Ω'); return {ok:true,html:'<div class=\"big\">'+disp+'</div><div class=\"row\">代码 '+s+'（'+kind+'），阻值 '+F(v)+' Ω</div>'};",
  test:{inputs:{code:"103"}, expect:"10 kΩ"}},
 {id:"shevcost", cat:"sh", icon:"🚗", name:"电动车充电成本", desc:"按百公里电耗与电价算每公里、充满与全年充电花费",
  formula:"每公里成本=百公里电耗÷100×电价；年花费=年里程÷100×百公里电耗×电价",
  inputs:[
   {id:"cons", label:"百公里电耗", unit:"kWh/100km", def:"15", min:0},
   {id:"price", label:"电价", unit:"元/kWh", def:"0.6", min:0},

  ],
  run:"var cons=Number(cons),price=Number(price),batt=Number(batt),km=Number(km); if(!(cons>0)) return {ok:false,msg:'百公里电耗须大于0'}; if(!(price>=0)) return {ok:false,msg:'电价不能为负'}; if(!(batt>=0)) return {ok:false,msg:'电池容量不能为负'}; if(!(km>=0)) return {ok:false,msg:'年里程不能为负'}; var per=cons/100*price; var full=batt*price; var yk=km/100*cons; var yc=yk*price; return {ok:true,html:'<div class=\"big\">年充电花费约 '+yc.toFixed(0)+' 元</div><div class=\"row\">每公里成本 '+per.toFixed(3)+' 元，充满一次 '+full.toFixed(1)+' 元，年充电量 '+yk.toFixed(0)+' kWh（按电表电量计，未含充电损耗）</div>'};",

 {id:"dgneutral", cat:"dgjs", icon:"⚡", name:"三相四线零线电流", desc:"三相负载不对称时零线（中性线）电流估算",
  formula:"三相电流相量相差120°合成：I_N=√(I_a²+I_b²+I_c²−I_a·I_b−I_b·I_c−I_c·I_a)；三相完全对称时为 0",
  inputs:[
   {id:"ia", label:"A 相电流", unit:"A", def:"100"},
   {id:"ib", label:"B 相电流", unit:"A", def:"100"},
   {id:"ic", label:"C 相电流", unit:"A", def:"100"}
  ],
  run:"var a=Number(ia),b=Number(ib),c=Number(ic);if(!(a>=0&&b>=0&&c>=0))return {ok:false,msg:'电流不能为负'};var s=a*a+b*b+c*c-a*b-b*c-c*a;var n=Math.sqrt(Math.max(0,s));return {ok:true,html:'<div class=\"big\">零线电流 ≈ '+n.toFixed(2)+' A</div><div class=\"row\">三相完全对称时零线电流为 0；不对称越严重零线电流越大，零线不得小于相线截面要求（谐波严重时还需加大）</div>'};",
  test:{inputs:{"ia": 100, "ib": 100, "ic": 100}, expect:"0.00"}},
 {id:"dgtransloss", cat:"dgjs", icon:"🏭", name:"变压器损耗与效率", desc:"按铁损、额定铜损和负载率算总损耗与运行效率",
  formula:"总损耗 ΔP = P₀ + β²·P_k（P₀铁损，P_k额定铜损，β负载率）；效率 η = β·S·cosφ ÷ (β·S·cosφ + ΔP)",
  inputs:[
   {id:"s", label:"变压器容量", unit:"kVA", def:"1000"},
   {id:"cos", label:"功率因数", def:"0.9", min:0, max:1},
   {id:"beta", label:"负载率", unit:"%", def:"100", min:0, max:150},
   {id:"p0", label:"铁损（空载损耗）", unit:"kW", def:"2"},

  ],
  run:"var b=Number(beta)/100,loss=Number(p0)+b*b*Number(pk),out=Number(s)*b*Number(cos);if(!(Number(s)>0))return {ok:false,msg:'容量须大于 0'};var eta=out>0?out/(out+loss)*100:0;return {ok:true,html:'<div class=\"big\">总损耗 '+loss.toFixed(2)+' kW · 效率 '+eta.toFixed(2)+'%</div><div class=\"row\">输出功率 '+out.toFixed(1)+' kW（负载率 '+beta+'%）；铜损随负载率平方变化，轻载时铁损占比高、效率低</div>'};",
  test:{inputs:{"s": 1000, "cos": 0.9, "beta": 100, "p0": 2, "pk": 10}, expect:"98.68"}},
 {id:"yqntc", cat:"yqj", icon:"🌡️", name:"NTC热敏电阻测温", desc:"按 Beta 方程由当前阻值反推温度",
  formula:"Beta 方程：1/T = 1/T₀ + ln(R/R₀)/B，T₀=298.15K（25℃），R₀ 为 25℃ 标称阻值",
  inputs:[
   {id:"r", label:"当前阻值", unit:"Ω", def:"5000"},

  ],

 {id:"djfanlaw", cat:"dj", icon:"🌀", name:"风机水泵变频节能", desc:"按相似定律估算降速运行的功率与节电收益",

 {id:"djworm", cat:"dj", icon:"🐌", name:"蜗轮蜗杆传动", desc:"蜗杆头数与蜗轮齿数算传动比和输出转速",

 {id:"jrkelly", cat:"jr", icon:"🎲", name:"凯利公式仓位", desc:"按胜率与盈亏比算最优下注/仓位比例",

 {id:"jrdraw", cat:"jr", icon:"📉", name:"最大回撤与回本涨幅", desc:"由高点与低点算回撤幅度及回本需要的涨幅",

 {id:"jrrebal", cat:"jr", icon:"⚖️", name:"资产配置再平衡", desc:"按目标比例算每类资产要买入或卖出多少",

 {id:"shvolweight", cat:"sh", icon:"📦", name:"快递体积重（计泡）", desc:"按抛比算体积重并与实重比较取计费重",

 {id:"sxbinom", cat:"sx", icon:"🎯", name:"二项分布概率", desc:"算 P(X=k) 与累积概率 P(X≤k)",
  formula:"P(X=k)=C(n,k)·p^k·(1−p)^(n−k)；累积概率为 k 项之和",
  inputs:[
   {id:"n", label:"试验次数 n", def:"10", min:1, max:1000},
   {id:"k", label:"成功次数 k", def:"5", min:0},
   {id:"p", label:"单次成功概率 p", def:"0.5", min:0, max:1}
  ],
  run:"var N=Math.trunc(Number(n)),K=Math.trunc(Number(k)),P=Number(p);if(!(N>=1&&N<=1000))return {ok:false,msg:'n 须在 1~1000'};if(!(K>=0&&K<=N))return {ok:false,msg:'k 须在 0~n 之间'};if(!(P>=0&&P<=1))return {ok:false,msg:'p 须在 0~1'};function pmf(i){if(P===0)return i===0?1:0;if(P===1)return i===N?1:0;var v=Math.pow(1-P,N);for(var j=0;j<i;j++)v=v*(N-j)/(j+1)*P/(1-P);return v;}var pk=pmf(K),cum=0;for(var i2=0;i2<=K;i2++)cum+=pmf(i2);return {ok:true,html:'<div class=\"big\">P(X='+K+') = '+pk.toFixed(4)+'</div><div class=\"row\">P(X≤'+K+') = '+cum.toFixed(4)+'；期望 np = '+(N*P).toFixed(2)+'，方差 np(1−p) = '+(N*P*(1-P)).toFixed(2)+'</div>'};",
  test:{inputs:{"n": 10, "k": 5, "p": 0.5}, expect:"0.2461"}},
 {id:"sxnorm", cat:"sx", icon:"📊", name:"正态分布概率", desc:"由 x、均值、标准差算 z 值与累积概率 Φ",
  formula:"z=(x−μ)/σ；Φ(z) 为标准正态累积概率（误差函数近似，精度约 1e-7）",
  inputs:[
   {id:"x", label:"数值 x", def:"100"},
   {id:"mu", label:"均值 μ", def:"90"},
   {id:"sigma", label:"标准差 σ", def:"10", min:0}
  ],
  run:"var sg=Number(sigma);if(!(sg>0))return {ok:false,msg:'标准差须大于 0'};var z=(Number(x)-Number(mu))/sg;function Phi(zz){var t=1/(1+0.2316419*Math.abs(zz));var d=0.3989422804014327*Math.exp(-zz*zz/2);var pr=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));return zz>0?1-pr:pr;}var F=Phi(z);return {ok:true,html:'<div class=\"big\">z = '+z.toFixed(3)+' · Φ(z) = '+F.toFixed(4)+'</div><div class=\"row\">P(X≤x)='+F.toFixed(4)+'；落在 μ±|x−μ| 内的概率 = '+(2*Phi(Math.abs(z))-1).toFixed(4)+'</div>'};",
  test:{inputs:{"x": 90, "mu": 90, "sigma": 10}, expect:"0.5000"}},
 {id:"wlcarnot", cat:"wl", icon:"♨️", name:"卡诺热机效率", desc:"两热源温度下的理论最高效率",

 {id:"wlspl", cat:"wl", icon:"🔊", name:"声强级计算", desc:"声强换算为分贝（声强级）",

 {id:"wlorbit", cat:"wl", icon:"🛰️", name:"环绕轨道速度与周期", desc:"按轨道高度算环绕速度和周期",

 {id:"wlefield", cat:"wl", icon:"⚡", name:"点电荷电场强度", desc:"点电荷在空间某点产生的电场强度",
  formula:"E = k·Q/r²，k=8.988×10⁹ N·m²/C²",

 {id:"wlcap2", cat:"wl", icon:"🔋", name:"平行板电容计算", desc:"极板面积、间距与介质算电容量",
  formula:"C = ε₀·εᵣ·A/d，ε₀=8.854×10⁻¹² F/m",

   {id:"d", label:"极板间距", unit:"mm", def:"1", min:0},

 {id:"dzsallen", cat:"dz", icon:"🎛️", name:"Sallen-Key低通滤波", desc:"等值电阻 Sallen-Key 低通的截止频率与 Q 值",
  formula:"单位增益、R₁=R₂=R 时：f₀=1/(2πR√(C₁C₂))，Q=√(C₁C₂)/(2C₂)；C₁=2C₂ 时 Q≈0.707 为巴特沃斯",
  inputs:[
   {id:"r", label:"电阻 R（两电阻相等）", unit:"kΩ", def:"10"},

  ],
  run:"var R=Number(r)*1000,C1=Number(c1)*1e-9,C2=Number(c2)*1e-9;if(!(R>0&&C1>0&&C2>0))return {ok:false,msg:'参数须大于 0'};var f0=1/(2*Math.PI*R*Math.sqrt(C1*C2)),Q=Math.sqrt(C1*C2)/(2*C2);return {ok:true,html:'<div class=\"big\">f₀ = '+f0.toFixed(1)+' Hz · Q = '+Q.toFixed(3)+'</div><div class=\"row\">Q≈0.707 为巴特沃斯（最平坦）；Q 偏大通带边缘会隆起</div>'};",
  test:{inputs:{"r": 10, "c1": 20, "c2": 10}, expect:"0.707"}},
 {id:"kfdms", cat:"kf", icon:"🧭", name:"经纬度度分秒互转", desc:"十进制度与度分秒之间互转",

  inputs:[

 {id:"ydjump", cat:"yd", icon:"🏃", name:"垂直纵跳摸高估算", desc:"由起跳高度算起跳速度与滞空时间",

 {id:"ydcooper", cat:"yd", icon:"🫁", name:"Cooper 12分钟跑", desc:"12 分钟跑距离估算最大摄氧量 VO₂max",
  formula:"Cooper 公式：VO₂max =（12 分钟跑距离 − 504.9）÷ 44.73（ml/kg/min）",
  inputs:[
   {id:"d", label:"12 分钟跑距离", unit:"m", def:"3000", min:0}

 {id:"kfisbn", cat:"kf", icon:"📚", name:"ISBN-13 校验位", desc:"由前 12 位算 ISBN-13 校验位，或校验完整 13 位",
  formula:"ISBN-13：前 12 位奇数位×1、偶数位×3 求和，校验位 =（10 − 总和 mod 10）mod 10",

   {id:"isbn", label:"ISBN（12 或 13 位数字）", type:"text", def:"978030640615"}

 {id:"hxosm", cat:"hx", icon:"💧", name:"渗透压计算", desc:"按 van 't Hoff 公式算稀溶液渗透压",
  formula:"π = i·c·R·T，R=0.082057 L·atm/(mol·K)，i 为 van 't Hoff 因子（非电解质=1，NaCl≈2）",
  inputs:[
   {id:"c", label:"溶质浓度", unit:"mol/L", def:"0.1"},

 {id:"jrmortcmp", cat:"jr", icon:"⚖", name:"房贷方式对比", desc:"等额本息vs等额本金总利息",

  inputs:[{id:"t", label:"回声时间", unit:"s", def:"2", min:0}],
  run:"var s=340*t/2;return {ok:true,html:'<div class=\"big\">距离='+s.toFixed(1)+'m</div>'};",
  test:{inputs:{t:2}, expect:"340"}},
 {id:"wlwave", cat:"wl", icon:"🌊", name:"波速波长频率互转", desc:"v=λf，已知两项求第三项",
  formula:"λ=v/f",
  inputs:[{id:"v", label:"波速", unit:"m/s", def:"340", min:0},{id:"f", label:"频率", unit:"Hz", def:"440", min:0}],
  run:"if(f===0)return {ok:false,msg:'频率不能为0'};var l=v/f;return {ok:true,html:'<div class=\"big\">λ='+l.toFixed(3)+'m</div>'};",
  test:{inputs:{v:340,f:440}, expect:"0.773"}},
 {id:"wllight", cat:"wl", icon:"💡", name:"光传播时间计算", desc:"已知距离求光传播所需时间",
  formula:"t=s/c；c=300000km/s",
  inputs:[{id:"s", label:"距离", unit:"km", def:"300000", min:0}],
  run:"var t=s/300000;return {ok:true,html:'<div class=\"big\">t='+t.toFixed(3)+'s</div><div class=\"row\">光速c≈300000km/s</div>'};",
  test:{inputs:{s:300000}, expect:"1.000"}},
 {id:"wlheat", cat:"wl", icon:"🌡", name:"比热容吸放热计算", desc:"已知比热容质量温差求热量",
  formula:"Q=cmΔT",
  inputs:[{id:"c", label:"比热容", unit:"J/(kg·℃)", def:"4200", min:0},{id:"m", label:"质量", unit:"kg", def:"2", min:0},{id:"dt", label:"温度变化", unit:"℃", def:"10"}],
  run:"var q=c*m*dt;return {ok:true,html:'<div class=\"big\">Q='+q.toFixed(0)+'J（'+(q/1000).toFixed(1)+'kJ）</div>'};",
  test:{inputs:{c:4200,m:2,dt:10}, expect:"84000"}},
 {id:"wlheateff", cat:"wl", icon:"🔥", name:"热机效率计算", desc:"已知做功与吸热求热机效率",
  formula:"η=W/Q吸×100%",
  inputs:[{id:"w", label:"对外做功", unit:"J", def:"300", min:0},{id:"q", label:"吸收热量", unit:"J", def:"1000", min:0}],
  run:"if(q===0)return {ok:false,msg:'吸热不能为0'};var e=w/q*100;return {ok:true,html:'<div class=\"big\">η='+e.toFixed(1)+'%</div>'};",
  test:{inputs:{w:300,q:1000}, expect:"30.0"}},
 {id:"wlcoulomb", cat:"wl", icon:"⚡", name:"库仑定律计算", desc:"已知两点电荷电量与距离求静电力",
  formula:"F=kq₁q₂/r²；k=8.988×10⁹N·m²/C²",
  inputs:[{id:"q1", label:"电量q₁", unit:"C", def:"0.000001", min:0},{id:"q2", label:"电量q₂", unit:"C", def:"0.000001", min:0},{id:"r", label:"距离", unit:"m", def:"0.1", min:0}],
  run:"if(r===0)return {ok:false,msg:'距离不能为0'};var f=8.988e9*q1*q2/(r*r);return {ok:true,html:'<div class=\"big\">F='+f.toFixed(2)+'N</div>'};",
  test:{inputs:{q1:0.000001,q2:0.000001,r:0.1}, expect:"0.90"}},
 {id:"wlgrav", cat:"wl", icon:"🪐", name:"万有引力计算", desc:"已知两物体质量与距离求引力",
  formula:"F=Gm₁m₂/r²；G=6.674×10⁻¹¹N·m²/kg²",
  inputs:[{id:"m1", label:"质量m₁", unit:"kg", def:"1000", min:0},{id:"m2", label:"质量m₂", unit:"kg", def:"1000", min:0},{id:"r", label:"距离", unit:"m", def:"1", min:0}],
  run:"if(r===0)return {ok:false,msg:'距离不能为0'};var f=6.674e-11*m1*m2/(r*r);return {ok:true,html:'<div class=\"big\">F='+f.toExponential(3)+'N</div>'};",
  test:{inputs:{m1:1000,m2:1000,r:1}, expect:"6.674e-5"}},
 {id:"wlesc", cat:"wl", icon:"🚀", name:"第一宇宙速度计算", desc:"已知天体半径求环绕速度",
  formula:"v=√(gR)；地球R=6371km，g=9.8m/s²",
  inputs:[{id:"r", label:"天体半径", unit:"km", def:"6371", min:0},{id:"g", label:"表面重力加速度", unit:"m/s²", def:"9.8", min:0}],
  run:"if(!(r>=0&&g>=0)) return {ok:false,msg:'半径与重力加速度不能为负'}; var v=Math.sqrt(g*r*1000)/1000;return {ok:true,html:'<div class=\"big\">v='+v.toFixed(2)+'km/s</div>'};",
  test:{inputs:{r:6371,g:9.8}, expect:"7.90"}},
 {id:"wlmoment", cat:"wl", icon:"🔩", name:"力矩计算", desc:"已知力与力臂求力矩",
  formula:"M=F·L",
  inputs:[{id:"f", label:"力", unit:"N", def:"50"},{id:"L", label:"力臂", unit:"m", def:"0.8", min:0}],
  run:"var m=f*L;return {ok:true,html:'<div class=\"big\">M='+m.toFixed(2)+'N·m</div>'};",
  test:{inputs:{f:50,L:0.8}, expect:"40.00"}},
 {id:"wlcirc", cat:"wl", icon:"🎡", name:"圆周运动计算", desc:"已知半径频率求周期与线速度",
  formula:"T=1/f；v=2πrf",
  inputs:[{id:"r", label:"半径", unit:"m", def:"2", min:0},{id:"f", label:"频率", unit:"Hz", def:"0.5", min:0}],
  run:"if(f===0)return {ok:false,msg:'频率不能为0'};var t=1/f,v=2*Math.PI*r*f;return {ok:true,html:'<div class=\"big\">T='+t.toFixed(2)+'s，v='+v.toFixed(2)+'m/s</div>'};",
  test:{inputs:{r:2,f:0.5}, expect:"6.28"}},
 {id:"wlspringt", cat:"wl", icon:"〰", name:"弹簧振子周期计算", desc:"已知质量和劲度系数求振动周期",
  formula:"T=2π√(m/k)",
  inputs:[{id:"m", label:"质量", unit:"kg", def:"1", min:0},{id:"k", label:"劲度系数", unit:"N/m", def:"100", min:0}],
  run:"if(!(k>0)) return {ok:false,msg:'劲度系数必须大于 0'}; if(!(m>=0)) return {ok:false,msg:'质量不能为负'}; var t=2*Math.PI*Math.sqrt(m/k);return {ok:true,html:'<div class=\"big\">T='+t.toFixed(2)+'s</div>'};",
  test:{inputs:{m:1,k:100}, expect:"0.63"}},
 {id:"wlbrake", cat:"wl", icon:"🛑", name:"刹车距离计算", desc:"已知初速度和减速度求刹车距离与时间",
  formula:"s=v₀²/(2a)；t=v₀/a",
  inputs:[{id:"v0", label:"初速度", unit:"m/s", def:"20", min:0},{id:"a", label:"减速度", unit:"m/s²", def:"5", min:0}],
  run:"if(a===0)return {ok:false,msg:'减速度不能为0'};var s=v0*v0/(2*a),t=v0/a;return {ok:true,html:'<div class=\"big\">刹车距离='+s.toFixed(2)+'m，时间='+t.toFixed(2)+'s</div>'};",
  test:{inputs:{v0:20,a:5}, expect:"40.00"}}
);

  run:"function row(k,v){return '<div class=\"row\">'+k+'：'+v+'</div>';}\nfunction F(x){return String(parseFloat(x.toFixed(4)));}\nif(mode==='sp'){\n  var vs=[Number(v1),Number(v2),Number(v3)].filter(function(x){return x>0;});\n  if(vs.length<2)return {ok:false,msg:'至少接入两个元件（数值须大于 0，第三个不用可填 0）'};\n  var sum=vs.reduce(function(a,b){return a+b;},0),inv=vs.reduce(function(a,b){return a+1/b;},0);\n  var isC=kind==='C',r;\n  if(conn==='ser')r=isC?1/inv:sum;else r=isC?sum:1/inv;\n  var un=kind==='R'?'Ω':kind==='C'?'μF':'mH',kn=kind==='R'?'电阻':kind==='C'?'电容':'电感';\n  var fm=kind==='C'?(conn==='ser'?'串联：1/C总 = 1/C₁ + 1/C₂ + …':'并联：C总 = C₁ + C₂ + …'):(conn==='ser'?kn+'串联：总值 = 各值之和':kn+'并联：1/总值 = 1/各值之和');\n  return {ok:true,html:'<div class=\"big\">'+F(r)+' '+un+'</div>'+row('公式',fm)+row('接入',vs.length+' 个'+kn)};\n}\nif(mode==='xc'){\n  var f=Number(fq),c=Number(cv);\n  if(!(f>0))return {ok:false,msg:'频率须大于 0'};\n  if(!(c>0))return {ok:false,msg:'电容须大于 0'};\n  var xc=1/(2*Math.PI*f*c*1e-6);\n  return {ok:true,html:'<div class=\"big\">Xc = '+xc.toFixed(2)+' Ω</div>'+row('公式','Xc = 1/(2πfC)，频率越高容抗越小')};\n}\nif(mode==='xl'){\n  var f2=Number(fq2),l=Number(lv2);\n  if(!(f2>0))return {ok:false,msg:'频率须大于 0'};\n  if(!(l>0))return {ok:false,msg:'电感须大于 0'};\n  var xl=2*Math.PI*f2*l*1e-3;\n  return {ok:true,html:'<div class=\"big\">XL = '+xl.toFixed(2)+' Ω</div>'+row('公式','XL = 2πfL，频率越高感抗越大')};\n}\nif(mode==='lc'){\n  var L=Number(lv3)/1000,C=Number(cv3)/1e9;\n  if(!(L>0&&C>0))return {ok:false,msg:'电感与电容必须大于 0'};\n  var f0=1/(2*Math.PI*Math.sqrt(L*C));\n  var fs=f0>=1000?(f0/1000).toFixed(3)+' kHz':f0.toFixed(1)+' Hz';\n  return {ok:true,html:'<div class=\"big\">f₀ = '+f0.toFixed(1)+' Hz（'+fs+'）</div>'+row('公式','f₀ = 1/(2π√LC)')};\n}\nif(mode==='rc'){\n  var R=Number(rv),C2=Number(cv4);\n  if(!(R>0))return {ok:false,msg:'电阻须大于 0'};\n  if(!(C2>0))return {ok:false,msg:'电容须大于 0'};\n  var tau=R*C2/1e6,fc=1/(2*Math.PI*R*C2*1e-6);\n  return {ok:true,html:'<div class=\"big\">τ = '+tau.toFixed(3)+' s（'+(tau*1000).toFixed(1)+' ms）</div>'+row('截止频率','fc = '+fc.toFixed(2)+' Hz（RC 低通/高通同值）')+row('充放电','约 '+(5*tau).toFixed(3)+' s（5τ）后完成 99%')};\n}\nreturn {ok:false,msg:'请选择功能'};",

/* ===== BATCH-A 电机工具 ===== */
/* 纯计算函数（无 DOM 依赖，可单独测试） */
var SQRT3_A = Math.sqrt(3);
function _motorBase(p){
  var U = num(p.U), cos = num(p.cos), eta = num(p.eta);
  if(!(U > 0)) return {ok:false, msg:"电压必须大于 0"};
  if(!(cos > 0 && cos <= 1)) return {ok:false, msg:"功率因数应在 (0,1] 之间"};
  if(!(eta > 0 && eta <= 1)) return {ok:false, msg:"效率应在 (0,1] 之间"};
  return {ok:true, U:U, cos:cos, eta:eta};
}
/* 1. 三相异步电机轴功率 P2=√3·U·I·cosφ·η（W）；或已知 P2(kW) 反求电流 */
function calcMotorP2(p){
  var b = _motorBase(p); if(!b.ok) return b;
  var I = num(p.I);
  if(!(I >= 0)) return {ok:false, msg:"电流无效"};
  return {ok:true, P2:SQRT3_A * b.U * I * b.cos * b.eta};
}
function calcMotorI(p){
  var b = _motorBase(p); if(!b.ok) return b;
  var P2 = num(p.P2);
  if(!(P2 >= 0)) return {ok:false, msg:"轴功率无效"};
  return {ok:true, I:P2 * 1000 / (SQRT3_A * b.U * b.cos * b.eta)};
}
/* 2. 电机电压 U=P2/(√3·I·cosφ·η)，P2 单位 kW */
function calcMotorU(p){
  var P2 = num(p.P2), I = num(p.I), cos = num(p.cos), eta = num(p.eta);
  if(!(P2 >= 0)) return {ok:false, msg:"轴功率无效"};
  if(!(I > 0)) return {ok:false, msg:"电流必须大于 0"};
  if(!(cos > 0 && cos <= 1)) return {ok:false, msg:"功率因数应在 (0,1] 之间"};
  if(!(eta > 0 && eta <= 1)) return {ok:false, msg:"效率应在 (0,1] 之间"};
  return {ok:true, U:P2 * 1000 / (SQRT3_A * I * cos * eta)};
}
/* 4. 电机效率 η=P2/P1×100% */
function calcMotorEff(p){
  var P2 = num(p.P2), P1 = num(p.P1);
  if(!(P2 >= 0)) return {ok:false, msg:"轴功率无效"};
  if(!(P1 > 0)) return {ok:false, msg:"输入电功率必须大于 0"};
  return {ok:true, eta:P2 / P1 * 100};
}
/* 5. 电机功率因数 cosφ=P2/(√3·U·I·η)，P2 单位 kW */
function calcMotorPF(p){
  var P2 = num(p.P2), U = num(p.U), I = num(p.I), eta = num(p.eta);
  if(!(P2 >= 0)) return {ok:false, msg:"轴功率无效"};
  if(!(U > 0)) return {ok:false, msg:"电压必须大于 0"};
  if(!(I > 0)) return {ok:false, msg:"电流必须大于 0"};
  if(!(eta > 0 && eta <= 1)) return {ok:false, msg:"效率应在 (0,1] 之间"};
  var cos = P2 * 1000 / (SQRT3_A * U * I * eta);
  if(!(cos > 0 && cos <= 1)) return {ok:false, msg:"计算结果超出 (0,1] 范围，请检查输入"};
  return {ok:true, cos:cos};
}
/* 6. 发电机：视在功率 S(kVA)=P(kW)/cosφ；三相 P=√3·U·I·cosφ；备用≈1.1×主用 */
function calcGen(p){
  var cos = num(p.cos);
  if(!(cos > 0 && cos <= 1)) return {ok:false, msg:"功率因数应在 (0,1] 之间"};
  if(p.mode === "P"){
    var U = num(p.U), I = num(p.I);
    if(!(U > 0)) return {ok:false, msg:"电压必须大于 0"};
    if(!(I >= 0)) return {ok:false, msg:"电流无效"};
    return {ok:true, mode:"P", P:SQRT3_A * U * I * cos / 1000};
  }
  var P = num(p.P);
  if(!(P >= 0)) return {ok:false, msg:"负载功率无效"};
  var S = P / cos;
  return {ok:true, mode:"S", S:S, backup:1.1 * S};
}
/* 7. 变压器：U2=U1·N2/N1；变比 k=U1/U2；三相容量 S=√3·U·I */
function calcTrans(p){
  if(p.mode === "S"){
    var U = num(p.U), I = num(p.I);
    if(!(U > 0)) return {ok:false, msg:"电压必须大于 0"};
    if(!(I >= 0)) return {ok:false, msg:"电流无效"};
    return {ok:true, mode:"S", S:SQRT3_A * U * I / 1000};
  }
  var U1 = num(p.U1), N1 = num(p.N1), N2 = num(p.N2);
  if(!(U1 > 0)) return {ok:false, msg:"一次电压必须大于 0"};
  if(!(N1 > 0 && N2 > 0)) return {ok:false, msg:"一二次匝数都必须大于 0"};
  var U2 = U1 * N2 / N1;
  return {ok:true, mode:"U", U2:U2, k:U1 / U2};
}

/* 纯计算函数（无 DOM 依赖，可单独测试） */

/* 1. AWG 与 mm² 对照表（截面单位 mm²） */
var AWG_TABLE=[
 {a:"4/0",s:107.2},{a:"3/0",s:85.0},{a:"2/0",s:67.4},{a:"1/0",s:53.5},
 {a:"1",s:42.4},{a:"2",s:33.6},{a:"4",s:21.2},{a:"6",s:13.3},
 {a:"8",s:8.37},{a:"10",s:5.26},{a:"12",s:3.31},{a:"14",s:2.08},
 {a:"16",s:1.31},{a:"18",s:0.823},{a:"20",s:0.519}
];
function calcAwg(p){
  if(p.mode==="toMM"){
    const r=AWG_TABLE.find(function(x){return x.a===p.awg;});
    if(!r) return {ok:false, msg:"请选择 AWG 规格"};
    return {ok:true, mode:"toMM", awg:r.a, s:r.s};
  }
  const s=num(p.s);
  if(!(s>0)) return {ok:false, msg:"请输入大于 0 的截面"};
  let best=AWG_TABLE[0], bd=Math.abs(AWG_TABLE[0].s-s);
  AWG_TABLE.forEach(function(x){
    const d=Math.abs(x.s-s);
    if(d<bd){ bd=d; best=x; }
  });
  return {ok:true, mode:"toAWG", s:s, awg:best.a, nearS:best.s};
}

/* 2. 功率算线径：先算电流，再按铜芯载流量参考表向上取线径（参考值） */
var PWR_CABLE_TABLE=[
 {s:1.5,a:15},{s:2.5,a:25},{s:4,a:32},{s:6,a:40},
 {s:10,a:60},{s:16,a:80},{s:25,a:110},{s:35,a:135}
];
function calcPwrCable(p){
  const PkW=num(p.P), U=num(p.U), cos=num(p.cos);
  const three = p.phase==="3";
  const k = three ? Math.sqrt(3) : 1;
  if(!(PkW>0)) return {ok:false, msg:"功率必须大于 0"};
  if(!(U>0)) return {ok:false, msg:"电压必须大于 0"};
  if(!(cos>0 && cos<=1)) return {ok:false, msg:"功率因数应在 (0,1] 之间"};
  const I=PkW*1000/(k*U*cos);
  const rec=PWR_CABLE_TABLE.find(function(x){return x.a>=I;});
  return {ok:true, I:I, rec:rec||null};
}

/* 3. 线径截面积：S=π(d/2)²；反求 d=2√(S/π) */
function calcWireArea(p){
  if(p.mode==="toD"){
    const S=num(p.S);
    if(!(S>0)) return {ok:false, msg:"截面必须大于 0"};
    return {ok:true, mode:"toD", S:S, d:2*Math.sqrt(S/Math.PI)};
  }
  const d=num(p.d);
  if(!(d>0)) return {ok:false, msg:"直径必须大于 0"};
  return {ok:true, mode:"toS", d:d, S:Math.PI*Math.pow(d/2,2)};
}

/* 4. 充电桩布线线径：预设规格 + 距离超过 30 米升一档（参考值） */
var EV_SIZES=[2.5,4,6,10,16,25];
var EV_PRESETS=[
 {label:"7kW（单相）", I:32, base:6},
 {label:"11kW（三相）", I:16, base:4},
 {label:"21kW（三相）", I:32, base:6}
];
function calcEvCable(p){
  const pr=EV_PRESETS[parseInt(p.preset,10)];
  if(!pr) return {ok:false, msg:"请选择充电桩规格"};
  const L=num(p.L);
  if(!(L>0)) return {ok:false, msg:"布线距离必须大于 0"};
  let size=pr.base, bumped=false;
  if(L>30){
    const i=EV_SIZES.indexOf(pr.base);
    if(i>=0 && i<EV_SIZES.length-1){ size=EV_SIZES[i+1]; bumped=true; }
  }
  return {ok:true, preset:pr.label, I:pr.I, L:L, size:size, bumped:bumped};
}

/* 5. 铜排尺寸：按工作电流向上匹配 TMY 铜排规格（载流量为参考值） */
var BUSBAR_TABLE=[
 {w:30,t:4,a:280},{w:40,t:4,a:380},{w:50,t:5,a:550},
 {w:60,t:6,a:750},{w:80,t:8,a:1050}
];
function calcBusbar(p){
  const I=num(p.I);
  if(!(I>0)) return {ok:false, msg:"工作电流必须大于 0"};
  const rec=BUSBAR_TABLE.find(function(x){return x.a>=I;});
  return {ok:true, I:I, rec:rec||null};
}

/* 6. 铜排质量价格：重量kg=长(m)×宽(mm)×厚(mm)×8.9/1000；价格=重量×单价 */
function calcBusbarCost(p){
  const L=num(p.L), W=num(p.W), T=num(p.T), price=num(p.price);
  if(!(L>0 && W>0 && T>0)) return {ok:false, msg:"长度、宽度、厚度都必须大于 0"};
  if(!(price>=0)) return {ok:false, msg:"铜价单价无效"};
  const kg=L*W*T*8.9/1000;
  return {ok:true, kg:kg, cost:kg*price};
}

/* 7. 交直流：直流 P=U×I；交流单相 P=U×I×cosφ；功率电流互求 */
function calcAcDc(p){
  const U=num(p.U);
  if(!(U>0)) return {ok:false, msg:"电压必须大于 0"};
  const ac = p.type==="ac";
  let cos=1;
  if(ac){
    cos=num(p.cos);
    if(!(cos>0 && cos<=1)) return {ok:false, msg:"功率因数应在 (0,1] 之间"};
  }
  if(p.mode==="I"){
    const P=num(p.P);
    if(!(P>=0)) return {ok:false, msg:"功率无效"};
    return {ok:true, mode:"I", ac:ac, U:U, P:P, I:P/(U*cos)};
  }
  const I=num(p.I);
  if(!(I>=0)) return {ok:false, msg:"电流无效"};
  return {ok:true, mode:"P", ac:ac, U:U, I:I, P:U*I*cos};
}

/* 纯计算函数（无 DOM 依赖，可单独测试） */

/* 1. 断路器电流：单相 Iz=P/(U·cosφ)；三相 Iz=P/(√3·U·cosφ)；推荐 In≥1.25×Iz */
function calcBrkCur(p){
  const P=num(p.P), U=num(p.U), cos=num(p.cos);
  const three = p.phase==="3";
  const k = three ? Math.sqrt(3) : 1;
  if(!(P>0)) return {ok:false, msg:"负载功率必须大于 0"};
  if(!(U>0)) return {ok:false, msg:"电压必须大于 0"};
  if(!(cos>0 && cos<=1)) return {ok:false, msg:"功率因数应在 (0,1] 之间"};
  const Iz = P/(k*U*cos);
  const brk = breakerSize(Iz);
  return {ok:true, Iz:Iz, need:brk.need, rec:brk.rec, three:three};
}

/* 2. 电功率单位互转 */
function calcEpConv(p){
  const mode = p.mode;
  if(mode==="kva2va"){
    const kva=num(p.kva);
    if(!(kva>=0)) return {ok:false, msg:"千伏安数值无效"};
    return {ok:true, mode:mode, va:kva*1000};
  }
  if(mode==="a2v"){
    const I=num(p.I), P=num(p.P);
    if(!(I>0)) return {ok:false, msg:"电流必须大于 0"};
    if(!(P>=0)) return {ok:false, msg:"功率无效"};
    return {ok:true, mode:mode, V:P/I};
  }
  const U=num(p.U), cos=num(p.cos);
  const three = p.phase==="3";
  const k = three ? Math.sqrt(3) : 1;
  if(!(U>0)) return {ok:false, msg:"电压必须大于 0"};
  if(mode==="w2a"){
    const P=num(p.P);
    if(!(P>=0)) return {ok:false, msg:"功率无效"};
    if(!(cos>0 && cos<=1)) return {ok:false, msg:"功率因数应在 (0,1] 之间"};
    return {ok:true, mode:mode, I:P/(k*U*cos)};
  }
  if(mode==="a2w"){
    const I=num(p.I);
    if(!(I>=0)) return {ok:false, msg:"电流无效"};
    if(!(cos>0 && cos<=1)) return {ok:false, msg:"功率因数应在 (0,1] 之间"};
    return {ok:true, mode:mode, P:k*U*I*cos};
  }
  if(mode==="a2va"||mode==="a2kva"){
    const I=num(p.I);
    if(!(I>=0)) return {ok:false, msg:"电流无效"};
    return {ok:true, mode:mode, S:k*U*I};
  }
  return {ok:false, msg:"未知换算模式"};
}

/* 3. 视频监控存储：容量(GB)=码率(Mbps)×3600×24×天数×路数÷8÷1024 */
function calcNvrStore(p){
  const br=num(p.br), chn=num(p.ch), days=num(p.days);
  if(!(br>0)) return {ok:false, msg:"单路码率必须大于 0"};
  if(!(chn>0 && Number.isInteger(chn))) return {ok:false, msg:"路数必须为正整数"};
  if(!(days>0)) return {ok:false, msg:"存储天数必须大于 0"};
  const gb = br*3600*24*days*chn/8/1024;
  return {ok:true, gb:gb, tb:gb/1024};
}

/* 数据驱动工具自动注册渲染器（必须在所有 TOOLS.push 之后、初始化之前执行） */
TOOLS.forEach(function(t){ if(t.run&&!RENDER[t.id]){ RENDER[t.id]=function(tool){ renderDataTool(tool); }; } });

/* ---- 首页：分类 + 卡片 ---- */
let activeCat="all", query="";
function buildSidebar(){
  const sb=$("#sidebar");
  sb.querySelectorAll(".cat").forEach(function(e){e.remove();});
  const counts={}; TOOLS.forEach(function(t){counts[t.cat]=(counts[t.cat]||0)+1;});
  function add(id,name,n){
    const b=document.createElement("button");
    b.className="cat"+(activeCat===id?" active":"");
    b.innerHTML='<span>'+name+'</span><span class="n">'+n+'</span>';
    b.onclick=function(){activeCat=id;buildSidebar();buildGrid();};
    sb.appendChild(b);
  }
  add("all","全部",TOOLS.length);
  CATS.forEach(function(c){add(c.id,c.name,counts[c.id]||0);});
}
function buildGrid(){
  const g=$("#grid"); g.innerHTML="";
  const q=query.toLowerCase();
  const arr=[];
  TOOLS.forEach(function(t){
    if(activeCat!=="all"&&t.cat!==activeCat) return;
    let s=0;
    if(q){
      const ni=t.name.toLowerCase().indexOf(q), di=t.desc.toLowerCase().indexOf(q);
      if(ni===0) s=3; else if(ni>0) s=2; else if(di>=0) s=1; else return;
    }
    arr.push({t:t,s:s});
  });
  arr.sort(function(a,b){return b.s-a.s;});
  if(q&&arr.length>0){
    const cc={};
    arr.forEach(function(x){cc[x.t.cat]=(cc[x.t.cat]||0)+1;});
    let top=null,topn=0;
    for(const k in cc){if(cc[k]>topn){topn=cc[k];top=k;}}
    if(top){
      const total=TOOLS.filter(function(t){return t.cat===top;}).length;
      const tip=document.createElement("div");
      tip.className="catchip";
      tip.innerHTML='相关类目：<b>'+catName(top)+'</b>（命中'+topn+'个） <button onclick="gotoCat(\''+top+'\')">浏览该类目全部'+total+'个工具</button>';
      g.appendChild(tip);
    }
  }
  let n=0;
  arr.forEach(function(x){
    const t=x.t;
    const d=document.createElement("div");
    d.className="tool-card";
    d.innerHTML='<div class="ic">'+t.icon+'</div><h3>'+t.name+'</h3><p>'+t.desc+'</p><span class="cat-tag">'+catName(t.cat)+'</span>';
    d.onclick=function(){openTool(t.id);};
    g.appendChild(d); n++;
  });
  $("#empty").hidden=n>0;
}
let lastScrollY=0;
function openTool(id){
  const t=TOOLS.find(function(x){return x.id===id;});
  if(!t) return;
  lastScrollY=window.scrollY||document.documentElement.scrollTop||0;
  $("#home").hidden=true;
  const v=$("#toolview"); v.hidden=false;
  RENDER[t.id](t);
  window.scrollTo(0,0);
}
function gotoCat(id){
  query=""; $("#q").value="";
  activeCat=id;
  buildSidebar(); buildGrid();
  window.scrollTo(0,0);
}
function showHome(){
  $("#toolview").hidden=true;
  $("#home").hidden=false;
  window.scrollTo(0,lastScrollY);
}
function doSearch(){
  query=$("#q").value.trim();
  const q=query.toLowerCase();
  if(q){
    const arr=[];
    TOOLS.forEach(function(t){
      const ni=t.name.toLowerCase().indexOf(q), di=t.desc.toLowerCase().indexOf(q);
      let s=0;
      if(ni===0) s=3; else if(ni>0) s=2; else if(di>=0) s=1; else return;
      arr.push({t:t,s:s});
    });
    arr.sort(function(a,b){return b.s-a.s;});
    if(arr.length>=4){
      const c0=arr[0].t.cat;
      if(c0!==activeCat&&arr[1].t.cat===c0&&arr[2].t.cat===c0){
        activeCat=c0; query=""; $("#q").value="";
        buildSidebar(); buildGrid(); window.scrollTo(0,0);
        return;
      }
    }
  }
  buildGrid();
}
$("#qbtn").onclick=doSearch;
$("#q").addEventListener("input",doSearch);
buildSidebar(); buildGrid();
