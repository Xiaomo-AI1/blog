 ], run:"function F(x){if(x===0)return '0';var ax=Math.abs(x);if(ax>=1e7||ax<1e-4)return x.toPrecision(4);var s=x.toFixed(4);if(s.indexOf('.')>=0){s=s.replace(/0+$/,'').replace(/\\.$/,'');}return s;}var dt=Number(dT),tt=Number(t),ef=Number(eff);if(!(dt>0))return {ok:false,msg:'温升须大于 0'};if(!(tt>0))return {ok:false,msg:'加热时间须大于 0'};if(!(ef>0&&ef<=100))return {ok:false,msg:'效率应在 (0,100%] 之间'};var mass,c;if(String(mode)==='air'){var vv=Number(vol);if(!(vv>0))return {ok:false,msg:'空气体积须大于 0'};mass=vv*1.293;c=1.005;}else{var mm=Number(m);if(!(mm>0))return {ok:false,msg:'水的质量须大于 0'};mass=mm;c=4.186;}var Q=mass*c*dt;var pth=Q/(tt*60);var pin=pth/(ef/100);return {ok:true,html:'<div class=\\\"big\\\">所需加热功率 P ≈ '+F(pin)+' kW</div><div class=\\\"row\\\">热量 Q = '+F(mass)+' kg × '+c+' × '+dt+'℃ = '+F(Q)+' kJ；净热功率 '+F(pth)+' kW，按效率 '+ef+'% 折算输入功率 '+F(pin)+' kW</div><div class=\\\"row\\\">未计散热损失与容器吸热，选加热器时建议再留 10%~20% 裕量</div>'};", test:{inputs:{mode:"water", m:100, vol:50, dT:40, t:60, eff:100}, expect:"4.6511"}},
 {id:"dgspd", cat:"dgjs", icon:"⚡", name:"SPD 选型参考", desc:"按防雷分区与线路类型给出电涌保护器类型与参数参考档", formula:"查表型工具，依据 GB 50057《建筑物防雷设计规范》与 GB/T 18802 常用配置：LPZ0→LPZ1 界面用 T1 型（I 类试验，10/350 μs）SPD，Iimp ≥ 12.5 kA/极；LPZ1→LPZ2 用 T2 型（II 类试验，8/20 μs），In ≥ 20 kA、Imax 40 kA 级；LPZ2 以内设备端用 T3 型（III 类复合波），Uoc 10 kV 级。各极 Up 应低于被保护设备耐压，Uc 按系统电压选取（如 220/380V 系统常用 Uc 275V 级）。信号线路按 D1/C2 类试验等级配置。本表为常用参考，实际工程按防雷类别与风险评估确定", inputs:[

 {id:"dglineik", cat:"dgjs", icon:"💥", name:"线路末端短路电流", desc:"按电源参数与线路阻抗估算末端三相/单相短路电流", formula:"电源侧阻抗：按短路容量 Xs = U² ÷ Sk；按变压器 Zt ≈ uk% × U² ÷ S变压器（近似取为电抗）。线路电阻 R = ρL ÷ S（ρ：铜 0.0175、铝 0.0285 Ω·mm²/m），线路电抗 X ≈ 0.08 Ω/km × L。三相短路 Ik3 = U ÷ (√3 × √((R)² + (Xs + X)²))；单相短路（相-中性回路近似）Ik1 = (U ÷ √3) ÷ √((2R)² + (Xs + 2X)²)。简化估算口径，精确计算按 GB/T 15544 / IEC 60909 并计电阻温度修正", inputs:[

 ], run:"function F(x){if(x===0)return '0';var ax=Math.abs(x);if(ax>=1e7||ax<1e-4)return x.toPrecision(4);var s=x.toFixed(4);if(s.indexOf('.')>=0){s=s.replace(/0+$/,'').replace(/\\.$/,'');}return s;}var Uu=Number(U),Ll=Number(L),Ss=Number(S);if(!(Uu>0))return {ok:false,msg:'电压须大于 0'};if(!(Ll>=0))return {ok:false,msg:'线路长度不能为负'};if(!(Ss>0))return {ok:false,msg:'导线截面须大于 0'};var xs;if(String(src)==='sk'){var sk=Number(Sk);if(!(sk>0))return {ok:false,msg:'短路容量须大于 0'};xs=Uu*Uu/(sk*1e6);}else{var st2=Number(Str),uk2=Number(uk);if(!(st2>0))return {ok:false,msg:'变压器容量须大于 0'};if(!(uk2>0))return {ok:false,msg:'uk% 须大于 0'};xs=uk2/100*Uu*Uu/(st2*1000);}var rho=String(mat)==='al'?0.0285:0.0175;var R=rho*(Ll*1000)/Ss;var X=0.08*Ll;var z3=Math.sqrt(R*R+(xs+X)*(xs+X));var ik3=Uu/(Math.sqrt(3)*z3);var z1=Math.sqrt(4*R*R+(xs+2*X)*(xs+2*X));var ik1=(Uu/Math.sqrt(3))/z1;return {ok:true,html:'<div class=\\\"big\\\">末端三相短路 Ik3 ≈ '+F(ik3/1000)+' kA</div><div class=\\\"row\\\">单相短路 Ik1 ≈ '+F(ik1/1000)+' kA（'+F(ik1)+' A）</div><div class=\\\"row\\\">电源阻抗 '+F(xs)+' Ω，线路 R = '+F(R)+' Ω、X = '+F(X)+' Ω；Ik1 用于校验保护电器灵敏度</div>'};", test:{inputs:{src:"trans", Str:1000, uk:5, Sk:100, U:400, L:0.1, S:95, mat:"cu"}, expect:"9.465"}},
 {id:"dgcompcur", cat:"dgjs", icon:"🔋", name:"补偿电容工作电流", desc:"三相/单相补偿电容器的工作电流与过载校核提示", formula:"三相（三角形/星形总容量口径）：In = Qc ÷ (√3 × U线)；单相：In = Qc ÷ U。电容器回路电流含谐波与过电压放大，GB/T 12747 允许长期过电流 1.3 倍额定电流，开关/熔断器/导线常按 1.5 倍左右额定电流配置（以厂家与设计为准）", inputs:[

 {id:"yqmagnet", cat:"yqj", icon:"🧲", name:"电磁铁吸力", desc:"由安匝数与气隙算磁感应强度和吸力",

 {id:"yqbatres", cat:"yqj", icon:"🔋", name:"电池内阻双负载法", desc:"两组负载端电压/电流测电池内阻与电动势",

 {id:"yqtc", cat:"yqj", icon:"🌡️", name:"热电偶测温换算", desc:"热电偶温度与热电势双向换算（线性近似）",

 {id:"yqntcb", cat:"yqj", icon:"♨️", name:"NTC双点标定B值", desc:"两组实测阻值/温度标定 B 值并预测阻值",
  formula:"Beta 方程：B = ln(R1÷R2) ÷ (1÷T1 − 1÷T2)（T 为开尔文温度）；预测 R(T) = R1×exp[B×(1÷T − 1÷T1)]。与已有「NTC 热敏电阻测温」（已知 B 反推温度）互补：本工具由两组实测点反求 B。B 随温区变化，标定点应覆盖使用温区",

 {id:"yqdac", cat:"yqj", icon:"🎚️", name:"DAC输出电压", desc:"数模转换器代码到输出电压（可反码）",
  formula:"口径 Vout = Vref × D ÷ 2^N（N 为位数，D 为有效代码；满量程输出为 Vref×(2^N−1)÷2^N，差一个 LSB）；1 LSB = Vref ÷ 2^N；反码分支：有效代码 D = (2^N−1) − 输入代码（逐位取反，常用于反相输出级或互补编码）",

 {id:"yqpwm", cat:"yqj", icon:"〰️", name:"PWM平均电压与RMS", desc:"PWM 波形的平均值与有效值（单极/双极）",

 {id:"yqldr", cat:"yqj", icon:"🔆", name:"光敏电阻分压估算", desc:"光敏电阻阻值估算与分压输出电压",

 {id:"yqpiezo", cat:"yqj", icon:"🔔", name:"压电电荷计算", desc:"压电材料受力产生的电荷量 Q = d33·F",

 {id:"yqnoise", cat:"yqj", icon:"📡", name:"电阻热噪声", desc:"约翰逊热噪声电压（带宽口径）",
  formula:"热噪声有效值 Vn = √(4kTRB)：k = 1.380649×10⁻²³ J/K（SI 精确定义值），T 为开尔文温度（默认 290 K），R 为电阻 Ω，B 为带宽 Hz；频谱密度 en = √(4kTR)（V/√Hz，与带宽无关）。锚点：1 kΩ、290 K、1 MHz 带宽时 Vn ≈ 4.00 µV",
  inputs:[
   {id:"r", label:"电阻 R", unit:"Ω", def:"1000"},

 {id:"yqvaractor", cat:"yqj", icon:"🔘", name:"变容二极管结电容", desc:"反向电压调谐的结电容计算",

  inputs:[

 {id:"yqpot", cat:"yqj", icon:"🕹️", name:"电位器输出百分比", desc:"旋转电位器角度到输出比例（三种 taper）",

  inputs:[

   {id:"taper", label:"阻值规律 taper", def:"lin", type:"select", options:[{v:"lin",t:"线性 B 型"},{v:"log",t:"对数（音频）A 型·近似"},{v:"anti",t:"反对数 C 型·近似"}]},

 {id:"yqcaplife", cat:"yqj", icon:"⏳", name:"电解电容寿命估算", desc:"温度每降 10℃ 寿命翻倍的阿伦尼乌斯估算",

 {id:"djencoder", cat:"dj", icon:"🎯", name:"编码器分辨率换算", desc:"由线数与倍频算每转计数与角度分辨率，可选按导程算线位移脉冲数",

 {id:"djstir", cat:"dj", icon:"🥄", name:"搅拌器功率", desc:"功率准数法算搅拌功率并提示雷诺数流区",

 {id:"dzbuckrip", cat:"dz", icon:"🌀", name:"Buck 电感设计（纹波反算）", desc:"由允许纹波电流反算 Buck 电感量，或给定电感算纹波与峰值电流",

 {id:"dzgateres", cat:"dz", icon:"🚪", name:"栅极驱动电阻计算", desc:"由栅极电荷与目标开关时间反算驱动回路总电阻",

 {id:"dzopnoise", cat:"dz", icon:"📢", name:"运放电路噪声估算", desc:"运放电压噪声与电阻约翰逊噪声方和根合成，估算输出总噪声",

 {id:"jrmr", cat:"jr", icon:"🛡️", name:"维持担保比例", desc:"融资融券总资产÷总负债，对照警戒线与平仓线判定",

  inputs:[
   {id:"assets", label:"账户总资产", unit:"元", def:"300000"},
   {id:"liab", label:"账户总负债", unit:"元", def:"150000"}
 ],
  run:"function F(x){if(x===0)return '0';var ax=Math.abs(x);if(ax>=1e7||ax<1e-4)return x.toPrecision(4);var s=x.toFixed(4);if(s.indexOf('.')>=0){s=s.replace(/0+$/,'').replace(/\\.$/,'');}return s;}function M(x){return x.toFixed(2);}function PC(x){return x.toFixed(2)+'%';}var A=Number(assets),L=Number(liab);if(!(A>=0))return {ok:false,msg:'总资产不能为负'};if(!(L>0))return {ok:false,msg:'总负债须大于 0（无负债时无需计算维持担保比例）'};var r=A/L*100;var zone=r>=150?'✅ 正常（≥150%）':r>=130?'⚠️ 警戒区（130%~150%）：券商可能通知追加担保物':'🚨 平仓风险区（<130%）：未及时追加可能被强制平仓';return {ok:true,html:'<div class=\"big\">维持担保比例 = '+PC(r)+'</div><div class=\"row\">'+M(A)+' ÷ '+M(L)+' = '+PC(r)+'；'+zone+'</div><div class=\"row\">150%/130% 为常用合同线，各券商可不同，以签约合同与对账单为准</div>'};",
  test:{inputs:{assets:300000, liab:150000}, expect:"200.00%"}},
 {id:"jrddm2", cat:"jr", icon:"🌱", name:"两阶段股利贴现", desc:"高增长期逐年折现 + 稳定期戈登模型终值算股票内在价值",
  formula:"P = Σ D₀(1+g₁)ᵗ÷(1+r)ᵗ（t=1..n）+ [Dₙ(1+g₂)÷(r−g₂)] ÷ (1+r)ⁿ；须 r > g₂。D₀ 为最近已付股利，g₁ 高增长期增长率，g₂ 稳定增长率，r 股权要求回报率（均 % 输入）",
  inputs:[
   {id:"d0", label:"最近股利 D₀", unit:"元/股", def:"1"},
   {id:"g1", label:"高增长期增长率 g₁", unit:"%", def:"10"},
   {id:"n", label:"高增长期年数 n", unit:"年", def:"3"},
   {id:"g2", label:"稳定增长率 g₂", unit:"%", def:"3"},
   {id:"r", label:"要求回报率 r", unit:"%", def:"10"}
 ],
  run:"function F(x){if(x===0)return '0';var ax=Math.abs(x);if(ax>=1e7||ax<1e-4)return x.toPrecision(4);var s=x.toFixed(4);if(s.indexOf('.')>=0){s=s.replace(/0+$/,'').replace(/\\.$/,'');}return s;}function M(x){return x.toFixed(2);}function PC(x){return x.toFixed(2)+'%';}var D=Number(d0),a=Number(g1)/100,nn=Number(n),b=Number(g2)/100,rr=Number(r)/100;if(!(D>=0))return {ok:false,msg:'股利不能为负'};if(!(nn>=1)||Math.floor(nn)!==nn)return {ok:false,msg:'高增长期年数须为正整数'};if(nn>50)return {ok:false,msg:'高增长期年数上限 50 年（过长会造成逐年折现计算超时）'};if(!(rr>b))return {ok:false,msg:'要求回报率 r 须大于稳定增长率 g₂（否则戈登终值发散）'};if(!(rr>-1))return {ok:false,msg:'要求回报率须大于 -100%'};var pv=0,Dn=D;for(var t=1;t<=nn;t++){Dn=D*Math.pow(1+a,t);pv+=Dn/Math.pow(1+rr,t);}var Pn=Dn*(1+b)/(rr-b);var pvT=Pn/Math.pow(1+rr,nn);var P=pv+pvT;return {ok:true,html:'<div class=\"big\">内在价值 P = '+M(P)+' 元/股</div><div class=\"row\">高增长期股利现值 '+M(pv)+' 元 + 终值现值 '+M(pvT)+' 元（第 '+nn+' 年末终值 '+M(Pn)+' 元，第 '+nn+' 年股利 '+M(Dn)+' 元）</div><div class=\"row\">对 g₁、g₂、r 极敏感，建议多组参数交叉验证</div>'};",
  test:{inputs:{d0:1, g1:10, n:3, g2:3, r:10}, expect:"17.71"}},
 {id:"jrdcf", cat:"jr", icon:"🏢", name:"DCF 企业估值", desc:"自由现金流逐年折现 + 永续增长终值算企业价值与每股价值",
  formula:"企业价值 EV = Σ FCFₜ÷(1+WACC)ᵗ + 终值÷(1+WACC)ⁿ，终值 = FCFₙ×(1+g)÷(WACC−g)（戈登永续增长口径，须 WACC > g）；股权价值 = EV − 净债务（有息负债 − 现金，可填负数表示净现金）；每股价值 = 股权价值 ÷ 总股数。FCF 逗号分隔（单位自选，全程保持一致）",
  inputs:[
   {id:"fcf", label:"未来各年自由现金流 FCF", def:"100,110,121", hint:"逗号分隔，单位与净债务/股数口径一致"},
   {id:"wacc", label:"加权平均资本成本 WACC", unit:"%", def:"10"},
   {id:"g", label:"永续增长率 g", unit:"%", def:"0"},
   {id:"netdebt", label:"净债务", def:"181.82", hint:"有息负债−现金，净现金填负数"},
   {id:"shares", label:"总股数", def:"100", hint:"与 FCF 单位配套，如 FCF 用万元则股数用万股"}
 ],
  run:"function F(x){if(x===0)return '0';var ax=Math.abs(x);if(ax>=1e7||ax<1e-4)return x.toPrecision(4);var s=x.toFixed(4);if(s.indexOf('.')>=0){s=s.replace(/0+$/,'').replace(/\\.$/,'');}return s;}function M(x){return x.toFixed(2);}function PC(x){return x.toFixed(2)+'%';}function parseSeq(s){var a=String(s).split(/[,，、\\s]+/).filter(function(x){return x!=='';}).map(Number);for(var i=0;i<a.length;i++){if(!isFinite(a[i]))return null;}return a;}function mean(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length;}var a=parseSeq(fcf);if(!a||a.length<1)return {ok:false,msg:'请输入至少 1 年自由现金流（逗号分隔）'};var w=Number(wacc)/100,g=Number(g)/100,nd=Number(netdebt),sh=Number(shares);if(!(w>g))return {ok:false,msg:'WACC 须大于永续增长率 g（否则终值发散）'};if(!(w>-1))return {ok:false,msg:'WACC 须大于 -100%'};if(!isFinite(nd))return {ok:false,msg:'净债务输入无效'};var pv=0;for(var t=1;t<=a.length;t++)pv+=a[t-1]/Math.pow(1+w,t);var tv=a[a.length-1]*(1+g)/(w-g);var pvTv=tv/Math.pow(1+w,a.length);var ev=pv+pvTv;var eq=ev-nd;var h='<div class=\"big\">企业价值 EV = '+M(ev)+'</div><div class=\"row\">FCF 现值合计 '+M(pv)+' + 终值现值 '+M(pvTv)+'（终值 '+M(tv)+'，共 '+a.length+' 年预测期）</div><div class=\"row\">股权价值 = EV − 净债务 '+M(nd)+' = '+M(eq)+'</div>';if(sh>0){h+='<div class=\"row\">每股价值 = '+M(eq/sh)+'（总股数 '+F(sh)+')</div>';}else{h+='<div class=\"row\">股数未填正数，未算每股价值</div>';}return {ok:true,html:h};",
  test:{inputs:{fcf:"100,110,121", wacc:10, g:0, netdebt:181.82, shares:100}, expect:"1181.82"}},
 {id:"jrroic", cat:"jr", icon:"🏭", name:"投入资本回报率 ROIC", desc:"NOPAT÷投入资本，衡量经营资本的真实回报",
  formula:"NOPAT = EBIT × (1 − 所得税率)；投入资本 = 净资产（所有者权益）+ 有息负债 − 现金及等价物；ROIC = NOPAT ÷ 投入资本 × 100%。金额单位自选、全程一致；投入资本 ≤0 时拒绝",
  inputs:[
   {id:"ebit", label:"息税前利润 EBIT", unit:"万元", def:"100"},
   {id:"tax", label:"所得税率", unit:"%", def:"25"},
   {id:"equity", label:"净资产（所有者权益）", unit:"万元", def:"400"},
   {id:"debt", label:"有息负债", unit:"万元", def:"200"},
   {id:"cash", label:"现金及等价物", unit:"万元", def:"100"}
 ],
  run:"function F(x){if(x===0)return '0';var ax=Math.abs(x);if(ax>=1e7||ax<1e-4)return x.toPrecision(4);var s=x.toFixed(4);if(s.indexOf('.')>=0){s=s.replace(/0+$/,'').replace(/\\.$/,'');}return s;}function M(x){return x.toFixed(2);}function PC(x){return x.toFixed(2)+'%';}var e=Number(ebit),t=Number(tax),eq=Number(equity),d=Number(debt),c=Number(cash);if(!isFinite(e))return {ok:false,msg:'EBIT 输入无效'};if(!(t>=0&&t<100))return {ok:false,msg:'所得税率应在 0~100% 之间'};if(!(eq>=0)||!(d>=0)||!(c>=0))return {ok:false,msg:'净资产/有息负债/现金不能为负'};var ic=eq+d-c;if(!(ic>0))return {ok:false,msg:'投入资本（净资产+有息负债−现金）须大于 0'};var nop=e*(1-t/100);var ro=nop/ic*100;return {ok:true,html:'<div class=\"big\">ROIC = '+PC(ro)+'</div><div class=\"row\">NOPAT = '+M(e)+' × (1 − '+PC(t)+') = '+M(nop)+'；投入资本 = '+M(eq)+' + '+M(d)+' − '+M(c)+' = '+M(ic)+'</div><div class=\"row\">ROIC 高于 WACC 才说明经营在创造价值（可与 EVA 工具对照）</div>'};",
  test:{inputs:{ebit:100, tax:25, equity:400, debt:200, cash:100}, expect:"15.00%"}},
 {id:"jrccc", cat:"jr", icon:"🔄", name:"现金转换周期 CCC", desc:"由存货/应收/应付周转天数算现金转换周期",
  formula:"DIO = 存货 ÷ 营业成本 × 365；DSO = 应收账款 ÷ 营业收入 × 365；DPO = 应付账款 ÷ 营业成本 × 365；CCC = DIO + DSO − DPO（天）。金额为期末余额简化口径（严谨口径应用平均余额），单位须一致",
  inputs:[
   {id:"inv", label:"存货", unit:"万元", def:"100"},

   {id:"ap", label:"应付账款", unit:"万元", def:"50"},
   {id:"rev", label:"营业收入", unit:"万元", def:"365"},
   {id:"cogs", label:"营业成本", unit:"万元", def:"365"}
 ],
  run:"function F(x){if(x===0)return '0';var ax=Math.abs(x);if(ax>=1e7||ax<1e-4)return x.toPrecision(4);var s=x.toFixed(4);if(s.indexOf('.')>=0){s=s.replace(/0+$/,'').replace(/\\.$/,'');}return s;}function M(x){return x.toFixed(2);}function PC(x){return x.toFixed(2)+'%';}var iv=Number(inv),a=Number(ar),p=Number(ap),rv=Number(rev),cg=Number(cogs);if(!(iv>=0)||!(a>=0)||!(p>=0))return {ok:false,msg:'存货/应收/应付不能为负'};if(!(rv>0))return {ok:false,msg:'营业收入须大于 0'};if(!(cg>0))return {ok:false,msg:'营业成本须大于 0'};var dio=iv/cg*365,dso=a/rv*365,dpo=p/cg*365,ccc=dio+dso-dpo;return {ok:true,html:'<div class=\"big\">现金转换周期 CCC = '+F(ccc)+' 天</div><div class=\"row\">存货周转 DIO '+F(dio)+' 天 + 应收周转 DSO '+F(dso)+' 天 − 应付周转 DPO '+F(dpo)+' 天</div><div class=\"row\">CCC 越短（甚至为负）资金占用越少；期末余额简化口径，严谨分析请用平均余额</div>'};",
  test:{inputs:{inv:100, ar:100, ap:50, rev:365, cogs:365}, expect:"150"}},
 {id:"jrzscore", cat:"jr", icon:"🚦", name:"Altman Z-score", desc:"上市公司原模型五因子算破产风险 Z 值并分区判定",
  formula:"Z = 1.2·X₁ + 1.4·X₂ + 3.3·X₃ + 0.6·X₄ + 1.0·X₅（Altman 1968 上市公司原模型系数）；X₁=营运资本/总资产，X₂=留存收益/总资产，X₃=EBIT/总资产，X₄=股权市值/总负债，X₅=营收/总资产，均填小数（0.1=10%）。分区：Z>2.99 安全区，1.81~2.99 灰色区，Z<1.81 危险区",
  inputs:[
   {id:"x1", label:"X₁ 营运资本/总资产", def:"0.1"},
   {id:"x2", label:"X₂ 留存收益/总资产", def:"0.1"},
   {id:"x3", label:"X₃ EBIT/总资产", def:"0.1"},
   {id:"x4", label:"X₄ 股权市值/总负债", def:"0.1"},
   {id:"x5", label:"X₅ 营收/总资产", def:"0.1"}
 ],
  run:"function F(x){if(x===0)return '0';var ax=Math.abs(x);if(ax>=1e7||ax<1e-4)return x.toPrecision(4);var s=x.toFixed(4);if(s.indexOf('.')>=0){s=s.replace(/0+$/,'').replace(/\\.$/,'');}return s;}function M(x){return x.toFixed(2);}function PC(x){return x.toFixed(2)+'%';}var a=[Number(x1),Number(x2),Number(x3),Number(x4),Number(x5)];for(var i=0;i<5;i++){if(!isFinite(a[i]))return {ok:false,msg:'五因子须为数值（小数，如 0.1）'};}var z=1.2*a[0]+1.4*a[1]+3.3*a[2]+0.6*a[3]+1.0*a[4];var zone=z>2.99?'✅ 安全区（Z > 2.99）':z>=1.81?'⚠️ 灰色区（1.81 ~ 2.99）：需进一步核查':'🚨 危险区（Z < 1.81）：财务困境风险高';return {ok:true,html:'<div class=\"big\">Z = '+F(z)+'</div><div class=\"row\">'+zone+'</div><div class=\"row\">1968 上市公司原模型，非上市/新兴市场有修正模型（Z′/Z″），系数与分区不同，勿混用</div>'};",
  test:{inputs:{x1:0.1, x2:0.1, x3:0.1, x4:0.1, x5:0.1}, expect:"0.75"}},
 {id:"jreva", cat:"jr", icon:"💎", name:"经济增加值 EVA", desc:"NOPAT 减资本成本算经济增加值",
  formula:"EVA = NOPAT − 投入资本 × WACC，其中 NOPAT = EBIT × (1 − 所得税率)。EVA > 0 表示扣除全部资本成本（含股权成本）后仍创造价值。金额单位自选、全程一致",
  inputs:[
   {id:"ebit", label:"息税前利润 EBIT", unit:"万元", def:"100"},
   {id:"tax", label:"所得税率", unit:"%", def:"25"},
   {id:"cap", label:"投入资本", unit:"万元", def:"500"},
   {id:"wacc", label:"加权平均资本成本 WACC", unit:"%", def:"10"}
 ],
  run:"function F(x){if(x===0)return '0';var ax=Math.abs(x);if(ax>=1e7||ax<1e-4)return x.toPrecision(4);var s=x.toFixed(4);if(s.indexOf('.')>=0){s=s.replace(/0+$/,'').replace(/\\.$/,'');}return s;}function M(x){return x.toFixed(2);}function PC(x){return x.toFixed(2)+'%';}var e=Number(ebit),t=Number(tax),c=Number(cap),w=Number(wacc);if(!isFinite(e))return {ok:false,msg:'EBIT 输入无效'};if(!(t>=0&&t<100))return {ok:false,msg:'所得税率应在 0~100% 之间'};if(!(c>0))return {ok:false,msg:'投入资本须大于 0'};if(!(w>=0))return {ok:false,msg:'WACC 不能为负'};var nop=e*(1-t/100);var cc=c*w/100;var eva=nop-cc;return {ok:true,html:'<div class=\"big\">EVA = '+M(eva)+' 万元</div><div class=\"row\">NOPAT = '+M(nop)+'，资本成本 = '+M(c)+' × '+PC(w)+' = '+M(cc)+'；EVA = '+M(nop)+' − '+M(cc)+'</div><div class=\"row\">'+(eva>0?'EVA 为正：创造经济价值':eva<0?'EVA 为负：经营回报未覆盖资本成本':'EVA 为 0：恰好覆盖资本成本')+'（金额单位与输入一致）</div>'};",
  test:{inputs:{ebit:100, tax:25, cap:500, wacc:10}, expect:"25.00"}},
 {id:"jrinterestonly", cat:"jr", icon:"📅", name:"先息后本还款计划", desc:"每月只还利息、末期一次还本，算月息与总利息",
  formula:"每月利息 = 本金 × 年利率 ÷ 12（按月等额利息简化口径，不按实际天数）；总利息 = 月息 × 期数；末期还款 = 本金 + 当月利息。利率为 0 时利息为 0、末期只还本金",

   {id:"principal", label:"贷款本金", unit:"元", def:"100000"},
   {id:"rate", label:"年利率", unit:"%", def:"6"},

 ],
  run:"function F(x){if(x===0)return '0';var ax=Math.abs(x);if(ax>=1e7||ax<1e-4)return x.toPrecision(4);var s=x.toFixed(4);if(s.indexOf('.')>=0){s=s.replace(/0+$/,'').replace(/\\.$/,'');}return s;}function M(x){return x.toFixed(2);}function PC(x){return x.toFixed(2)+'%';}var P=Number(principal),r=Number(rate),n=Number(months);if(!(P>0))return {ok:false,msg:'本金须大于 0'};if(!(r>=0))return {ok:false,msg:'年利率不能为负'};if(!(n>=1)||Math.floor(n)!==n)return {ok:false,msg:'期限须为正整数月'};var mi=P*r/100/12;var tot=mi*n;var last=P+mi;return {ok:true,html:'<div class=\"big\">每月利息 '+M(mi)+' 元，总利息 '+M(tot)+' 元</div><div class=\"row\">前 '+(n-1)+' 期每期只还利息 '+M(mi)+' 元；第 '+n+' 期（末期）还 '+M(last)+' 元（本金 '+M(P)+' + 利息 '+M(mi)+'）</div><div class=\"row\">总还款 '+M(P+tot)+' 元；月息按年利率÷12 简化，未按实际天数计息</div>'};",
  test:{inputs:{principal:100000, rate:6, months:12}, expect:"6000.00"}},
 {id:"jrpension", cat:"jr", icon:"👴", name:"养老金领取估算", desc:"个人账户养老金 + 基础养老金简化式估算月领金额",

/* 数据驱动工具自动注册渲染器（必须在所有 TOOLS.push 之后、初始化之前执行） */
TOOLS.forEach(function(t){ if(t.run&&!RENDER[t.id]){ RENDER[t.id]=function(tool){ renderDataTool(tool); }; } });

/* ---- 首页：分类 + 卡片 ---- */
let activeCat="all", query="", gridToken=0;
function buildSidebar(){
  const sb=$("#sidebar");
  sb.querySelectorAll(".cat").forEach(function(e){e.remove();});
  const counts={}; TOOLS.forEach(function(t){counts[t.cat]=(counts[t.cat]||0)+1;});
  function add(id,name,n){
    const b=document.createElement("button");
    b.className="cat"+(activeCat===id?" active":"");
    b.innerHTML='<span>'+name+'</span><span class="n">'+n+'</span>';
    b.onclick=function(){activeCat=id;buildSidebar();buildGrid();};
    sb.appendChild(b);
  }
  add("all","全部",TOOLS.length);
  CATS.forEach(function(c){add(c.id,c.name,counts[c.id]||0);});
}
function buildGrid(){
  const g=$("#grid"); g.innerHTML="";
  const q=query.toLowerCase();
  const arr=[];
  TOOLS.forEach(function(t){
    if(activeCat!=="all"&&t.cat!==activeCat) return;
    let s=0;
    if(q){
      const ni=t.name.toLowerCase().indexOf(q), di=t.desc.toLowerCase().indexOf(q);
      if(ni===0) s=3; else if(ni>0) s=2; else if(di>=0) s=1; else return;
    }
    arr.push({t:t,s:s});
  });
  arr.sort(function(a,b){return b.s-a.s;});
  if(q&&arr.length>0){
    const cc={};
    arr.forEach(function(x){cc[x.t.cat]=(cc[x.t.cat]||0)+1;});
    let top=null,topn=0;
    for(const k in cc){if(cc[k]>topn){topn=cc[k];top=k;}}
    if(top){
      const total=TOOLS.filter(function(t){return t.cat===top;}).length;
      const tip=document.createElement("div");
      tip.className="catchip";
      tip.innerHTML='相关类目：<b>'+catName(top)+'</b>（命中'+topn+'个） <button onclick="gotoCat(\''+top+'\')">浏览该类目全部'+total+'个工具</button>';
      g.appendChild(tip);
    }
  }
  /* 分批渲染：首屏先出第一批，其余分片在后续宏任务补齐，避免 800+ 卡片一次性进 DOM 卡住首屏 */
  $("#empty").hidden=arr.length>0;
  const token=++gridToken;
  let idx=0;
  function makeCard(t){
    const d=document.createElement("div");
    d.className="tool-card";
    d.innerHTML='<div class="ic">'+t.icon+'</div><h3>'+t.name+'</h3><p>'+t.desc+'</p><span class="cat-tag">'+catName(t.cat)+'</span>';
    d.onclick=function(){openTool(t.id);};
    return d;
  }
  function renderChunk(first){
    if(token!==gridToken) return;
    const size=first?48:120;
    const end=Math.min(idx+size,arr.length);
    const frag=document.createDocumentFragment();
    for(;idx<end;idx++) frag.appendChild(makeCard(arr[idx].t));
    g.appendChild(frag);
    if(idx<arr.length) setTimeout(function(){renderChunk(false);},0);
  }
  renderChunk(true);
}
let lastScrollY=0;
function openTool(id){
  const t=TOOLS.find(function(x){return x.id===id;});
  if(!t) return;
  lastScrollY=window.scrollY||document.documentElement.scrollTop||0;
  $("#home").hidden=true;
  const v=$("#toolview"); v.hidden=false;
  RENDER[t.id](t);
  window.scrollTo(0,0);
}
function gotoCat(id){
  query=""; $("#q").value="";
  activeCat=id;
  buildSidebar(); buildGrid();
  window.scrollTo(0,0);
}
function showHome(){
  $("#toolview").hidden=true;
  $("#home").hidden=false;
  window.scrollTo(0,lastScrollY);
}
function doSearch(){
  query=$("#q").value.trim();
  const q=query.toLowerCase();
  if(q){
    const arr=[];
    TOOLS.forEach(function(t){
      const ni=t.name.toLowerCase().indexOf(q), di=t.desc.toLowerCase().indexOf(q);
      let s=0;
      if(ni===0) s=3; else if(ni>0) s=2; else if(di>=0) s=1; else return;
      arr.push({t:t,s:s});
    });
    arr.sort(function(a,b){return b.s-a.s;});
    if(arr.length>=4){
      const c0=arr[0].t.cat;
      if(c0!==activeCat&&arr[1].t.cat===c0&&arr[2].t.cat===c0){
        activeCat=c0; query=""; $("#q").value="";
        buildSidebar(); buildGrid(); window.scrollTo(0,0);
        return;
      }
    }
  }
  buildGrid();
}
$("#qbtn").onclick=doSearch;
$("#q").addEventListener("input",doSearch);
buildSidebar(); buildGrid();

</script>
</body>
</html>
